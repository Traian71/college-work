ucție, nu afirmație explicită, de aici nesiguranța.", "sigur": false, "figura": ""}, {"id": "c5-v52", "curs": 5, "tip": "vechi", "sursa": "GRILE FINAL (GRILE.RTF) – „In Fig. 2, memoriile reprezentate sunt de tip”", "intrebare": "În figură (arhitectură Harvard cu memoria A și memoria B, ca în Fig. 5.4), memoriile reprezentate sunt de tip:", "variante": ["memoria A uni-port", "memoria B uni-port", "memoria A dublu-port", "(b) și (c)"], "corecte": [1, 2, 3], "explicatie": "În sursă apar doar răspunsurile („Memoria A dublu-port (c), Memoria B uni-port (b), (b) și (c)”), variantele sunt reconstruite. Curs 5, 5.1, slide 8 / Fig. 5.4: arhitectură Harvard cu o memorie de date cu două porturi (A) și o memorie de program cu un singur port (B) – două accesări la A și una la B pe ciclu, prin trei seturi de magistrale.", "sigur": true, "figura": ""}, {"id": "c5-v53", "curs": 5, "tip": "vechi", "sursa": "GRILE FINAL (GRILE.RTF) – „Memoria B este de tip”", "intrebare": "În arhitectura din figură (memorie de date A și memorie de program B, ca în Fig. 5.4), memoria B este de tip:", "variante": ["uni-port", "dublu-port", "cu patru porturi", "memorie cache pentru date"], "corecte": [0], "explicatie": "Variante reconstruite (sursa dă doar răspunsul „Uni-port”). Curs 5, slide 8: memoria de program B are un singur port; memoria de date A are două porturi.", "sigur": true, "figura": ""}, {"id": "c5-v54", "curs": 5, "tip": "vechi", "sursa": "GRILE FINAL (GRILE.RTF) – pag. 7, curs 5", "intrebare": "Memoria de capacitate mică din interiorul procesorului, folosită pentru memorarea instrucțiunilor, poartă numele de:", "variante": ["cache pentru program", "memorie ROM internă", "memorie dual-port de date", "linie de întârziere"], "corecte": [0], "explicatie": "Variante reconstruite (sursa dă doar răspunsul). Curs 5, 5.2 (slide 10): memoria cache pentru program este o memorie de capacitate mică în interiorul procesorului, folosită pentru memorarea instrucțiunilor.", "sigur": true, "figura": ""}, {"id": "c5-v55", "curs": 5, "tip": "vechi", "sursa": "GRILE FINAL (GRILE.RTF) – pag. 11, curs 5", "intrebare": "Față de memoria dinamică, memoria statică:", "variante": ["este mai ușor de folosit și mai rapidă", "necesită o suprafață mai mare pentru integrarea pe chip și este mai scumpă", "trebuie reîmprospătată periodic", "are interfețe mai simple"], "corecte": [0, 1, 3], "explicatie": "Variante reconstruite din lista de răspunsuri din sursă (mai ușor de folosit, mai rapidă, mai scumpă, suprafață mai mare, interfețe mai simple). Curs 5, 5.5 „Memoria dinamică” (slide 17): SRAM e mai ușor de folosit și mai rapidă decât DRAM, dar necesită suprafață mai mare și e mai scumpă; interfețele cu SRAM sunt mai simple. Reîmprospătarea periodică e specifică DRAM.", "sigur": true, "figura": ""}, {"id": "c5-v56", "curs": 5, "tip": "vechi", "sursa": "GRILE FINAL (GRILE.RTF)", "intrebare": "Interfețele cu memoria externă ale procesoarelor de semnal diferă prin:", "variante": ["numărul de porturi de memorie", "flexibilitatea și complexitatea interfeței", "constrângerile privitoare la timpii de acces", "a, b și c"], "corecte": [3], "explicatie": "Curs 5, 5.5 (slide 14): interfețele diferă prin trei caracteristici principale: numărul de porturi de memorie, flexibilitatea și complexitatea interfeței și constrângerile privitoare la timpii de acces. Toate trei sunt adevărate, deci răspunsul este d („a, b și c”).", "sigur": true, "figura": ""}, {"id": "c5-v57", "curs": 5, "tip": "vechi", "sursa": "GRILE FINAL (GRILE.RTF)", "intrebare": "Arhitectura Harvard are:", "variante": ["memorie pentru instrucțiuni și memorie pentru date", "memorie pentru instrucțiuni și date și memorie numai pentru date", "un singur bloc de memorie pentru instrucțiuni și date, accesat printr-un singur set de magistrale", "primele 2 răspunsuri"], "corecte": [0, 1, 3], "explicatie": "Variante reconstruite; în sursă a doua variantă apare greșit („memorie pentru instrucțiuni și date și memorie pentru instrucțiuni”) și a fost corectată după curs. Curs 5, 5.1 (slide 7): Harvard standard – un bloc cu instrucțiunile, celălalt cu datele; varianta modificată de la DSP – un bloc cu instrucțiuni și date, celălalt numai cu date. c descrie arhitectura von Neumann. Nesigur din cauza textului reconstruit.", "sigur": false, "figura": ""}, {"id": "c5-v58", "curs": 5, "tip": "vechi", "sursa": "GRILE FINAL (GRILE.RTF) – „Organizarea memoriei din imagine”", "intrebare": "Organizarea memoriei din imagine (un singur bloc de memorie conectat la procesor printr-un singur set de magistrale de adrese și date) are structura de tip:", "variante": ["von Neumann", "Harvard", "Harvard modificată", "cu memorie multiport"], "corecte": [0], "explicatie": "Imaginea lipsește din sursă; răspunsul dat acolo este „Von Neumann”, deci figura e probabil Fig. 5.2 (slide 6). Curs 5, 5.1: structura cu un singur bloc, accesat printr-un singur set de magistrale de adrese și date, este arhitectura von Neumann. Nesigur pentru că figura nu se vede.", "sigur": false, "figura": ""}, {"id": "c5-v59", "curs": 5, "tip": "vechi", "sursa": "GRILE FINAL (GRILE.RTF)", "intrebare": "DMA este o tehnică cu ajutorul căreia datele pot fi transferate în și din memoria internă a procesorului:", "variante": ["fără intervenția acestuia", "numai prin instrucțiuni executate de procesor", "numai după pregătiri speciale în programul procesorului", "numai între două procesoare dintr-un sistem multiprocesor"], "corecte": [0], "explicatie": "Variante reconstruite (sursa dă doar „Fără ajutorul acestuia”). Curs 5, 5.5 (slide 18): DMA – datele sunt transferate în și din memoria internă a DSP fără intervenția acestuia; tehnică pur hardware, fără pregătiri în programe.", "sigur": true, "figura": ""}, {"id": "c5-v60", "curs": 5, "tip": "vechi", "sursa": "GRILE FINAL (GRILE.RTF)", "intrebare": "Memoria dinamică (DRAM) este mai rapidă decât memoria statică (SRAM).", "variante": ["Adevărat", "Fals"], "corecte": [1], "explicatie": "Curs 5, 5.5 (slide 17): memoria statică (SRAM) este mai ușor de folosit și mai rapidă decât memoria dinamică (DRAM). Întrebare Adevărat/Fals în sursă.", "sigur": true, "figura": ""}, {"id": "c5-v61", "curs": 5, "tip": "vechi", "sursa": "GRILE FINAL (GRILE.RTF)", "intrebare": "Procesoarele de semnal pot executa mai multe operații de citire sau de scriere din/în memorie într-un ciclu mașină.", "variante": ["Adevărat", "Fals"], "corecte": [0], "explicatie": "Capitol 5, introducere: „procesoarele de semnal pot executa mai multe operații de citire sau de scriere din/în memorie într-un ciclu-mașină” (ex. 4 accesări pentru MAC la FIR; Harvard, memorii rapide, multiport). Întrebare Adevărat/Fals în sursă.", "sigur": true, "figura": ""}, {"id": "c6-v62", "curs": 6, "tip": "vechi", "sursa": "psfinal Q2; PS_Grile (formular, nenumerotată); PS_Grile (1) (formular, nenumerotată); Grile_final – GRILE LINK-URI 6; Examen.pdf (Verificare 2, 17.01.2022) întrebarea 4 – bifat c, punctaj 3/3; v2_D.pdf (Lucrare de verificare 2, varianta D) întrebarea 5 – nemarcat (alte ordini ale variantelor)", "intrebare": "Din ce categorie de moduri de adresare face parte instrucțiunea „MUL a”, care are ca rezultat AX = AL * a, unde AX și AL sunt registrele procesorului folosite implicit pentru operația de înmulțire și „a” este o variabilă oarecare pe 8 biți?", "variante": ["adresare directă la memorie", "adresare implicită", "adresare imediată", "adresare directă la registru"], "corecte": [1], "explicatie": "Curs 6 / Capitol 6, 6.1: la adresarea implicită adresele operanzilor sunt indicate implicit de instrucțiune și nu pot fi schimbate (exemplul înmulțirii AT&T: X, Y → P). Enunțul subliniază că AX și AL sunt „folosite implicit” → adresare implicită. Nesigur doar pentru că „a” este o variabilă din memorie, ceea ce ar putea justifica și „directă la memorie” (o instrucțiune poate combina moduri). Răspunsul vizat de enunț este însă implicită; nu bifa imediată (a nu e constantă) și nici directă la registru (registrele nu pot fi alese).", "sigur": false, "figura": ""}, {"id": "c6-v63", "curs": 6, "tip": "vechi", "sursa": "psfinal Q3; PS_Grile (formular, apare de 2 ori); PS_Grile (1) (formular, apare de 2 ori); Grile_final Q31; Examen.pdf (Verificare 2, 17.01.2022) întrebarea 2 – bifat b, punctaj 3/3; subiect final 2024 1.pdf + subiect final 2024 2.jpg (Lucrare de verificare 2, varianta B) întrebarea 2 – încercuit „adresare indirectă cu registru” (a în acea variantă); v2_D.pdf (Lucrare de verificare 2, varianta D) întrebarea 3 – nemarcat", "intrebare": "Din ce categorie de moduri de adresare face parte instrucțiunea „A6 = A6 + *R6”, care are ca efect adunarea valorii stocate la locația de memorie indicată de conținutul registrului R6 la valoarea stocată în registrul acumulator A6?", "variante": ["adresare indirectă cu registru cu adresare modulo", "adresare indirectă cu registru", "adresare indirectă cu registru cu pre- sau post-incrementare", "adresare indirectă cu registru cu indexare"], "corecte": [1], "explicatie": "Curs 6 / Capitol 6, 6.5: exemplul „A0 = A0 + *R5” este dat exact ca adresare indirectă cu registru: „*R5” = conținutul locației indicate de R5. Fără ++/-- nu e pre/post-incrementare (6.6), fără al doilea registru/constantă nu e indexare (6.7), iar modulo (6.8) nu apare în instrucțiune.", "sigur": true, "figura": ""}, {"id": "c6-v64", "curs": 6, "tip": "vechi", "sursa": "psfinal Q9; PS_Grile (formular, apare de 2 ori); PS_Grile (1) (formular, apare de 2 ori); Grile_final Q33; Grile_final – GRILE LINK-URI 7; Examen.pdf (Verificare 2, 17.01.2022) întrebarea 6 – bifat b, punctaj 3/3; subiect final 2024 1.pdf + subiect final 2024 2.jpg (Lucrare de verificare 2, varianta B) întrebarea 4 – încercuit „adresare modulo” (d în acea variantă)", "intrebare": "Modul de adresare care folosește un buffer circular de tip FIFO este:", "variante": ["adresare indirectă cu registru cu adresare modulo", "adresare indirectă cu registru", "adresare indirectă cu registru cu pre- sau post-incrementare", "adresare indirectă cu registru cu indexare"], "corecte": [0], "explicatie": "Curs 6 / Capitol 6, 6.8: „Cea mai comună aplicație a acestui mod de adresare este implementarea unui buffer circular”; bufferele folosesc tehnica FIFO, iar capabilitatea se numește adresare modulo sau adresare circulară. Pointerii se actualizează tot prin pre/post-incrementare, dar modul cerut este cel modulo.", "sigur": true, "figura": ""}, {"id": "c6-v65", "curs": 6, "tip": "vechi", "sursa": "PS_Grile (formular, nenumerotată); PS_Grile (1) (formular, nenumerotată); Grile_final Q1", "intrebare": "La procesoarele care nu acceptă operația de inversare a biților implementată în unitatea de generare a adreselor, pentru generarea adreselor cu biții inversați este utilizată:", "variante": ["deplasarea", "comparația", "rotația", "instrucțiuni cu execuție condiționată"], "corecte": [2], "explicatie": "Cursul 6 (6.9) prezintă doar soluțiile hardware din AGU (bit în registrul de control la ADSP-210xx, aritmetica cu transport invers la DSP32C/DSP32xx) și nu spune ce se folosește când AGU nu o are. Răspunsul ține de setul de instrucțiuni (Curs 7): rotația e folosită la generarea adreselor cu biții inversați pe procesoarele fără suport în AGU. Nesigur pentru că textul Cursului 6 nu tranșează.", "sigur": false, "figura": ""}, {"id": "c6-v66", "curs": 6, "tip": "vechi", "sursa": "Grile_final – GRILE.RTF (fără variante, doar răspunsul; variantele sunt reconstituite)", "intrebare": "Instrucțiunea MOVE X:+(R0), A este de tip:", "variante": ["adresare indirectă cu registru cu pre-incrementare", "adresare indirectă cu registru cu post-incrementare", "adresare indirectă cu registru cu indexare", "adresare directă la memorie"], "corecte": [0], "explicatie": "Curs 6 / Capitol 6, 6.6: la Motorola DSP5600x, „MOVE X:-(R0), A1” e pre-decrementare (R0 modificat înainte de acces). Prin analogie, „+(R0)” cu semnul înaintea parantezei = pre-incrementare. Răspunsul din fișier e același; variantele au fost reconstituite.", "sigur": true, "figura": ""}, {"id": "c6-v67", "curs": 6, "tip": "vechi", "sursa": "Grile_final – GRILE.RTF (fără variante; variantele sunt reconstituite)", "intrebare": "Instrucțiunea AX1 = DM(1000) este de tip:", "variante": ["adresare directă la memorie", "adresare imediată", "adresare indirectă cu registru", "adresare directă la memorie paginată"], "corecte": [0], "explicatie": "Capitol 6, 6.4: „AX0 = DM(1000)” (ADSP-21xx) este exemplul de adresare directă la memorie (absolută): adresa 1000 e codată în instrucțiune. Nu e imediată, pentru că 1000 e adresă, nu valoare. Atenție: dacă apare și varianta „directă la registru”, ea se poate argumenta pentru destinația AX1.", "sigur": true, "figura": ""}, {"id": "c6-v68", "curs": 6, "tip": "vechi", "sursa": "Grile_final – GRILE.RTF (fără variante; variantele sunt reconstituite)", "intrebare": "Adresarea indirectă cu registru cu indexare poate avea forma:", "variante": ["MOVE Y1, X:(R5 + N6)", "A0 = A0 + *R5++R17", "MOVE #1234, A", "LDI *+AR1(2), R0"], "corecte": [0, 3], "explicatie": "Capitol 6, 6.7: „MOVE Y1, X:(R5 + N6)” (DSP5600x) este exemplul de indexare cu doi registri, iar „LDI *+AR1(2), R0” (TMS320C3x) este indexare cu valoare index imediată (folosită pentru argumentele din stivă). „*R5++R17” e post-incrementare cu offset (6.6), „MOVE #1234, A” e imediată (6.10). În fișier apare doar prima formă.", "sigur": true, "figura": ""}, {"id": "c6-v69", "curs": 6, "tip": "vechi", "sursa": "Grile_final – GRILE.RTF („A = A + R2*++”; enunț și variante reconstituite)", "intrebare": "Dacă R2 = 0x0000, după execuția instrucțiunii A = A + *R2++ registrul R2 devine:", "variante": ["0x0000", "0x0001", "0xFFFF", "0x0002"], "corecte": [1], "explicatie": "Capitol 6, 6.6: la „*R5++” registrul de adrese este incrementat cu unu după ce a fost folosit la accesare (post-incrementare). Nota din fișier: R2 = 0x0000 + 1 = 0x0001. Valoarea inițială a lui R2 vine din figura de laborator, care lipsește.", "sigur": true, "figura": ""}, {"id": "c6-v70", "curs": 6, "tip": "vechi", "sursa": "Grile_final – GRILE.RTF („A = A + *R6++R4, A = 5 → A = 8”; enunț și variante reconstituite)", "intrebare": "Dacă inițial A = 5 (memoria și registrele din figura de laborator), cât devine A după A = A + *R6++R4?", "variante": ["5", "8", "valoarea lui R4", "5 + R4"], "corecte": [1], "explicatie": "Capitol 6, 6.6 (*R5++R17): A primește A + conținutul locației de memorie indicate de R6 (adresa de dinainte de modificare), apoi R6 crește cu valoarea din R4. A nu crește cu R4. Răspunsul 8 e cel din fișier și presupune că la adresa din R6 se află 3; figura lipsește, deci nu se poate verifica.", "sigur": false, "figura": ""}, {"id": "c6-v71", "curs": 6, "tip": "vechi", "sursa": "Grile_final – GRILE.RTF („AX0 = DM(0X0002) → 1”; enunț și variante reconstituite)", "intrebare": "După execuția instrucțiunii AX0 = DM(0x0002) (memoria din figura de laborator), AX0 conține:", "variante": ["0x0002", "conținutul locației de memorie 0x0002 (în fișier: 1)", "adresa registrului AX0", "0"], "corecte": [1], "explicatie": "Capitol 6, 6.4: „AX0 = DM(1000)” încarcă în AX0 datele de la locația 1000 (adresare directă la memorie), nu valoarea 1000. Valoarea concretă (1) vine din figura care lipsește.", "sigur": false, "figura": ""}, {"id": "c6-v72", "curs": 6, "tip": "vechi", "sursa": "Grile_final – GRILE.RTF („AX0 = DM(0X102) → 110 = 6”; enunț și variante reconstituite)", "intrebare": "După execuția instrucțiunii AX0 = DM(0x102) (memoria din figura de laborator), AX0 conține:", "variante": ["0x102", "conținutul locației de memorie 0x102 (în fișier: 110b = 6)", "0x103", "conținutul registrului de adresă R2"], "corecte": [1], "explicatie": "Capitol 6, 6.4: adresare directă la memorie, deci în AX0 ajunge conținutul locației 0x102, nu adresa. Valoarea concretă (6) vine din figura care lipsește.", "sigur": false, "figura": ""}, {"id": "c6-v73", "curs": 6, "tip": "vechi", "sursa": "Grile_final – GRILE.RTF („A0 = A0 + R2*++R6”, typo pentru *R2++R6; variante reconstituite)", "intrebare": "Dacă R2 = 0x0103 și R6 = 0x00FB, în urma operației A0 = A0 + *R2++R6 valoarea registrului R2 devine:", "variante": ["0x0103", "0x01FE", "0x0104", "0x00FB"], "corecte": [1], "explicatie": "Capitol 6, 6.6: la „*R5++R17” registrul de adrese R5 este incrementat, după acces, cu valoarea din registrul offset R17. Aici R2 = 0x0103 + 0x00FB = 0x01FE (calculul din fișier). R2 crește cu R6, nu cu 1.", "sigur": true, "figura": ""}, {"id": "c6-v74", "curs": 6, "tip": "vechi", "sursa": "Grile_final – GRILE.RTF („A0 = A0 + *R7-- = 5 – 1 = 4”; enunț și variante reconstituite)", "intrebare": "Dacă valoarea inițială a lui A0 este 5, cât devine A0 în urma operației A0 = A0 + *R7-- (memoria din figura de laborator)?", "variante": ["4", "5", "5 + conținutul locației indicate de R7", "6"], "corecte": [2], "explicatie": "Capitol 6, 6.6: „A0 = A0 + *R5--” adună valoarea din locația indicată de R5 la A0, iar apoi DECREMENTEAZĂ R5, nu A0. Nota din fișier (5 – 1 = 4) pare să confunde decrementarea registrului de adrese cu o scădere din A0; 4 ar fi corect doar dacă la adresa din R7 s-ar afla −1. Fără figură, varianta sigură conceptual este „5 + conținutul locației indicate de R7”.", "sigur": false, "figura": ""}, {"id": "c6-v75", "curs": 6, "tip": "vechi", "sursa": "Grile_final – GRILE.RTF („Rezultatul operației 16 modul 5 este: 1”; variante reconstituite)", "intrebare": "Rezultatul operației 16 modulo 5 este:", "variante": ["1", "3", "0", "11"], "corecte": [0], "explicatie": "Capitol 6, 6.8: la aritmetica modulo rezultatul care depășește valoarea maximă e ajustat prin scăderea repetată a acesteia până intră în domeniu (14 modulo 12 = 2). 16 − 5 − 5 − 5 = 1.", "sigur": true, "figura": ""}, {"id": "c6-v76", "curs": 6, "tip": "vechi", "sursa": "Grile_final – GRILE.RTF („A0 = A0 + *R3++ → R3 = 0x100”; enunț și variante reconstituite)", "intrebare": "Dacă valoarea inițială a lui A0 este 5, cât devine registrul R3 în urma operației A0 = A0 + *R3++ (registrele din figura de laborator)?", "variante": ["valoarea inițială a lui R3 + 1 (în fișier: 0x100)", "valoarea inițială a lui R3 − 1", "6", "neschimbat"], "corecte": [0], "explicatie": "Capitol 6, 6.6: după acces R3 este post-incrementat cu unu și indică locația de memorie următoare; A0 nu influențează R3. Răspunsul 0x100 din fișier presupune R3 = 0x0FF inițial (figura lipsește).", "sigur": false, "figura": ""}, {"id": "c2-v77", "curs": 2, "tip": "vechi", "sursa": "Examen.pdf (Verificare 2, 17.01.2022) întrebarea 7 – bifat c, punctaj 3/3; subiect final 2024 1.pdf + subiect final 2024 2.jpg (Lucrare de verificare 2, varianta B) întrebarea 8 – încercuit „buclare hardware” (a în acea variantă); v2_D.pdf (Lucrare de verificare 2, varianta D) întrebarea 8 – nemarcat", "intrebare": "Care din următoarele facilități sunt specifice procesoarelor de semnal pentru execuția buclelor?", "variante": ["sunt identice cu cele de la procesoarele de uz general", "registre speciale pe post de contor de buclă", "buclare hardware pentru execuția buclelor fără cicluri mașină suplimentare", "instrucțiuni de salt (software)"], "corecte": [2], "explicatie": "Curs 2, §2.1 Procesoare PDS (6/7), „Controlul specializat al funcționării”: procesoarele PDS oferă suport eficient pentru bucle, o instrucțiune de buclare sau „repeat” care implementează ciclurile for-next fără mărirea ciclului instrucțiune pentru actualizarea/testarea contorului sau saltul înapoi, adică buclare hardware fără cicluri suplimentare. Registre speciale de contor nu sunt menționate în curs. Punctajul 3/3 cu doar c bifat confirmă.", "sigur": true, "figura": ""}, {"id": "c1-n78", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Cerințele specifice algoritmilor PDS sunt satisfăcute prin:", "variante": ["arhitecturi cu grad mare de paralelism combinate cu execuția pipeline a instrucțiunilor", "implementarea unității de comandă prin microprogramare", "facilități hardware pentru execuția eficientă a buclelor de instrucțiuni", "moduri de adresare specifice (pre/post incrementare/decrementare, inversarea biților, modulo)"], "corecte": [0, 2, 3], "explicatie": "Curs 1 §1.2 (2/6). Unitatea de comandă e implementată în LOGICĂ CABLATĂ; microprogramarea e specifică procesoarelor de uz general (Capitol 1 §1.1 g).", "sigur": true, "figura": ""}, {"id": "c1-n79", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Modulele incluse în circuitul procesoarelor PDS pentru creșterea productivității sunt:", "variante": ["multiplicator hardware de tip paralel", "circuite pentru deplasări binare", "memorii interne pentru date și programe", "stivă internă"], "corecte": [0, 1, 2, 3], "explicatie": "Curs 1 §1.2 (2/6), cuvânt cu cuvânt: „multiplicator hardware de tip paralel, circuite pentru deplasări binare, memorii interne pentru date și programe, stivă internă”.", "sigur": true, "figura": ""}, {"id": "c1-n80", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Arhitectura Harvard se caracterizează prin:", "variante": ["memorii separate pentru coduri și pentru date, cu căi separate de transfer", "o singură memorie pentru coduri și date, accesată pe o singură magistrală", "fragmentarea activităților și executarea lor pe unități funcționale distincte", "posibilitatea transferului operanzilor simultan cu extragerea codurilor"], "corecte": [0, 3], "explicatie": "Capitol 1 §1.1 a): Harvard are memorii separate pentru coduri și date și căi separate de transfer, „în acest mod este posibil transferul operanzilor simultan cu extragerea codurilor”. b descrie Von Neumann, c descrie pipeline-ul.", "sigur": true, "figura": ""}, {"id": "c1-n81", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Unitatea de comandă a procesoarelor PDS:", "variante": ["este realizată prin microprogramare, ca la procesoarele de uz general", "este realizată în logică cablată", "este mai flexibilă, dar mai lentă decât cea microprogramată", "permite obținerea unei viteze mai mari de lucru, deși este mai puțin flexibilă"], "corecte": [1, 3], xplicatie": "Curs 2, §2.1 (2/7), Tabelul 2.2: cele cinci caracteristici sunt MAC rapidă, arhitectura multiacces a memoriei, moduri de adresare specializate, controlul specializat al funcționării, periferice și interfețe I/O. Toate cele patru variante sunt în listă.", "sigur": true, "figura": ""}, {"id": "c2-n85", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Referitor la operația de multiplicare-acumulare (MAC) a procesoarelor PDS, sunt adevărate afirmațiile:", "variante": ["se execută într-un singur ciclu instrucțiune", "se realizează cu un multiplicator și un acumulator integrate în unitatea de generare a adreselor", "este utilă în filtrarea digitală, corelație și calculul transformatei Fourier", "produce inevitabil depășire de scală la acumularea unui număr mare de produse"], "corecte": [0, 2], "explicatie": "Curs 2, §2.1 (3/7): MAC într-un singur ciclu instrucțiune, utilă la produsul a doi vectori (filtrare, corelație, transformata Fourier). Multiplicatorul și acumulatorul sunt integrate în calea de date, nu în unitatea de adresare, iar biții suplimentari din acumulatoare permit MAC fără overflow.", "sigur": true, "figura": ""}, {"id": "c2-n86", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Arhitectura multiacces a memoriei permite procesorului PDS:", "variante": ["să extragă simultan o instrucțiune și operanzii pentru instrucțiune", "să efectueze o singură accesare la memorie la fiecare ciclu instrucțiune", "să stocheze rezultatul instrucțiunii anterioare în memorie în același ciclu", "să acceseze multiplu memoria externă cu orice instrucțiune"], "corecte": [0, 2], "explicatie": "Curs 2, §2.1 (4/7): multiaccesul permite „să extragă simultan o instrucțiune și operanzii pentru instrucțiune sau să stocheze rezultatul instrucțiunii anterioare în memorie”. Accesarea multiplă e restricționată la locații din cip și la anumite instrucțiuni, deci d e falsă.", "sigur": true, "figura": ""}, {"id": "c2-n87", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Facilitățile de control specializat al funcționării oferite de unele procesoare PDS sunt:", "variante": ["instrucțiune de buclare sau instrucțiune „repeat” pentru cicluri for-next", "comutarea rapidă a contextului și latența redusă", "executarea întreruperilor cu încărcare minimă", "mărirea ciclului instrucțiune pentru actualizarea și testarea contorului de buclă"], "corecte": [0, 1, 2], "explicatie": "Curs 2, §2.1 (6/7): instrucțiunea de buclare/„repeat” implementează ciclurile for-next „fără mărirea ciclului instrucțiune” prin actualizarea și testarea contorului; alte facilități: comutarea rapidă a contextului și latența redusă, întreruperi cu încărcare minimă, operații I/O rapide. Varianta d e opusul.", "sigur": true, "figura": ""}, {"id": "c2-n88", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Care dintre următoarele sunt variante constructive de procesoare PDS?", "variante": ["cipurile multiprocesor", "microprocesoarele de uz general", "hardware-ul personalizat", "multiprocesoarele"], "corecte": [0, 3], "explicatie": "Curs 2, §2.2 (1/7): variantele constructive sunt module multicip, cipuri multiprocesor, seturi de circuite, nuclee PDS, procesoare PDS personalizate, multiprocesoarele. Microprocesoarele de uz general și hardware-ul personalizat sunt alternative pentru procesoarele PDS (§2.3).", "sigur": true, "figura": ""}, {"id": "c2-n89", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Alternativele pentru procesoarele PDS prezentate în curs sunt:", "variante": ["microprocesoarele de uz general", "modulele multicip", "calculatoarele personale și stațiile de lucru", "hardware-ul personalizat"], "corecte": [0, 2, 3], "explicatie": "Curs 2, §2.3 (1/3–3/3): alternativele sunt microprocesoarele de uz general, calculatoarele personale și stațiile de lucru, hardware-ul personalizat. Modulele multicip sunt o variantă constructivă (§2.2).", "sigur": true, "figura": ""}, {"id": "c3-n90", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Valoarea zecimală a numărului 10101100, în virgulă fixă cu aritmetică întreagă pe 8 biți (complement față de 2), este:", "variante": ["172", "84", "-44", "-84"], "corecte": [3], "explicatie": "Curs 3, slide aritmetică întreagă, Exemplul 2: –2^7 + 2^5 + 2^3 + 2^2 = –128 + 32 + 8 + 4 = –84. 172 = citire fără semn.", "sigur": true, "figura": ""}, {"id": "c3-n91", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Numărul 11010000, în virgulă fixă cu aritmetică fracționară pe 8 biți, are valoarea:", "variante": ["-48", "-0,375", "0,8125", "-0,625"], "corecte": [1], "explicatie": "Curs 3, slide aritmetică fracționară (ponderi –2^0, 2^-1, 2^-2, …): –1 + 0,5 + 0,125 = –0,375. 0,8125 = fără semn, –48 = citire ca întreg.", "sigur": true, "figura": ""}, {"id": "c3-n92", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Pentru numărul în virgulă mobilă 0100000000111110 (mantisa pe 10 biți, exponentul pe 6 biți), sunt adevărate:", "variante": ["valoarea numărului este 2;", "mantisa are valoarea 0,5;", "valoarea numărului este 0,125;", "exponentul are valoarea -2;"], "corecte": [1, 2, 3], "explicatie": "Curs 3, slide 10: mantisa 0100000000 = 2^-1 = 0,5; exponent 111110 = –32+16+8+4+2 = –2; 0,5 × 2^-2 = 0,125. 2 ar rezulta cu exponent +2.", "sigur": true, "figura": ""}, {"id": "c3-n93", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Despre gama dinamică, sunt adevărate:", "variante": ["folosind același număr de biți, formatul cu virgulă mobilă asigură o gamă dinamică mult mai mare decât cel cu virgulă fixă;", "pentru formatul fracționar în virgulă fixă pe 32 de biți este aproximativ 2,15 × 10^9 (≈ 187 dB);", "este raportul dintre cel mai mare și cel mai mic număr reprezentabil într-un anumit format de date;", "pentru formatul în virgulă mobilă pe 32 de biți (mantisă 24 biți, exponent 8 biți) este aproximativ 5,79 × 10^76 (peste 1535 dB);"], "corecte": [0, 1, 2, 3], "explicatie": "Curs 3 / Capitol 3, §3.1 Gama dinamică: definiția (raport), valorile numerice (2,15·10^9 ator cu 8 biți de gardă permite adunarea fără depășire a până la:", "variante": ["8 valori", "16 valori", "256 valori", "2⁸ valori"], "corecte": [2, 3], "explicatie": "Curs 4 §4.1: un acumulator cu n biți de gardă face posibilă adunarea a până la 2ⁿ valori fără depășire; 2⁸ = 256.", "sigur": true, "figura": ""}, {"id": "c4-n97", "curs": 4, "tip": "nou", "sursa": "nou", "intrebare": "Procesoarele ADSP-21xx (Analog Devices) au acumulatoare pe 40 biți și multiplicatoare pe 32 biți. Câți biți de gardă asigură?", "variante": ["4", "8", "32", "40"], "corecte": [1], "explicatie": "Capitol 4 §4.1 Regiștrii acumulator: ADSP-21xx asigură opt biți de gardă (40 − 32 = 8); DSP16xx asigură patru.", "sigur": true, "figura": ""}, {"id": "c4-n98", "curs": 4, "tip": "nou", "sursa": "nou", "intrebare": "Deplasatorul (shifter) din calea de date în virgulă fixă:", "variante": ["scalează (multiplică) ieșirea cu o putere a lui doi", "ușurează selecția setului de biți ai rezultatului folosit la etapa următoare", "poate fi plasat imediat după multiplicator și ALU sau între multiplicator și ALU", "poate fi de tip barrel shifter, care face deplasări cu mai multe ranguri binare într-un singur ciclu de tact"], "corecte": [0, 1, 2, 3], "explicatie": "Curs 4 §4.1 Deplasatorul și Capitol 4: toate variantele sunt descrise acolo (rolul, amplasarea, barrel shifter-ul).", "sigur": true, "figura": ""}, {"id": "c4-n99", "curs": 4, "tip": "nou", "sursa": "nou", "intrebare": "Aritmetica cu saturare:", "variante": ["folosește un circuit special care detectează apariția depășirii scalei", "înlocuiește valoarea eronată cu cel mai mare număr pozitiv sau cel mai mic număr negativ reprezentabil, după direcția depășirii", "furnizează întotdeauna rezultatul corect", "este implementată de o unitate hardware numită de unii producători limitator"], "corecte": [0, 1, 3], "explicatie": "Curs 4 §4.1 Depășirea și saturația; Capitol 4: rezultatul saturat este „desigur incorect”, dar eroarea e mai mică (c fals); unitatea  6, "tip": "nou", "sursa": "nou", "intrebare": "Ce mod de adresare folosește instrucțiunea de înmulțire „P = X * Y” a procesorului DSP16xx (AT&T), care ar putea fi scrisă simplu „*”?", "variante": ["adresare directă la registru", "adresare implicită", "adresare imediată", "adresare indirectă cu registru"], "corecte": [1], "explicatie": "Curs 6 / Capitol 6, 6.1: toate instrucțiunile de înmulțire AT&T folosesc X și Y și depun rezultatul în P; programatorul nu poate specifica alte registre, deci adresarea e implicită. Nu e directă la registru tocmai pentru că registrele nu pot fi alese.", "sigur": true, "figura": ""}, {"id": "c6-n109", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Instrucțiunea „A0 = A0 + *R5++” a procesorului DSP32xx:", "variante": ["folosește adresarea indirectă cu registru cu post-incrementare", "folosește adresarea indirectă cu registru cu pre-incrementare", "folosește adresarea indirectă cu registru cu indexare", "după adunare R5 indică locația de memorie următoare"], "corecte": [0, 3], "explicatie": "Curs 6 / Capitol 6, 6.6: adună valoarea de la locația indicată de R5 cu A0 și APOI incrementează R5 ca să indice locația următoare. Modificarea după folosire = post-incrementare.", "sigur": true, "figura": ""}, {"id": "c6-n110", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Despre instrucțiunea „A0 = A0 + *R5++R17” (DSP32xx) sunt adevărate:", "variante": ["R17 este registrul pentru offset", "după accesarea memoriei, R5 este incrementat cu valoarea stocată în R17", "aceeași formă poate fi folosită pentru decrementare, deoarece R17 poate fi negativ", "R5 și R17 rămân nemodificate, adresa efectivă fiind R5 + R17"], "corecte": [0, 1, 2], "explicatie": "Capitol 6, 6.6: registrul cu valoarea de incrementare se numește registru pentru offset (Analog Devices: registru modificator); R17 poate fi negativ. Varianta d descrie indexarea (6.7), unde registrele nu se modifică.", "sigur": true, "figura": ""}, {"id": "c6-n111", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Despre instrucțiunea „MOVE Y1, X:(R5 + N6)” (DSP5600x) sunt adevărate:", "variante": ["folosește adresarea indirectă cu registru cu indexare", "registrele R5 și N6 nu sunt modificate", "N6 poartă denumirea de registru index", "valoarea din Y1 este mutată în spațiul de adresare X, la adresa egală cu suma valorilor din R5 și N6"], "corecte": [0, 1, 2, 3], "explicatie": "Capitol 6, 6.7: toate cele patru afirmații reproduc explicația exemplului de indexare din curs.", "sigur": true, "figura": ""}, {"id": "c6-n112", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Referitor la adresarea indirectă cu registru cu aritmetică a adreselor modulo, sunt adevărate afirmațiile:", "variante": ["cea mai comună aplicație a acestui mod de adresare este implementarea unui buffer circular", "bufferele folosesc tehnica FIFO, cu un pointer de citire și un pointer de scriere", "elimină necesitatea verificării de către programator a depășirii bufferului de către pointeri și a ajustării acestora", "necesită alocarea dinamică a memoriei pentru buffer la fiecare operație de scriere"], "corecte": [0, 1, 2], "explicatie": "Curs 6 / Capitol 6, 6.8: buffer circular, FIFO, doi pointeri; modulo face automat verificarea și readuce pointerul la început. La sistemele în timp real alocarea dinamică e prea scumpă, de aceea programatorul rezervă dinainte memoria (d fals).", "sigur": true, "figura": ""}, {"id": "c6-n113", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Pentru o FFT în baza 2 cu 8 puncte, ordinea cu biții inversați a indicilor 0, 1, 2, …, 7 este:", "variante": ["0, 4, 2, 6, 1, 5, 3, 7", "0, 1, 2, 3, 4, 5, 6, 7", "7, 6, 5, 4, 3, 2, 1, 0", "0, 2, 4, 6, 1, 3, 5, 7"], "corecte": [0], "explicatie": "Curs 6, 6.9 (figura FFT cu opt puncte) / Capitol 6, Fig. 6.3: ieșirea numărătorului binar scrisă cu biții în ordine inversă (LSB primul): 001 → 100 = 4, 010 → 010 = 2, 011 → 110 = 6 etc.", "sigur": true, "figura": ""}], "formule": "# PS L1 – toate calculele care pot pica\n\nFormatele și convențiile sunt **exact ca în Cursul 3 și Cursul 4** (aceleași exemple ca în slide-uri și în grilele vechi).\nToate exemplele de mai jos sunt verificate numeric.\n\n---\n\n## 0. Ce trebuie să știi pe de rost\n\nPonderile sunt scrise **în ordinea în care citești biții, de la stânga la dreapta** (primul bit = cel mai mare).\n\n**Întreg pe 8 biți** (aritmetică întreagă):\n\n| bit | 1 | 0 | 1 | 0 | 0 | 1 | 0 | 0 |\n|---|---|---|---|---|---|---|---|---|\n| pondere | **−2⁷** | 2⁶ | 2⁵ | 2⁴ | 2³ | 2² | 2¹ | 2⁰ |\n| valoare | **−128** | 64 | 32 | 16 | 8 | 4 | 2 | 1 |\n\n→ 10100100 = −128 + 32 + 4 = **−92** (aduni ponderile de sub biții de 1).\n\n**Fracționar pe 8 biți** (virgula e imediat după primul bit):\n\n| bit | 1 | • | 0 | 1 | 1 | 0 | 0 | 0 | 0 |\n|---|---|---|---|---|---|---|---|---|---|\n| pondere | **−2⁰** | | 2⁻¹ | 2⁻² | 2⁻³ | 2⁻⁴ | 2⁻⁵ | 2⁻⁶ | 2⁻⁷ |\n| valoare | **−1** | | 0,5 | 0,25 | 0,125 | 0,0625 | 0,03125 | 0,015625 | 0,0078125 |\n\n→ 10110000 = −1 + 0,25 + 0,125 = **−0,625**.\n\nÎn curs și în grile apar doar aceste formate: **8 biți** (întreg sau fracționar) și virgulă mobilă cu **mantisă 10 +\nexponent 6** sau **mantisă 5 + exponent 3 (sau 5)**. Ponderile exponentului: pe 3 biți **−4, 2, 1**; pe 5 biți\n**−16, 8, 4, 2, 1**; pe 6 biți **−32, 16, 8, 4, 2, 1**.\n\n**Regula de aur (complement față de 2):** bitul cel mai din stânga (MSB) are pondere **negativă**; restul pozitive.\nAduni ponderile biților care sunt 1. Atât.\n\n- MSB = 0 → număr pozitiv; MSB = 1 → număr negativ.\n- **Scurtătură:** valoare = (citit fără semn) − 2ᴺ dacă MSB = 1. Ex: 10100100 fără semn = 164 → 164 − 256 = **−92**.\n- **Negare:** inversezi toți biții și aduni 1. Ex: 92 = 01011100 → 10100011 + 1 = **10100100** = −92.\n- **Extensia semnului:** când lungești un număr, copiezi MSB-ul la stânga (1101 = 11111101 = −3).\n\n---\n\n## 1. Virgulă fixă – aritmetică întreagă (N biți)\n\nPonderi: **−2ᴺ⁻¹, 2ᴺ⁻², …, 2¹, 2⁰**. Pe 8 biți: −128, 64, 32, 16, 8, 4, 2, 1.\n\n- Interval: **[−2ᴺ⁻¹, 2ᴺ⁻¹ − 1]** → pe 8 biți: −128 … 127; pe 16 biți: −32768 … 32767.\n- Pasul (rezoluția) = 1.\n\n| Binar (8 biți) | Calcul | Zecimal |\n|---|---|---|\n| 01010011 | 64 + 16 + 2 + 1 | **83** (exemplul 1 din curs) |\n| 10101100 | −128 + 32 + 8 + 4 | **−84** (exemplul 2 din curs) |\n| 10100100 | −128 + 32 + 4 | **−92** (grila veche) |\n| 11001001 | −128 + 64 + 8 + 1 | **−55** |\n| 11111111 | −128 + 127 | **−1** |\n| 10000000 | −128 | **−128** (cel mai negativ, „NMAX”) |\n| 01111111 | 127 | **127** (cel mai mare) |\n\n**Capcană:** 164 este citirea *fără semn* a lui 10100100, deci varianta greșită din grilă.\n\n---\n\n## 2. Virgulă fixă – aritmetică fracționară (N biți, format Q1.N−1)\n\nVirgula este imediat după bitul de semn. Ponderi: **−2⁰, 2⁻¹, 2⁻², …, 2⁻⁽ᴺ⁻¹⁾** → pe 8 biți: −1, 0,5, 0,25, 0,125,\n0,0625, 0,03125, 0,015625, 0,0078125.\n\n- **Formula rapidă:** valoare = (valoarea ca întreg cu semn) / 2ᴺ⁻¹. Ex: 10110000 = −80 → −80 / 128 = **−0,625**.\n- Interval: **[−1, 1 − 2⁻⁽ᴺ⁻¹⁾]** (−1 se poate reprezenta, +1 nu).\n- Pasul (cel mai mic număr pozitiv) = **2⁻⁽ᴺ⁻¹⁾**: pe 8 biți 2⁻⁷ = 0,0078125; pe 16 biți 2⁻¹⁵; pe 32 biți 2⁻³¹.\n\n| Binar (8 biți) | Calcul | Zecimal |\n|---|---|---|\n| 01010000 | 0,5 + 0,125 | **0,625** (exemplul 1 din curs, grila veche) |\n| 10101000 | −1 + 0,25 + 0,0625 | **−0,6875** (exemplul 2 din curs) |\n| 10110000 | −1 + 0,25 + 0,125 | **−0,625** (grila veche) |\n| 10100000 | −1 + 0,25 | **−0,75** |\n| 11010000 | −1 + 0,5 + 0,125 | **−0,375** |\n| 01100000 | 0,5 + 0,25 | **0,75** |\n| 01000000 | 0,5 | **0,5** |\n| 10000000 | −1 | **−1** |\n| 01111111 | 1 − 2⁻⁷ | **0,9921875** (cel mai mare) |\n\n**Zecimal → binar fracționar:** înmulțești cu 2ᴺ⁻¹, rotunjești la întreg, scrii întregul în complement față de 2.\nEx: −0,375 pe 8 biți → −0,375 · 128 = −48 → 48 = 00110000 → inversat + 1 = **11010000**.\n\n**Întreg vs fracționar = același hardware.** Diferența principală e **modul în care se tratează rezultatul înmulțirii**\n(ce jumătate din produs păstrezi): la întregi partea de jos, la fracționar partea de sus (Curs 3 și 4).\n\n---\n\n## 3. Virgulă mobilă (formatul din curs)\n\nCuvântul are **mantisa (M) în stânga** și **exponentul (E) în dreapta**:\n\n| Mantisă: −2⁰ • 2⁻¹ 2⁻² 2⁻³ 2⁻⁴ … | Exponent: −2ᵏ⁻¹ … 2¹ 2⁰ |\n|---|---|\n\n- **Mantisa** = număr **fracționar** în complement față de 2 (ca la secțiunea 2).\n- **Exponentul** = număr **întreg** în complement față de 2 (ca la secțiunea 1).\n- **valoare = mantisa × 2^exponent**\n\n**Pașii (mereu aceiași):**\n1. Tai cuvântul: primii m biți = mantisa, ultimii k biți = exponentul (enunțul îți spune m și k).\n2. Exponent: ponderi −2ᵏ⁻¹ … 1 (pe 3 biți: −4, 2, 1; pe 5 biți: −16, 8, 4, 2, 1; pe 6 biți: −32, 16, 8, 4, 2, 1).\n3. Mantisă: ponderi −1, 0,5, 0,25, 0,125, 0,0625, …\n4. Înmulțești mantisa cu 2^E (E pozitiv = mut virgula la dreapta, E negativ = la stânga).\n\n### Pas cu pas: 1100000000111110, mantisă 10 biți, exponent 6 biți\n\n1. Tai după 10 biți: mantisa **1100000000**, exponentul **111110**.\n2. Exponentul (ponderi −32, 16, 8, 4, 2, 1): 1·(−32) + 1·16 + 1·8 + 1·4 + 1·2 + 0·1 = **−2**.\n3. Mantisa (ponderi −1, 0,5, 0,25, …): 1·(−1) + 1·0,5 = **−0,5** (restul sunt 0).\n4. Valoarea: −0,5 × 2⁻² = −0,5 × 0,25 = **−0,125**.\n\n(Cursul face același lucru mutând virgula: exponent −2 = virgula mutată 2 poziții la stânga.)\n\n### Exemplele din curs (mantisă 10 biți, exponent 6 biți)\n\n| Cuvânt | Mantisă | Exponent | Valoare |\n|---|---|---|---|\n| 0110100000 000011 | 0,5 + 0,25 + 0,0625 = 0,8125 | 3 | 0,8125 × 8 = **6,5** |\n| 0100000000 111110 | 0,5 | −32+16+8+4+2 = −2 | 0,5 × ¼ = **0,125** |\n| 1110100000 000011 | −1 + 0,5 + 0,25 + 0,0625 = −0,1875 | 3 | −0,1875 × 8 = **−1,5** |\n| 1100000000 111110 | −1 + 0,5 = −0,5 | −2 | −0,5 × ¼ = **−0,125** (grila veche) |\n\n### Din grilele vechi (mantisă 5 biți, exponent 3 sau 5 biți)\n\n| Cuvânt | Format | Mantisă | Exponent | Valoare |\n|---|---|---|---|---|\n| 10010 001 | 5 + 3 | −1 + 0,125 = −0,875 | 1 | **−1,75** |\n| 01001 011 | 5 + 3 | 0,5 + 0,0625 = 0,5625 | 3 | **4,5** |\n| 10100 001 | 5 + 3 | −1 + 0,25 = −0,75 | 1 | **−1,5** |\n| 11101 11001 | 5 + 5 | −1+0,5+0,25+0,0625 = −0,1875 | −16+8+1 = **−7** | −0,1875 × 2⁻⁷ ≈ −0,00146 |\n| 01000 111 | 5 + 3 | 0,5 | −4+2+1 = −1 | **0,25** |\n\n**Atenție:** dacă grila întreabă doar „valoarea exponentului”, răspunsul e doar E (ex: −7), nu valoarea finală.\n\n### Zecimal → virgulă mobilă (invers)\nScrii numărul ca **M × 2^E** cu M între −1 și 1 (de obicei |M| ≥ 0,5), apoi codezi M fracționar și E întreg.\n- 3,25 = 0,8125 × 2² → M = 01101, E = 010 → **01101010** (5 + 3).\n- −3 = −0,75 × 2² → M = −0,75 = 10100, E = 010 → **10100010** (5 + 3).\n\n---\n\n## 4. Gama dinamică și precizia\n\n**Gama dinamică = cel mai mare număr / cel mai mic număr (pozitiv) reprezentabil.** În decibeli: **GD[dB] = 20 · log₁₀(GD)**.\n\nCifrele din curs (de recunoscut, nu de calculat):\n\n| Format | Max | Min | Gama dinamică | dB |\n|---|---|---|---|---|\n| Fix fracționar 32 biți | 1 − 2⁻³¹ | 2⁻³¹ | **≈ 2,15 × 10⁹** | **≈ 187** |\n| Mobil 32 biți: 24 mantisă + 8 exp. | 3,40 × 10³⁸ | 5,88 × 10⁻³⁹ | **≈ 5,79 × 10⁷⁶** | **> 1535** |\n\n- Din curs: telecom ~**50 dB** e suficient; audio de înaltă fidelitate ~**90 dB**.\n- La același număr de biți, **virgula mobilă are gamă dinamică mult mai mare**.\n\n**Precizia:**\n- **Eroarea de cuantizare** = eroarea introdusă când treci la un format cu mai puțini biți (ex. 1,325 → 1,33: eroare 0,005).\n- **Precizia maximă [biți] = log₂(|valoarea maximă| / |eroarea maximă de cuantizare|)**.\n- Virgulă fixă: precizia maximă = **numărul de biți din format**.\n- Virgulă mobilă: precizia maximă = **numărul de biți din mantisă** (24 la formatul pe 32 de biți).\n\n**IEEE 754 (cum e dat în curs):** precizie simplă **32 biți = 24 mantisă + 8 exponent**; precizie dublă **64 biți =\n52 mantisă + 12 exponent** (în curs, nu în standardul real). Mantisa și exponentul sunt numere cu semn.\n\n---\n\n## 5. Calea de date: înmulțire, biți de gardă, deplasări (Curs 4)\n\n**Multiplicatorul:** n biți × n biți → produs pe **2n biți** (16 × 16 → 32). Dacă unul dintre operanzi nu poate fi cel\nmai negativ număr (NMAX), ajung **2n − 1 biți**. Mantise de 24 × 24 biți → produs cu mantisa de **48** biți.\n- Aritmetică fracționară: produsul are **de două ori mai mulți biți după virgulă**; se păstrează jumătatea de sus\n  (+ deplasare la stânga cu 1 bit, ca să scapi de al doilea bit de semn).\n\n**Biți de gardă = biți acumulator − biți produs.**\n- DSP16xx (AT&T): acumulator 36, produs 32 → **4 biți de gardă**.\n- ADSP-21xx (Analog Devices): 40 − 32 → **8 biți de gardă**.\n- DSP5600x (Motorola): acumulator 56, produs 48 → **8**.\n- **Cu n biți de gardă poți aduna până la 2ⁿ valori fără depășire** (4 biți → 16 valori, 8 biți → 256).\n- La final se scalează: cu 4 biți de gardă pe un procesor de 16 biți, se înmulțește cu 2⁻⁴ înainte de scriere.\n\n**Deplasări (shifter):**\n- **Deplasare la stânga cu k biți** = × 2ᵏ (intră 0 în dreapta; aritmetică = logică).\n- **Deplasare aritmetică la dreapta** = ÷ 2 (copiază **bitul de semn** în stânga): 010010 → **001001**; 110100 → 111010.\n- **Deplasare logică la dreapta**: intră **0** în stânga, fără extensie de semn: 110100 → 011010.\n- **Rotație** = deplasare circulară (bitul care iese intră în partea cealaltă), de obicei cu un bit.\n- Scalarea ieșirii cu o putere a lui 2 o face **deplasatorul**.\n\n---\n\n## 6. Depășire, saturare, trunchiere, rotunjire (Curs 4)\n\n**Depășire (overflow):** rezultatul nu mai încape → valoare greșită și departe de cea corectă.\nExemplul din curs, cu 2 cifre zecimale: 50 + 45 + 20 = 115 → rămâne **15**.\n\n**Saturare:** la depășire, rezultatul e înlocuit cu **cel mai mare pozitiv** (sau **cel mai mic negativ**) reprezentabil.\nAcelași exemplu → **99**. Tot greșit, dar mult mai aproape. Circuitul se numește **limitator**.\nPe 8 biți: 100 + 50 → saturat la **127**; −100 − 50 → **−128**.\n\n**Trunchiere:** arunci biții cei mai puțin semnificativi. Rezultatul e **întotdeauna ≤ originalul** → introduce un\n**bias (deplasament, componentă continuă)**.\n- Acumulator 36 biți → memorie 16 biți: se aruncă cei mai de jos **20** de biți.\n- Grila veche: 0010101 „trunchiat cu 4 biți” (se aruncă 4 biți) → 001 = **1**. Dacă înseamnă „păstrând 4 biți”: 0010 = 2.\n\n**Rotunjire la cea mai apropiată valoare (convențională):** aduni jumătate de LSB din formatul de ieșire și apoi trunchiezi.\nLa egalitate (exact la jumătate) rotunjește **mereu în sus** → bias mic, dar există.\n\n**Rotunjire convergentă** (ADSP-21xx, DSP5600x): ca mai sus, **dar la egalitate** decide bitul care devine LSB:\nLSB = 0 → **în jos** (rămâne așa); LSB = 1 → **în sus** (+1). Media erorilor e 0, deci fără bias.\n\nCum lucrezi o grilă „rotunjire convergentă păstrând k biți”:\n1. Desparți: primii k biți (păstrați) | restul (aruncați).\n2. Restul < 100…0 → jos (păstrezi cei k biți). Restul > 100…0 → sus (+1).\n3. Restul = 100…0 (exact jumătate) → te uiți la ultimul bit păstrat: 0 → rămâne; 1 → +1.\n\n| Valoare | Păstrezi | Aruncat | Convergentă | La cea mai apropiată |\n|---|---|---|---|---|\n| 1010011000 | 6: 101001 | 1000 = jumătate, LSB = 1 | **101010** | 101010 |\n| 11101010 | 6: 111010 | 10 = jumătate, LSB = 0 | **111010** | 111011 |\n| 10100101 | 4: 1010 | 0101 < jumătate | **1010** | 1010 |\n| 01101000 | 4: 0110 | 1000 = jumătate, LSB = 0 | **0110** | 0111 |\n| 01101100 | 4: 0110 | 1100 > jumătate | **0111** | 0111 |\n\n(Primele trei sunt grile vechi, cu răspunsurile 101010, 111010, 1010.)\n\n**Ordinea obișnuită într-un DSP:** multiplicare → acumulare → deplasare → rotunjire.\n\n---\n\n## 7. Moduri de adresare – câte o instrucțiune pentru fiecare (Curs 6)\n\nInstrucțiunile sunt exact cele din curs/capitol. La grile primești instrucțiunea și alegi modul: uită-te la\n**ce e în jurul registrului** (`*`, `++`, `-( )`, `+ N`, `#`, `$`, `DM( )`).\n\n| Mod de adresare | Instrucțiune | Ce face | Cum îl recunoști |\n|---|---|---|---|\n| **Implicită** | `P = X * Y` (AT&T), `MUL a` | înmulțește X cu Y, rezultatul în P; registrele nu se pot alege | instrucțiunea însăși fixează registrele |\n| **Imediată** | `AX0 = 1234` (Analog Devices), `MOVE #1234, A` (Motorola) | pune **constanta** 1234 în registru | un număr simplu sau cu `#` |\n| **Directă la registru** | `SUBF R1, R2` (Texas Instruments) | R2 = R2 − R1 | doar nume de registre, ales de programator |\n| **Directă la memorie** (absolută) | `AX0 = DM(1000)` (Analog Devices), `MOVE $1000, A` (Motorola) | ia valoarea **de la adresa 1000** | adresa scrisă în instrucțiune: `DM( )` sau `$` |\n| **Indirectă cu registru** | `A0 = A0 + *R5` (AT&T); grila: `A6 = A6 + *R6` | A0 = A0 + valoarea de la adresa din R5; **R5 rămâne la fel** | `*R` fără nimic după |\n| **Indirectă cu post-incrementare** | `A0 = A0 + *R5++` (DSP32xx) | folosește adresa din R5, **apoi** R5 = R5 + 1 | `++` după registru |\n| **Indirectă cu post-decrementare** | `A0 = A0 + *R5--` | folosește R5, **apoi** R5 = R5 − 1 | `--` după registru |\n| **Post-incrementare cu offset** | `A0 = A0 + *R5++R17` (DSP32xx) | folosește R5, apoi **R5 = R5 + R17** (R17 = registru offset) | `++` urmat de alt registru |\n| **Indirectă cu pre-decrementare** | `MOVE X:-(R0), A1` (Motorola DSP5600x) | **întâi** R0 = R0 − 1, apoi citește de la noua adresă în A1 | semnul în fața parantezei: `-(R0)`; `+(R0)` = pre-incrementare |\n| **Indirectă cu indexare** | `MOVE Y1, X:(R5 + N6)` (DSP5600x), `LDI *-AR1(1), R7` (TMS320C3x) | adresa = R5 + N6 (sau AR1 − 1); **R5, N6, AR1 nu se modifică** | sumă în paranteză / `(număr)` după registru |\n| **Modulo (circulară)** | în curs nu e dată o instrucțiune, doar bufferul circular | pointerul trece singur de la capătul bufferului la început | „buffer circular”, „FIFO” |\n| **Inversarea biților** | în curs nu e dată o instrucțiune (ADSP-210xx: se setează un bit în registrul de control) | adresa iese cu biții în ordine inversă | „FFT”, „radix-2” |\n| **Scurtă cu date imediate** | `MOVE #1234, A` cu constanta pe ≤ 12 biți (Motorola) | instrucțiunea + constanta într-un singur cuvânt | `#` + constantă mică |\n| **Scurtă directă la memorie** | `MOVE $1000, A` cu adresa pe ≤ 6 biți (Motorola) | instrucțiunea + adresa într-un singur cuvânt | `$` + adresă mică |\n| **Directă la memorie paginată** | în curs nu e dată o instrucțiune (TMS320C5x) | registrul de pagină ține pagina, instrucțiunea doar adresa în pagină (7 biți = 128 cuvinte) | „registru de pagină” |\n\n**Atenție:** `AX0 = 1234` e imediată (constanta 1234), iar `AX0 = DM(1000)` e directă la memorie (ce e **la** adresa 1000).\nLa indexare registrele **nu** se modifică, la pre/post-incrementare **se** modifică.\n\n### Calcule cu adrese (cum apar la grile)\n\n**Post-incrementare:** R2 = 0x0000, instrucțiunea `A = A + *R2++`\n- A se adună cu valoarea de la adresa 0x0000, apoi R2 = 0x0000 + 1 = **0x0001**.\n\n**Post-incrementare cu offset:** R6 = 0x0010, R4 = 3, la adresa 0x0010 e valoarea 3, A = 5. Instrucțiunea `A = A + *R6++R4`\n- A = 5 + 3 = **8** (valoarea din memorie, nu valoarea lui R6!), apoi R6 = 0x0010 + 3 = **0x0013**.\n\n**Pre-decrementare:** R0 = 0x0020, instrucțiunea `MOVE X:-(R0), A1`\n- întâi R0 = 0x001F, apoi A1 = valoarea de la adresa **0x001F**. R0 rămâne 0x001F.\n\n**Indexare:** R5 = 0x0100, N6 = 0x0004, instrucțiunea `MOVE Y1, X:(R5 + N6)`\n- Y1 se scrie la adresa 0x0100 + 0x0004 = **0x0104**; R5 și N6 rămân la fel.\n- `LDI *-AR1(1), R7` cu AR1 = 0x0050: R7 = valoarea de la adresa **0x004F**; AR1 rămâne 0x0050.\n\n**Directă la memorie:** `AX0 = DM(0x0002)`, iar la adresa 2 e valoarea 1 → **AX0 = 1** (nu 2!).\n\n**Modulo:** adresa nouă = start + (offset + pas) **mod L**.\n- Buffer de L = 5 cuvinte la adresele 0x100…0x104, R5 = 0x104, `*R5++` → R5 nu ajunge 0x105, ci **0x100** (revine la început).\n- Ex. din curs: 16 mod 5 = 1; ora 14 mod 12 = ora 2.\n- Bufferul începe la o graniță de **k cuvinte, k = cea mai mică putere a lui 2 ≥ L**: L = 48 → granița 64;\n  L = 256 → adresele 0, 256, 512 …\n\n**Inversarea biților (FFT radix-2):** scrii indicele în binar pe log₂N biți și îl citești de la coadă.\n- N = 8 (3 biți): 1 = 001 → 100 = 4; 3 = 011 → 110 = 6. Ordinea: **0, 4, 2, 6, 1, 5, 3, 7**.\n\n**Paginată (TMS320C5x, pagini de 128 de cuvinte):** registrul de pagină = 3, adresa din instrucțiune = 5\n- adresa reală = 3 · 128 + 5 = **389**.\n\n---\n\n## 8. Capcane frecvente la calcule\n\n- Citești numărul **fără semn** (164 în loc de −92). MSB = 1 → număr negativ, mereu.\n- La fracționar, MSB valorează **−1**, nu −0,5.\n- La virgulă mobilă, **exponentul e și el cu semn** (111110 = −2, nu 62).\n- Ordinea e **mantisă, apoi exponent** (stânga → dreapta).\n- Biți de gardă = **acumulator − produs**, nu acumulator − cuvântul de date.\n- Deplasarea **aritmetică** la dreapta păstrează semnul, cea **logică** pune 0.\n- Trunchierea dă mereu ceva **≤** originalul; rotunjirea convergentă la egalitate depinde de **LSB-ul păstrat**.\n"};
const $ = (s, el = document) => el.querySelector(s);

};

})();

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function wrong() { return store.get("gresite", []); }

}

    const ex = $(".expl", el); ex.hidden = false;
    ex.innerHTML = (q.sigur === false ? `<p class="unsure">Răspuns dedus, nesigur: cursul nu o spune explicit.</p>` : "") +
      `<p>${esc(q.explicatie)}</p><p class="muted">${q.tip === "vechi" ? "Din grilele vechi: " + esc(q.sursa) : "Grilă nouă, făcută după curs."}</p>`;
    check.disabled = true;
    mark(q.id, good);
    onDone && onDone(good);
  };
  return el;
}

const views = {
  formule() {
    const v = $("#view");
    const html = window.marked ? marked.parse(DATA.formule || "") : `<pre>${esc(DATA.formule)}</pre>`;
    v.innerHTML = `<section class="sheet md">${html}</section>`;
    v.querySelectorAll(".md table").forEach(t => { const w = document.createElement("div"); w.className = "tw"; t.replaceWith(w); w.appendChild(t); });
  },
  invata() {
    const c = DATA.cursuri.find(x => x.curs === state.curs) || DATA.cursuri[0];
    const v = $("#view");
    v.innerHTML = `<div class="chips">${DATA.cursuri.map(x => `<button class="chip" aria-pressed="${x.curs === c.curs}" data-c="${x.curs}">Curs ${x.curs}</button>`).join("")}</div>
      <h2>Cursul ${c.curs}. ${esc(c.titlu)}</h2>
      <section class="sheet"><h3>Esențial</h3><ul>${(c.esential || []).map(p => `<li>${md(p)}</li>`).join("")}</ul></section>
      ${c.capcane && c.capcane.length ? `<section class="trap"><h3>Capcane</h3><ul>${c.capcane.map(p => `<li>${md(p)}</li>`).join("")}</ul></section>` : ""}
      <details class="sheet"><summary><b>Rezumatul complet</b> <span class="muted">(dacă vrei detalii)</span></summary>
        ${c.rezumat.map(s => `<div class="sec"><h3>${esc(s.titlu)}</h3><ul>${s.puncte.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>`).join("")}</details>
      <div class="row"><button class="btn" id="go-grile">Grile din cursul ${c.curs} (${DATA.grile.filter(q => q.curs === c.curs).length})</button></div>`;
    v.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { state.curs = +b.dataset.c; store.set("curs", state.curs); render(); });
    $("#go-grile").onclick = () => { state.filtru = "c" + c.curs; state.idx = store.get("idx:" + state.filtru, 0); store.set("filtru", state.filtru); go("grile"); };
  },
  grile() {
    const f = state.filtru;
    const list = DATA.grile.filter(q => f === "toate" ? true : f === "vechi" ? q.tip === "vechi" : q.curs === +f.slice(1));
    if (state.idx >= list.length) state.idx = 0;
    store.set("idx:" + f, state.idx);
    const v = $("#view");
    const filters = [["toate", "Toate"], ["vechi", "Doar grile vechi"], ...DATA.cursuri.map(c => ["c" + c.curs, "Curs " + c.curs])];
    v.innerHTML = `<div class="chips">${filters.map(([k, t]) => `<button class="chip" aria-pressed="${k === f}" data-f="${k}">${t}</button>`).join("")}</div>
      <div class="progress" aria-hidden="true"><i style="width:${list.length ? ((state.idx + 1) / list.length * 100) : 0}%"></i></div>`;
    v.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { state.filtru = b.dataset.f; state.idx = store.get("idx:" + state.filtru, 0); store.set("filtru", state.filtru); render(); });
    if (!list.length) { v.insertAdjacentHTML("beforeend", `<p class="muted">Nicio grilă aici.</p>`); return; }
    v.appendChild(questionCard(list[state.idx], state.idx + 1, list.length));
    v.insertAdjacentHTML("beforeend", `<div class="row"><button class="btn ghost" id="prev">Înapoi</button><button class="btn" id="next">Următoarea</button><span class="sari"><label for="sari">Sari la</label><input id="sari" type="number" inputmode="numeric" min="1" max="${list.length}" placeholder="nr."><button class="btn ghost" id="sari-go">Du-te</button></span></div>`);
    const sari = () => { const n = parseInt($("#sari").value, 10); if (n >= 1 && n <= list.length) { state.idx = n - 1; render(); window.scrollTo(0, 0); } };
    $("#sari-go").onclick = sari;
    $("#sari").onkeydown = e => { if (e.key === "Enter") sari(); };
    $("#prev").onclick = () => { state.idx = (state.idx - 1 + list.length) % list.length; render(); };
    $("#next").onclick = () => { state.idx = (state.idx + 1) % list.length; render(); window.scrollTo(0, 0); };
  },
  sim() {
    const v = $("#view");
    if (!state.sim) {
      const best = store.get("sim", []);
      v.innerHTML = `<h2>Simulare de test</h2>
        <section class="sheet"><p>10 întrebări din cursurile 1–6, ca la test: patru variante, una sau mai multe corecte. Bifează tot ce e corect și apasă Verifică; o întrebare e bună doar dacă ai bifat exact variantele corecte. Scorul apare după ce le verifici pe toate 10.</p>
        <p class="muted">Jumătate din întrebări vin din grilele vechi, restul sunt noi, din toate cursurile.</p>
        <div class="row"><button class="btn" id="start">Începe simularea</button></div></section>
        ${best.length ? `<section class="sheet"><h3>Simulările tale</h3><ul>${best.slice(-8).reverse().map(s => `<li><span class="mono">${s.p}/10</span> · ${new Date(s.t).toLocaleString("ro-RO", { dateStyle: "short", timeStyle: "short" })}</li>`).join("")}</ul></section>` : ""}`;
      $("#start").onclick = () => {
        const vechi = shuffle(DATA.grile.filter(q => q.tip === "vechi")), noi = shuffle(DATA.grile.filter(q => q.tip !== "vechi"));
        const pick = [], seenC = {};
        const take = (src, n) => { for (const q of src) { if (pick.length >= n) break; if (!pick.includes(q) && (seenC[q.curs] || 0) < 3) { pick.push(q); seenC[q.curs] = (seenC[q.curs] || 0) + 1; } } };
        take(vechi, 5); take(noi, 10); take(shuffle(DATA.grile), 10);
        state.sim = { qs: shuffle(pick), done: 0, good: 0 };
        render();
      };
      return;
    }
    const s = state.sim;
    v.innerHTML = `<h2>Simulare · <span class="mono">${s.done}/10</span> răspunse</h2>`;
    s.qs.forEach((q, i) => v.appendChild(questionCard(q, i + 1, 10, good => {
      s.done++; if (good) s.good++;
      $("h2", v).innerHTML = `Simulare · <span class="mono">${s.done}/10</span> răspunse`;
      if (s.done === 10) {
        const all = store.get("sim", []); all.push({ p: s.good, t: Date.now() }); store.set("sim", all);
        v.insertAdjacentHTML("beforeend", `<section class="sheet"><div class="score">${s.good}/10</div><p>${s.good >= 8 ? "Ești pregătit." : s.good >= 5 ? "Aproape. Reia grilele greșite din tabul Greșeli." : "Mai citește rezumatul cursurilor la care ai greșit și reia grilele."}</p><div class="row"><button class="btn" id="again">Încă o simulare</button></div></section>`);
        $("#again").onclick = () => { state.sim = null; render(); window.scrollTo(0, 0); };
      }
    })));
  },
  gresite() {
    const ids = new Set(wrong());
    const list = DATA.grile.filter(q => ids.has(q.id));
    const v = $("#view");
    v.innerHTML = `<h2>Grilele greșite (${list.length})</h2>
      <p class="muted">Aici ajung grilele la care ai greșit. Când răspunzi corect, ies din listă. Se păstrează doar în browserul ăsta.</p>
      ${list.length ? `<div class="row"><button class="btn ghost" id="reset">Golește lista</button><span class="muted" id="reset-msg"></span></div>` : ""}`;
    const r = $("#reset");
    if (r) r.onclick = () => {
      if (r.dataset.confirm) { store.set("gresite", []); render(); return; }
      r.dataset.confirm = "1"; r.textContent = "Sigur? Apasă din nou"; $("#reset-msg").textContent = "Se șterg toate cele " + list.length + ".";
    };
    if (!list.length) { v.insertAdjacentHTML("beforeend", `<section class="sheet"><p>Nicio grilă greșită momentan. Fă o simulare sau treci prin grile.</p></section>`); return; }
    list.forEach((q, i) => v.appendChild(questionCard(q, i + 1, list.length)));
  }
};

function go(tab) { state.tab = tab; render(); window.scrollTo(0, 0); }
function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === state.tab));
  views[state.tab]();
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => go(b.dataset.tab));
render();
</script>
