 și set de semnale de control), chiar dacă au mai multe blocuri de memorie independente pe chip – bus-urile externe cer mulți pini → cost mai mare; portul extern poate extinde oricare bloc intern, dar accesul multiplu la memoria externă într-un ciclu nu e posibil.", "Există și DSP cu mai multe porturi externe (mai scumpe): ADSP-21020 (port program: adrese 24 b, date 48 b; port date: 32/32 b), TMS320C30 (24/32 și 13/32), TMS320C40 (două porturi identice, adrese 31 b, date 32 b), DSP96002 (două porturi identice de 32 b).", "Unele interfețe sunt simple și directe, cu câțiva pini de control; altele complexe, permit conectarea la o mare diversitate de dispozitive și bus-uri fără hardware suplimentar. Alte caracteristici: stări de așteptare flexibile/configurabile, pin „wait” (memoria externă disponibilă), pini de cerere și confirmare a accesului la bus, suport pentru DRAM în modul pagină.", "Aplicațiile de performanță folosesc memorii externe SRAM rapide → inginerul trebuie să consulte timpii de acces ai porturilor externe; două procesoare cu același ciclu-mașină pot avea timpi de acces foarte diferiți, cu impact asupra costului (memoriile rapide sunt mai scumpe).", "Cache manual: chiar fără cache specializat, programatorul poate copia o secțiune de cod din memoria lentă sau mai folosită (în termeni de acces) într-o memorie mai rapidă sau mai puțin accesată – ex. din ROM extern lent în RAM intern, la pornirea procesorului sau la prima accesare a acelei zone.", "Suport multiprocesor: (1) două porturi pentru memoria externă – unul la o memorie locală, folosită doar de acest procesor, celălalt la o memorie partajată cu alte procesoare (ex. DSP96002); (2) mecanism de arbitrare a magistralei – procesoarele negociază controlul bus-ului, iar cele fără control nu pot transfera date pe el; (3) blocarea bus-ului = operația test-and-set (citește, modifică și scrie înapoi o variabilă partajată fără întrerupere de la alt procesor).", "SRAM față de DRAM: SRAM e mai ușor de folosit și mai rapidă, dar necesită o suprafață mai mare pe chip și e mai scumpă pentru aceeași capacitate; interfețele cu SRAM sunt mai simple.", "Deosebirea principală: SRAM reține datele cât timp e alimentată (perioadă nelimitată, până e rescrisă); DRAM trebuie reîmprospătată periodic (refresh la fiecare câteva fracțiuni de secundă, altfel datele se pierd), aplicându-i-se o secvență specială de semnale.", "DRAM presupune de regulă un controler de DRAM separat care generează semnalele de control (crește costul); unele DSP integrează controlerul pe chip (DSP56004, DSP56007 – cu suport pentru modul pagină); DRAM paginate sau cu coloane statice dau acces mult mai rapid la accesarea repetată a aceleiași pagini.", "DMA (Direct Memory Access): tehnică prin care datele sunt transferate în și din memoria internă a DSP fără intervenția acestuia; tip aparte de întrerupere, tehnică pur hardware, fără pregătiri în programe; oferă performanțe mai bune pentru dispozitivele I/O, printr-un controler DMA separat, pe același chip sau extern.", "DMA extern: procesorul îi transmite controlerului adresa de start, numărul de locații, direcția transferului și dispozitivul sursă/destinație; controlerul cere bus-ul pe pinul de cerere, procesorul termină instrucțiunea curentă, cedează controlul și confirmă pe pinul de acces la bus; la final controlerul poate semnala printr-o întrerupere.", "Controlerele DMA integrate pot accesa atât memoria internă cât și pe cea externă și diferă prin performanțe și flexibilitate; pot avea mai multe canale, fiecare cu propriul set de registre: TMS320C4x – 6 canale, ADSP-2106x – 10, DSP96002 – 2; transferuri memorie-memorie sau memorie-periferic."]}], "capcane": ["DSP NU folosesc arhitectura von Neumann (un singur bloc, un singur set de magistrale), ci Harvard MODIFICATĂ: un bloc pentru program ȘI date, celălalt NUMAI pentru date (nu „ambele numai date” sau „ambele program”).", "Numere FIR: MAC cere 4 accesări; von Neumann → 4 cicluri; Harvard → 2 cicluri; cu adresare modulo n → 3 accesări (NU 2); 3 blocuri (program + X + Y) → 3 accesări pe ciclu.", "Memorii rapide = accesări SECVENȚIALE, un SINGUR set de magistrale; memorii multiport = accesări CONCURENTE, DOUĂ SAU MAI MULTE seturi de magistrale. Nu le inversa.", "Ordonarea suboptimă a datelor la memoriile rapide NU dă rezultate eronate – doar prelungește automat execuția (timp mai mare).", "Dezavantajul memoriilor multiport este aria mare pe chip, nu viteza; cele mai folosite sunt dual-port (3–4 porturi mai rar).", "Cauzele stărilor de așteptare sunt exact trei: conflicte la accesarea resurselor, memorii lente, împărțirea magistralei cu alte dispozitive. Memoria cache NU este o cauză (este o metodă de reducere a accesărilor).", "Durata unei stări de așteptare: ¼ ciclu (DSP32C, AT&T) până la 1 ciclu-mașină (majoritatea); stările mai SCURTE sunt mai eficiente.", "Cache-ul DSP: doar pentru instrucțiuni, mai mic și mai simplu decât la procesoarele de uz general; cache de date ar cere coerență (complexitate). Cache manual = copiere făcută de programator, nu automat.", "SRAM: mai rapidă, mai ușor de folosit, interfață mai simplă, dar mai scumpă și cu suprafață mai mare; reține datele cât e alimentată. DRAM: trebuie reîmprospătată periodic, cere controler DRAM (separat sau integrat). „DRAM e mai rapidă decât SRAM” = FALS.", "Majoritatea DSP au UN singur port extern pentru memorie, chiar dacă au mai multe blocuri interne (motiv: pini → cost); accesul multiplu la memoria externă într-un ciclu nu e posibil.", "ROM: versiunea cu RAM internă este pentru prototipuri și volum scăzut; ROM programat la fabricare este pentru volum mare (nu invers).", "DMA: transfer FĂRĂ intervenția procesorului; tip aparte de întrerupere, pur hardware, FĂRĂ pregătiri în programe; controlerul DMA poate fi pe același chip sau extern.", "Abordările bazate pe algoritmi reduc accesările, dar NU sunt o caracteristică a procesoarelor de semnal (țin de programator).", "Operațiile specializate de scriere: scriere în memoria de date în paralel cu o citire din aceasta ȘI o citire din memoria de program, doar cu instrucțiuni speciale și în circumstanțe restrictive."]}, {"curs": 6, "titlu": "Adresarea datelor", "rezumat": [{"titlu": "Noțiuni generale și AGU", "puncte": ["Prin adresare se înțeleg mijloacele prin care sunt specificate locațiile operanzilor (operanzi = atât datele de intrare procesate de o instrucțiune, cât și datele de ieșire rezultate).", "Există mai multe tipuri de adresare (denumite moduri de adresare); operanzii pot fi obținuți direct dintr-un registru sau de la o adresă de memorie internă sau externă.", "Modul de adresare a datelor este indicat fie explicit în codul instrucțiunii, fie este implicit. Des întâlnit: o instrucțiune combină două sau mai multe moduri de adresare, folosind moduri diferite pentru operanzi diferiți.", "Multe procesoare au doar un subset al modurilor de adresare; un mod poate fi folosit doar cu un subset al setului de instrucțiuni, în cazuri extreme doar pentru o singură instrucțiune.", "Arhitectură load-store: instrucțiuni speciale pentru transferul datelor cu memoria; restul instrucțiunilor pot accesa date doar din registre.", "Majoritatea DSP-urilor au una sau mai multe unități de generare a adresei (AGU – Address Generating Units), dedicate calculului adreselor. Analog Devices: AGU; AT&T: „unitate de control aritmetică”.", "Un AGU poate efectua una sau mai multe operații complexe de calcul al adreselor pe ciclu de tact fără a utiliza calea de date principală → calculul adreselor are loc în paralel cu operațiile aritmetice, mărind performanța.", "Diferențele între AGU-uri: modurile de adresare oferite și capabilitățile și flexibilitatea fiecărui mod.", "Cele 11 moduri din curs: 6.1 implicită; 6.2 imediată; 6.3 directă la registru; 6.4 directă la memorie; 6.5 indirectă cu registru; 6.6 indirectă cu registru cu pre- și post-incrementare/decrementare; 6.7 indirectă cu registru cu indexare; 6.8 indirectă cu registru cu aritmetică a adreselor modulo; 6.9 indirectă cu registru cu inversarea biților; 6.10 moduri de adresare scurte; 6.11 directă la memorie paginată."]}, {"titlu": "6.1 Adresarea implicită", "puncte": ["Adresele operanzilor sunt indicate în mod implicit de către instrucțiune; nu se poate schimba localizarea operanzilor, care în majoritatea cazurilor se află în registre.", "Exemplu AT&T (DSP16xx): toate instrucțiunile de înmulțire folosesc operanzii din registrele de intrare ale multiplicatorului X și Y și depun rezultatul în registrul produs P. Sintaxa „P = X * Y” ar fi putut fi scrisă simplu „*”, deoarece programatorul nu poate specifica alte registre; sintaxa explicită doar facilitează înțelegerea codului."]}, {"titlu": "6.2 Adresarea imediată", "puncte": ["Operandul (valoarea propriu-zisă) este inclus în cuvântul instrucțiune sau într-un cuvânt separat.", "Exemplu Analog Devices (ADSP-21xx): „AX0 = 1234” încarcă constanta 1234 în AX0. Constanta e specificată prin adresare imediată, iar registrul destinație AX0 prin adresare directă la registru.", "Datele de lungime mică (de obicei jumătate din lungimea instrucțiunii sau mai mici) se codează în cuvântul instrucțiune → instrucțiune de un singur cuvânt. Datele mai mari se pun într-un cuvânt separat → procesorul citește două cuvinte din memoria de program, încetinind execuția."]}, {"titlu": "6.3 Adresarea directă la registru", "puncte": ["Datele se află într-un registru; programatorul specifică registrul ca parte a instrucțiunii.", "Exemplu Texas Instruments (TMS320C3x): „SUBF R1, R2” scade valoarea din R1 din cea din R2 și pune rezultatul în R2; ar fi putut folosi oricare două din cele opt registre de pe cip.", "Diferența față de implicită: la directă la registru programatorul poate specifica registrele; la implicită ele sunt specificate de instrucțiune și nu pot fi schimbate.", "Mod foarte important la procesoarele la care operanzii instrucțiunilor aritmetice provin din registre și nu din memorie."]}, {"titlu": "6.4 Adresarea directă la memorie", "puncte": ["Denumită și adresare absolută: datele se află în memorie la o adresă codată în cuvântul instrucțiunii.", "Exemplu ADSP-21xx (Analog Devices): „AX0 = DM(1000)” încarcă în AX0 datele de la locația 1000.", "Ca la imediată: adresele cu format mic încap în cuvântul instrucțiune (un singur cuvânt); adresele mari necesită un cuvânt separat → două citiri din memoria de program, execuție mai lentă."]}, {"titlu": "6.5 Adresarea indirectă cu registru", "puncte": ["Datele adresate se află în memorie la o adresă indicată de un registru. Unele procesoare au registre de adrese dedicate, altele registre de uz general pentru date și adrese.", "Este cel mai folosit mod de adresare de pe majoritatea DSP-urilor, din două motive: e foarte potrivit pentru tablouri de date și e eficient ca set de instrucțiuni (adresare puternică și flexibilă cu puțini biți din cuvântul instrucțiune).", "Exemplu AT&T (DSP32xx): „A0 = A0 + *R5” adună valoarea de la locația de memorie indicată de R5 la A0, rezultatul în A0; R5 = registru de adresă. „*...” = conținutul locației de memorie indicate de registru (ca în C); alte procesoare folosesc „(Rn)”.", "Exemplu din slide: R2 conține adresa 0x0100; la MOVE, valoarea de la locația 0x0100 (aici 7) este copiată în acumulatorul A."]}, {"titlu": "6.6 Indirectă cu registru cu pre- și post-incrementare/decrementare", "puncte": ["Accelerează accesul la date din locații cu adrese consecutive: păstrează adresarea indirectă cu registru și adaugă modificarea registrului de adrese, înainte de acces (pre-modificare) sau după acces (post-modificare); modificarea poate fi incrementare sau decrementare.", "Cea mai comună modificare: post-incrementare cu unu (după ce registrul a fost folosit) – mecanism simplu de parcurgere a unui tablou. DSP32xx: „A0 = A0 + *R5++” (R5 trece la locația următoare); „A0 = A0 + *R5--” (R5 trece la locația anterioară după adunare).", "Valori diferite de 1: „A0 = A0 + *R5++R17” – după acces R5 este incrementat cu valoarea din R17; R17 poate fi negativ → același format poate decrementa. Registrul cu valoarea de incrementare (R17) = registru pentru offset; Analog Devices îl numește „registru modificator”.", "Pre-decrementare Motorola DSP5600x: „MOVE X:-(R0), A1” decrementează R0 înainte de a-l folosi la adresarea memoriei, valoarea mutându-se în A1. Pre-incrementarea necesită de obicei un ciclu instrucțiune în plus pentru actualizarea registrului înaintea accesului."]}, {"titlu": "6.7 Indirectă cu registru cu indexare", "puncte": ["Valorile din doi registri de adresă (sau dintr-un registru de adresă și o constantă) sunt adunate pentru a obține adresa efectivă.", "Diferența față de premodificare: la indexare valorile stocate în registre NU sunt modificate.", "Exemplu DSP5600x: „MOVE Y1, X:(R5 + N6)” mută Y1 în spațiul X la adresa R5 + N6; R5 și N6 nemodificate; N6 = registru index.", "Unii producători numesc „adresare indexată” adresarea cu pre-/post-incrementare cu o valoare diferită de unu; acolo registrele offset se numesc registre index.", "Index ca valoare imediată (TMS320C3x): „LDI *-AR1(1), R7” – adresa efectivă = AR1 − 1, datele de acolo merg în R7, AR1 nu se modifică.", "Utilizări: același segment de cod pe mai multe seturi de date (registrul index indică începutul setului, se schimbă doar el); în compilatoare la transmiterea argumentelor subrutinelor prin stivă: cu AR1 indicator de vârf de stivă, „LDI *+AR1(2), R0” copiază primul argument în R0."]}, {"titlu": "6.8 Indirectă cu registru cu aritmetică a adreselor modulo", "puncte": ["Cea mai comună aplicație: buffer circular. Buffer de date = porțiune de memorie care stochează date venite din afara chipului sau de la o procesare anterioară până când procesorul le poate prelucra; tehnică FIFO (citire în ordinea sosirii).", "Doi pointeri (în registre sau în memorie): pointerul de scriere (unde se depune următoarea valoare sosită) și pointerul de citire (unde se află următoarea valoare de citit). Testul de sfârșit de buffer și resetarea după fiecare operație consumă mult timp → scădere semnificativă a performanței.", "Adresare modulo / adresare circulară: DSP-ul face automat verificarea după fiecare calcul de adresă și readuce pointerul la începutul bufferului, care pare circular pentru programator.", "Termenul modulo = aritmetică în care numerele sunt limitate la un interval (ca ceasul de 12 ore: 14 modulo 12 = 2). Pointerii se actualizează cu pre- și/sau post-incrementare, iar AGU calculează adresele noi în aritmetică modulo.", "Exemplu FIR din curs: bufferul conține ultimele patru eșantioane (coeficienți w0…w3); la n pointerul P accesează x(n); la n+1 trece pe x(n−3), cel mai vechi eșantion, înlocuit cu x(n+1) → cantitatea de date mutate este minimizată. (Curs 5: adresarea modulo n implementează linia de întârziere fără mutarea datelor și reduce accesările FIR de la 4 la 3 pe ciclu.)", "Control mod 1: lungimea bufferului într-un registru modificator / registru modulo, asociat cu unul sau mai mulți registri adresă. Neavând adresa de start, bufferul începe la granița unui segment de k cuvinte, k = cea mai mică putere a lui 2 ≥ dimensiunea (48 cuvinte → granița de 64; buffer de 256 → adresa 0, 256, 512…). Folosit la TMS320C3x, TMS320C4x, Motorola, Analog Devices, NEC, DSP Group.", "Control mod 2: registre de start și de sfârșit cu adresele de început și sfârșit ale fiecărui buffer circular – DSP16xx (AT&T) și TMS320C5x (TI).", "Număr de buffere circulare active: DSP16xx – 1 (un singur registru de start și unul de sfârșit); TMS320C5x – 2; Motorola DSP561xx – 4; Motorola DSP5600x și toate procesoarele Analog Devices – 8."]}, {"titlu": "6.9 Indirectă cu registru cu inversarea biților", "puncte": ["Folosită numai în împrejurări foarte speciale: algoritmi FFT în baza 2 (radix-2), cu decimare în timp sau în frecvență, care folosesc intrarea sau produc ieșirea în ordine inversată → datele trebuie rearanjate în ordinea firească.", "Ordine inversă a biților: ieșirile unui numărător binar scrise în ordine inversă (bitul cel mai puțin semnificativ primul) se potrivesc cu ordinea ieșirii FFT. Pentru FFT cu 8 puncte: 0, 4, 2, 6, 1, 5, 3, 7.", "Multe procesoare au hardware specializat în AGU. ADSP-210xx (Analog Devices): modul se activează prin setarea unui bit în registrul de control; ieșirii unui registru de adrese i se inversează biții înainte de a ajunge pe magistrala de adrese.", "Alternativă: aritmetica cu transport invers – AGU inversează direcția de propagare a transportului la adunarea incrementului; cu adresa de bază și incrementul date în ordine inversată, rezultatul e cu biții inversați. Folosită la DSP32C și DSP32xx (AT&T)."]}, {"titlu": "6.10 Modurile de adresare scurte", "puncte": ["Neajuns: în general instrucțiunea și adresa ocupă două cuvinte de program → program mai mare, execuție mai lentă. Versiunile scurte pun instrucțiunea și adresa într-un singur cuvânt, cu restricții la nivelul adreselor. Două tipuri: a) scurtă cu date imediate; b) scurtă directă la memorie.", "a) Scurtă cu date imediate: operandul propriu-zis (nu adresa) e codat în instrucțiune. Motorola DSP5600x: „MOVE #1234, A” încarcă constanta în A; în general 2 cuvinte (codul operației + data), dar un singur cuvânt dacă datele au 12 biți sau mai puțin.", "b) Scurtă directă la memorie: Motorola DSP5600x „MOVE $1000, A” încarcă în A datele de la adresa 1000. Forma scurtă codează adrese de până la 6 biți → economisește un cuvânt de memorie și un ciclu instrucțiune.", "Variantă cu offset implicit adăugat la adresa scurtă: DSP5600x o folosește pentru registrele I/O mapate pe ultimele 64 de locații de memorie."]}, {"titlu": "6.11 Adresarea directă la memorie paginată", "puncte": ["Un registru special stochează numărul paginii (secțiunii) de memorie adresate; instrucțiunea adresează direct un cuvânt în pagină prin locația lui relativă. Pentru un cuvânt din afara paginii se actualizează registrul de pagină (sau se folosește alt registru de pagină, dacă există).", "Exemplu TI TMS320C2x/TMS320C5x: adresează 64 K cuvinte de date, dar instrucțiunile cu adresare scurtă directă au doar 7 biți de adresă (un cuvânt din 128 = 2^7) → memoria e împărțită în pagini de 128 cuvinte; pagina se alege încărcând numărul ei în registrul indicator de pagină.", "Tehnica e eficientă doar dacă programul face un număr semnificativ de accesări într-o pagină înainte de a trece la alta."]}], "capcane": ["„AX0 = 1234” folosește DOUĂ moduri: imediată pentru constanta 1234 și directă la registru pentru destinația AX0. O instrucțiune poate combina moduri diferite pentru operanzi diferiți.", "Implicită vs directă la registru: ambele lucrează cu registre; diferența e dacă programatorul poate alege registrele (directă la registru, ex. SUBF R1, R2) sau ele sunt fixate de instrucțiune (implicită, ex. P = X * Y, MUL).", "Imediată vs directă la memorie: la imediată în instrucțiune e VALOAREA (AX0 = 1234, MOVE #1234, A); la directă la memorie e ADRESA (AX0 = DM(1000), MOVE $1000, A). La Motorola „#” = dată imediată, „$” = adresă.", "„A6 = A6 + *R6” sau „A0 = A0 + *R5” (fără ++/--) = adresare indirectă cu registru simplă, nu pre/post-incrementare, indexare sau modulo.", "Cel mai folosit mod la majoritatea DSP-urilor este indirectă cu registru (nu directă). Cea mai comună modificare a registrului de adrese este post-incrementarea cu unu.", "La „A0 = A0 + *R7--” sau „*R5++” operatorul ++/-- modifică registrul de adrese (R7, R5), NU acumulatorul. A0 primește A0 + valoarea din memorie de la adresa veche din registru.", "La „*R5++R17” R17 este registru pentru offset (Analog Devices: „registru modificator”) și poate fi negativ, deci aceeași formă poate și decrementa.", "Indexarea NU modifică registrele (MOVE Y1, X:(R5 + N6); LDI *-AR1(1), R7 lasă AR1 neschimbat), deși „*-AR1(1)” arată ca o pre-decrementare. Pre-decrementarea reală modifică registrul: MOVE X:-(R0), A1.", "Termenul „index” e ambiguu: unii producători numesc „adresare indexată” post-incrementarea cu valoare diferită de 1, iar registrele offset „registre index”. Iar „registru modificator” apare de două ori: la Analog Devices = registru offset (6.6), la modulo = registrul cu lungimea bufferului (6.8).", "Pre-incrementarea (Motorola) necesită de obicei un ciclu instrucțiune în plus.", "Registrul modulo conține doar LUNGIMEA bufferului, nu adresa de start, deci bufferul trebuie să înceapă la o graniță de k cuvinte, k = cea mai mică putere a lui 2 ≥ lungimea: 48 → 64 (nu 48, nu 32).", "Registre de start/sfârșit: DSP16xx (AT&T) și TMS320C5x (TI), nu TMS320C3x (acela folosește registru modulo). Număr de buffere: DSP16xx 1, TMS320C5x 2, DSP561xx 4, DSP5600x și Analog Devices 8.", "Bufferul circular FIFO → adresare modulo (circulară); pointerii se actualizează tot prin pre/post-incrementare, dar modul de adresare cerut este cel modulo.", "Inversarea biților servește doar la FFT în baza 2 (DIT/DIF), „numai în împrejurări foarte speciale”; nu are legătură cu bufferele circulare. Transport invers = AT&T DSP32C/DSP32xx; bit în registrul de control = ADSP-210xx.", "Numere de reținut: scurtă imediată ≤ 12 biți (DSP5600x); scurtă directă ≤ 6 biți (DSP5600x); I/O pe ultimele 64 locații; paginată TMS320C2x/C5x: 7 biți, pagini de 128 cuvinte, 64 K cuvinte în total; SUBF R1, R2 (TMS320C3x): oricare două din cele 8 registre."]}], "grile": [{"id": "c1-v0", "curs": 1, "tip": "vechi", "sursa": "GRILE PS PARTIAL #1; SUBIECT POZA (GRILE PS PARTIAL) #1", "intrebare": "Care sunt cerințele funcționale generale ale procesoarelor de semnal?", "variante": ["executarea unui volum mare de operații aritmetice și logice simple și repetitive", "suport pentru CAD rapide, deoarece majoritatea semnalelor de intrare sunt analogice", "viteza mare de procesare, pentru a asigura execuția în timp real", "asigurarea unei precizii mari de prelucrare"], "corecte": [0, 1, 2, 3], "explicatie": "Curs 1 §1.2 (1/6) / Capitol 1 §1.1 enumeră exact patru particularități: viteză mare pentru timp real, volum mare de operații aritmetice și logice simple, precizie mare, semnale de intrare în multe cazuri analogice (de aici includerea circuitelor A/D și D/A). „Repetitive” vine din Curs 2 („activități repetitive”) și nu face varianta a falsă. Varianta b reformulează a patra cerință.", "sigur": true, "figura": ""}, {"id": "c1-v1", "curs": 1, "tip": "vechi", "sursa": "SUBIECT POZA (GRILE PS PARTIAL) #2", "intrebare": "Caracteristicile procesoarelor de semnal sunt:", "variante": ["includerea în circuit a unor module care facilitează creșterea productivității (de exemplu multiplicator hardware paralel, circuite pentru deplasări binare, memorii interne, stivă internă)", "implementarea software a stivei pentru a permite salvarea/restaurarea rapidă a contextului procesorului la întreruperi sau la accesarea unor subrutine", "au arhitecturi cu grad mare de paralelism în prelucrare, multe instrucțiuni fiind executate într-un singur tact", "setul de instrucțiuni este adaptat operațiilor cerute de algoritmii DSP"], "corecte": [0, 2, 3], "explicatie": "Variantele a, c și d sunt copiate din lista de căi din Curs 1 §1.2 (2/6). Varianta b e falsă: Capitol 1 §1.1 f) spune „implementarea HARDWARE a stivei permite salvarea/restaurarea rapidă a contextului”; stiva doar se poate extinde în RAM-ul de date.", "sigur": true, "figura": ""}, {"id": "c1-v2", "curs": 1, "tip": "vechi", "sursa": "SUBIECT POZA (GRILE PS PARTIAL) #8", "intrebare": "În ce domenii se folosesc procesoarele de semnal?", "variante": ["în domeniul IT: routere", "în telecom: modemuri, echipamente radio, telefonie, sisteme pentru transmisiuni de date", "în industria automobilelor, la computerele de bord", "în niciunul din domeniile de mai sus"], "corecte": [1, 2], "explicatie": "Curs 1 §1.1 (2/2): telecomunicații (modemuri, echipamente radio, televiziune, transmisiuni de date, telefonie celulară), medicină, industria automobilelor, instrumentație, periferice, robotică, electronică de consum. b și c sunt în listă. Routerele nu apar nicăieri în Curs/Capitol 1 (nici în tabelele 1.1 și 1.2), deci a pare distractorul. Nesigur: un profesor ar putea considera routerele parte din „transmisiuni de date”.", "sigur": false, "figura": ""}, {"id": "c1-v3", "curs": 1, "tip": "vechi", "sursa": "GRILE PS PARTIAL #4", "intrebare": "Arhitectura memoriei la procesoarele de semnal este:", "variante": ["o singură arie de memorie și pentru date și pentru instrucțiuni", "de tip Von Neumann", "împărțită în blocuri de memorie separate pentru date și pentru instrucțiuni", "de tip Harvard"], "corecte": [2, 3], "explicatie": "Capitol 1 §1.1 a): multe procesoare PDS combină pipeline-ul cu structura Harvard, cu memorii separate pentru coduri și date și căi separate de transfer. Detaliat în Curs 5 (DSP folosesc Harvard modificată). O singură memorie pentru date și instrucțiuni este arhitectura Von Neumann, a procesoarelor de uz general.", "sigur": true, "figura": ""}, {"id": "c1-v4", "curs": 1, "tip": "vechi", "sursa": "PS Grile (formular) – „Procesoarele în virgulă fixă au”; PS Grile (1) – aceeași; Grile final, SUBIECTE POZA .PNG #9; PS Grile (formular) + PS Grile (1) + Grile final, SUBIECTE POZA #9; grile mai vechi/12.png – selectat d", "intrebare": "Procesoarele în virgulă fixă au:", "variante": ["cost mai ridicat", "gamă dinamică ridicată", "arhitectură de sistem mai puțin complexă față de procesoarele cu virgulă mobilă", "programarea mai facilă față de procesoarele cu virgulă mobilă"], "corecte": [2], "explicatie": "Curs 1 §1.3 d) / Capitol 1 §1.2 „Reprezentarea numerelor”: virgula mobilă are gamă dinamică mult mai mare și simplifică proiectarea algoritmului și a software-ului, dar e mai lentă, mai scumpă, iar hardware-ul e mai complicat. Deci virgula fixă e mai ieftină (a falsă), are gamă dinamică mică (b falsă), se programează mai greu (d falsă) și are arhitectură mai simplă (c adevărată).", "sigur": true, "figura": ""}, {"id": "c1-v5", "curs": 1, "tip": "vechi", "sursa": "Grile final, GRILE.RTF – „Liderul de piață în producerea de DSP-uri” (variantele nu s-au păstrat; reconstruite din curs)", "intrebare": "Liderul de piață în producerea de DSP-uri este:", "variante": ["Texas Instruments", "AT&T", "Motorola", "Analog Devices"], "corecte": [0], "explicatie": "Capitol 1, Introducere (pag. 1): Texas Instruments 57%, AT&T 13%, Motorola 13%, NEC 8%, Analog Devices 6%. Răspunsul păstrat în fișier este tot Texas Instruments.", "sigur": true, "figura": ""}, {"id": "c1-v6", "curs": 1, "tip": "vechi", "sursa": "Grile final, GRILE.RTF – „Clasa de aplicații ce necesită rate mici de eșantionare și algoritmi complecși” (variantele nu s-au păstrat; reconstruite din Fig. 1.1)", "intrebare": "Clasa de aplicații ce necesită rate mici de eșantionare și algoritmi complecși este:", "variante": ["semnalizare radio și radar", "modelarea vremii", "televiziunea de înaltă definiție", "instrumentația"], "corecte": [1], "explicatie": "Fig. 1.1 (Curs 1 §1.3 (3/5), Capitol 1 pag. 10): modelarea vremii (weather modeling) are cea mai mică rată, ~1/1000 Hz, și algoritmi „more complex”. Radarul și HDTV au rate foarte mari și algoritmi mai simpli; instrumentația are rată mică, dar algoritmi simpli. Răspunsul păstrat în fișier este „Modelare a vremii”.", "sigur": true, "figura": ""}, {"id": "c1-v7", "curs": 1, "tip": "vechi", "sursa": "Grile final, GRILE.RTF – „Printre avantajele folosirii procesoarelor de semnal ... nu se regăsește” (variantele nu s-au păstrat; reconstruite din curs)", "intrebare": "Printre avantajele folosirii procesoarelor de semnal în realizarea sistemelor PDS NU se regăsește:", "variante": ["stabilitate mare la variații de temperatură, a tensiunii de alimentare sau a parametrilor componentelor", "lipsa unor modele matematice pentru proiectarea și analiza sistemelor", "lipsa problemelor legate de zgomotul introdus de sursele de alimentare", "costul redus al componentelor și folosirea procedeelor standard de fabricație"], "corecte": [1], "explicatie": "Curs 1 §1.2 (6/6) / Capitol 1 pag. 8: avantajul este EXISTENȚA unor modele matematice pentru proiectarea și analiza sistemelor. Celelalte trei sunt avantaje copiate din listă. Răspunsul păstrat în fișier este „Lipsa unor modele matematice...”.", "sigur": true, "figura": ""}, {"id": "c1-v8", "curs": 1, "tip": "vechi", "sursa": "Grile final, GRILE.RTF – „Virgulă mobilă au” (variantele nu s-au păstrat; reconstruite din curs)", "intrebare": "Procesoarele în virgulă mobilă au:", "variante": ["gamă dinamică ridicată", "cost mai redus decât cele în virgulă fixă", "viteză de lucru mai mare decât cele în virgulă fixă", "proiectarea algoritmului și a software-ului simplificată considerabil"], "corecte": [0, 3], "explicatie": "Capitol 1 §1.2 „Reprezentarea numerelor”: virgula mobilă asigură o gamă dinamică mult mai mare și, reducând depășirile de scală și normările, simplifică considerabil proiectarea algoritmului și a software-ului. Aritmetica în virgulă mobilă este însă mai lentă și mai scumpă (b, c false). Răspunsul păstrat în fișier este „Gama dinamică ridicată”; d a fost adăugată la reconstruire.", "sigur": true, "figura": ""}, {"id": "c1-v9", "curs": 1, "tip": "vechi", "sursa": "Grile final, GRILE.RTF – „Arhitectura Harvard are” (a patra variantă nu s-a păstrat)", "intrebare": "Arhitectura Harvard are:", "variante": ["memorie pentru instrucțiuni și memorie pentru date", "memorie pentru instrucțiuni și date și memorie pentru date", "primele două răspunsuri", "o singură memorie comună pentru instrucțiuni și date"], "corecte": [0, 1, 2], "explicatie": "Capitol 1 §1.1 a), c): Harvard folosește memorii separate pentru coduri și date; la DSP Harvard tradițională a fost modificată, coeficienții se țin în memoria de program și se transferă în memoria de date. Curs 5 §5.1 numește explicit varianta modificată (un bloc cu instrucțiuni și date, celălalt doar cu date). Răspunsul păstrat în fișier este „Primele 2 răspunsuri”. Nesigur: în sursă varianta b apare ca „memorie pentru instrucțiuni și date și memorie pentru instrucțiuni” (probabil greșeală de tipar), iar varianta d a fost reconstruită. Întrebarea ține mai mult de Curs 5.", "sigur": false, "figura": ""}, {"id": "c2-v10", "curs": 2, "tip": "vechi", "sursa": "GRILE PS PARTIAL #9", "intrebare": "Caracteristicile procesoarelor de semnal sunt:", "variante": ["arhitectura multiacces a memoriei, care presupune multiple accesări la memorie într-un singur ciclu instrucțiune", "operație rapidă de multiplicare și acumulare (MAC) într-un singur ciclu instrucțiune", "moduri de adresare specializate", "arhitectura multiacces a memoriei, care presupune o singură accesare la memorie în mai multe cicluri instrucțiune"], "corecte": [0, 1, 2], "explicatie": "Curs 2, §2.1 (Tabelul 2.2): caracteristicile comune sunt MAC rapidă, arhitectura multiacces, moduri de adresare specializate, control specializat, periferice și interfețe I/O. MAC se face „într-un singur ciclu instrucțiune”, iar multiaccesul înseamnă „a executa câteva cicluri de acces la memorie într-un singur ciclu instrucțiune”. Varianta d inversează definiția multiaccesului, deci e falsă.", "sigur": true, "figura": ""}, {"id": "c2-v11", "curs": 2, "tip": "vechi", "sursa": "GRILE PS PARTIAL #3 (subiect comun cu Curs 4 – calea de date)", "intrebare": "Care din afirmațiile următoare sunt adevărate:", "variante": ["deoarece multiplicarea este operația principală în PDS, procesoarele digitale de semnal realizează multiplicarea într-un singur ciclu mașină", "există procesoare cu două căi de date: una în virgulă fixă și una în virgulă mobilă", "calea de date la procesoarele în virgulă fixă este identică cu cea a procesoarelor în virgulă mobilă", "procesoarele digitale de semnal nu permit operații de multiplicare-acumulare în același ciclu mașină"], "corecte": [0, 1], "explicatie": "Curs 2, §2.1 (MAC): procesoarele PDS execută multiplicarea-acumularea într-un singur ciclu instrucțiune, cu multiplicator și acumulator integrate în calea de date, deci d e falsă, iar a e adevărată (și Curs 4: multiplicatorul înmulțește doi operanzi de mărime nativă într-un singur ciclu instrucțiune). Capitol 4 spune că unele procesoare în virgulă mobilă au două căi de date, una pentru virgulă mobilă și una pentru virgulă fixă, deci b e adevărată; tot Cap. 4 spune că la virgulă mobilă calea de date e semnificativ diferită de cea în virgulă fixă, deci c e falsă.", "sigur": true, "figura": ""}, {"id": "c2-v12", "curs": 2, "tip": "vechi", "sursa": "Grile final – GRILE.RTF (variantele nu sunt în fișier, doar răspunsul; trimitere „pag5-curs2”)", "intrebare": "Varianta constructivă care combină într-un singur cip elemente de procesare diferite (de ex. un microprocesor și un microcontroler) se numește:", "variante": ["module multicip", "cipuri multiprocesor", "seturi de circuite", "nuclee PDS"], "corecte": [1], "explicatie": "Curs 2, §2.2 – Cipuri multiprocesor: proiectanții încorporează mai multe procesoare într-un singur circuit integrat; Motorola și Zilog oferă un microprocesor și un microcontroler într-un singur cip, iar TriCore (Siemens) are un procesor de uz general, un PDS și un microcontroler. MCM-ul are mai multe cipuri într-o capsulă, iar setul de circuite împarte un procesor în mai multe capsule. Fișierul dă doar răspunsul (cipuri multiprocesor), variantele a, c, d sunt refăcute din lista variantelor constructive.", "sigur": true, "figura": ""}, {"id": "c2-v13", "curs": 2, "tip": "vechi", "sursa": "Grile final – GRILE.RTF (variantele nu sunt în fișier, doar răspunsul „(d)”; trimitere „pag1-curs2”)", "intrebare": "Operația de multiplicare-acumulare este utilă în algoritmi precum:", "variante": ["algoritmii de căutare și sortare a datelor", "algoritmii de control al interfeței cu utilizatorul", "algoritmii de tratare a întreruperilor", "algoritmii care necesită calculul produsului a doi vectori"], "corecte": [3], "explicatie": "Curs 2, §2.1 – Operația rapidă de multiplicare și acumulare: „este utilă în algoritmii care necesită calculul produsului a doi vectori (de exemplu, filtrarea digitală, corelația, calculul transformatei Fourier)”. Fișierul dă răspunsul d; variantele a–c sunt refăcute ca distractori. Atenție: dacă la test apar filtrarea digitală, corelația sau transformata Fourier ca variante, și ele sunt corecte.", "sigur": true, "figura": ""}, {"id": "c2-v14", "curs": 2, "tip": "vechi", "sursa": "Grile final – GRILE.RTF (inițial Adevărat/Fals, răspuns „True”; refăcută cu 4 variante)", "intrebare": "Procesoarele de semnal pot executa mai multe operații de citire sau de scriere din/în memorie într-un ciclu mașină:", "variante": ["adevărat, pentru orice instrucțiune și orice locație de memorie, inclusiv memoria externă", "adevărat, dar de regulă accesarea multiplă e restricționată: locațiile accesate sunt în cip și doar anumite instrucțiuni o permit", "fals, un procesor PDS face o singură accesare la memorie în mai multe cicluri instrucțiune", "fals, accesările multiple într-un ciclu sunt posibile doar la microprocesoarele de uz general"], "corecte": [1], "explicatie": "Curs 2, §2.1 – Arhitectura multiacces a memoriei: procesoarele PDS pot executa câteva cicluri de acces la memorie într-un singur ciclu instrucțiune (răspunsul original: Adevărat). „La multe procesoare PDS, accesarea multiplă a memoriei într-un singur ciclu este restricționată”: locațiile sunt în cip și doar anumite instrucțiuni o pot face, deci a e prea generală. Subiectul se leagă și de Curs 5 (memorii cu acces multiplu).", "sigur": true, "figura": ""}, {"id": "c3-v15", "curs": 3, "tip": "vechi", "sursa": "GRILE PS PARTIAL #2", "intrebare": "Emularea funcționării în virgulă mobilă are rolul de a obține următoarele avantaje:", "variante": ["creșterea preciziei și a gamei dinamice;", "reducerea preciziei și creșterea gamei dinamice;", "creșterea preciziei și reducerea gamei dinamice;", "reducerea preciziei și a gamei dinamice;"], "corecte": [0], "explicatie": "Curs 3 / Capitol 3, §3.4: pe un procesor cu virgulă fixă se pot obține „precizia și gama dinamică caracteristice aritmeticii de precizie extinsă” prin rutine software care emulează un procesor cu virgulă mobilă – deci cresc ambele.", "sigur": true, "figura": ""}, {"id": "c3-v16", "curs": 3, "tip": "vechi", "sursa": "GRILE PS PARTIAL #5", "intrebare": "În cazul procesoarelor în virgulă fixă, datele pot fi reprezentate:", "variante": ["doar valori binare în intervalul [-2, 2];", "doar numere binare pe 16 biți;", "sub formă de numere fracționare în intervalul [-1, 1];", "sub formă de numere întregi (cu sau fără semn);"], "corecte": [2, 3], "explicatie": "Curs 3 / Capitol 3, §3.1: „numerele sunt reprezentate fie ca întregi (aritmetica întreagă), fie ca fracții cu valoarea între –1,0 și +1,0 (aritmetica fracționară)”. Nu e „doar 16 biți” (§3.2: există și 20, 24 biți), iar intervalul [-2, 2] nu apare. Capitolul (§3.3) menționează și operanzi cu sau fără semn.", "sigur": true, "figura": ""}, {"id": "c3-v17", "curs": 3, "tip": "vechi", "sursa": "GRILE PS PARTIAL #8", "intrebare": "În cazul procesoarelor în virgulă fixă, dacă există necesitatea ca anumite operații să fie executate în virgulă mobilă, se apelează la următoarea soluție:", "variante": ["emularea software a operațiilor în virgulă mobilă, cu ajutorul bibliotecilor software;", "folosirea unui grup de numere cu aceleași mantise, dar cu exponenți diferiți;", "micșorarea gamei dinamice și a preciziei;", "folosirea unui grup de numere cu aceiași exponenți, dar cu mantise diferite;"], "corecte": [0, 3], "explicatie": "Curs 3 / Capitol 3, §3.4: (a) rutine software de emulare, din biblioteci furnizate de producători sau scrise de utilizator; (d) virgula mobilă pe bloc – „un grup de numere cu mantise diferite dar un singur exponent”. (b) este inversul definiției, (c) e opusul scopului.", "sigur": true, "figura": ""}, {"id": "c3-v18", "curs": 3, "tip": "vechi", "sursa": "GRILE PS PARTIAL #10", "intrebare": "În cazul procesoarelor în virgulă fixă, principala diferență între aritmeticile pentru numere întregi și cele pentru numere fracționare este:", "variante": ["numărul de pini ai capsulei procesorului;", "dimensiunea memoriei externe;", "complexitatea circuitelor hardware;", "modul de manipulare a rezultatului multiplicărilor;"], "corecte": [3], "explicatie": "Curs 3 / Capitol 3, §3.1: „Principala diferență între cele două reprezentări este legată de modul în care sunt manipulate rezultatele operațiilor de multiplicare”; algoritmii și hardware-ul sunt virtual identici (deci nu (c)). Pinii și memoria externă țin de lungimea cuvântului (§3.2).", "sigur": true, "figura": ""}, {"id": "c3-v19", "curs": 3, "tip": "vechi", "sursa": "Grile final, GRILE.RTF – „Virgula mobila au” (variantele lipsesc în sursă, reconstruite după grila pereche de la virgulă fixă)", "intrebare": "Procesoarele în virgulă mobilă au:", "variante": ["cost mai ridicat;", "gamă dinamică ridicată;", "arhitectură de sistem mai puțin complexă față de procesoarele cu virgulă fixă;", "programarea mai facilă față de procesoarele cu virgulă fixă;"], "corecte": [0, 1, 3], "explicatie": "Curs 3 / Capitol 3, §3.1: virgula mobilă oferă „o gamă dinamică mai largă”, procesoarele sunt „mai scumpe … dar mai ușor de programat”, iar circuitul e mai complex (cip mai mare). Notițele vechi rețin doar „gamă dinamică ridicată”, dar după curs și (a), (d) sunt adevărate. Variantele sunt reconstruite, deci verifică ce opțiuni apar efectiv.", "sigur": false, "figura": ""}, {"id": "c3-v20", "curs": 3, "tip": "vechi", "sursa": "Grile final, GRILE.RTF – „Virgula fixa aritmetica intreaga” (variante reconstruite)", "intrebare": "Numărul 10100100, reprezentat în virgulă fixă cu aritmetică întreagă pe 8 biți (complement față de 2), are valoarea zecimală:", "variante": ["-92", "164", "92", "-36"], "corecte": [0], "explicatie": "Curs 3, slide „Virgula fixă – Aritmetica întreagă”: ponderi –2^7, 2^6, …, 2^0; se adună ponderile biților 1: –128 + 32 + 4 = –92. 164 ar fi interpretarea fără semn.", "sigur": true, "figura": ""}, {"id": "c3-v21", "curs": 3, "tip": "vechi", "sursa": "Grile final, GRILE.RTF – „Virgula fixa aritmetica fractionara” 10110000 (variante reconstruite)", "intrebare": "Numărul 10110000, reprezentat în virgulă fixă cu aritmetică fracționară pe 8 biți, are valoarea:", "variante": ["-0,625", "0,6875", "-0,375", "-80"], "corecte": [0], "explicatie": "Curs 3, slide „Virgula fixă – Aritmetica fracționară”: ponderi –2^0, 2^-1, …, 2^-7: –1 + 1/4 + 1/8 = –0,625. 0,6875 = citire fără semn, –80 = citire ca întreg.", "sigur": true, "figura": ""}, {"id": "c3-v22", "curs": 3, "tip": "vechi", "sursa": "Grile final, GRILE.RTF – fracționar 01010000 (variante reconstruite; identic cu Exemplul 1 din slide)", "intrebare": "În reprezentarea datelor în virgulă fixă cu aritmetică fracționară, numărul 01010000 are valoarea:", "variante": ["0,625", "80", "0,3125", "-0,375"], "corecte": [0], "explicatie": "Curs 3, slide aritmetică fracționară, Exemplul 1: 2^-1 + 2^-3 = 0,5 + 0,125 = 0,625. 80 = citire ca întreg.", "sigur": true, "figura": ""}, {"id": "c3-v23", "curs": 3, "tip": "vechi", "sursa": "Grile final, GRILE.RTF – „Care dintre următoarele variante e cea mai completă” (varianta b reconstruită)", "intrebare": "Care dintre următoarele variante este cea mai completă?", "variante": ["În general, procesoarele cu virgulă mobilă acceptă și date cu virgulă fixă;", "Procesoarele cu virgulă fixă folosesc doar aritmetica cu întregi;", "a și d adevărate;", "Majoritatea procesoarelor DSP cu virgulă fixă suportă atât aritmetica fracționară, cât și cea cu întregi;"], "corecte": [2], "explicatie": "Curs 3 / Capitol 3, §3.1: „procesoarele cu virgulă mobilă acceptă și date cu virgulă fixă (de obicei întregi)” și „majoritatea procesoarelor DSP cu virgulă fixă suportă atât aritmetica fracționară cât și cea cu întregi” → (a) și (d) sunt adevărate, deci varianta cea mai completă este (c). Varianta (b) nu apare în sursă (reconstruită).", "sigur": true, "figura": ""}, {"id": "c3-v24", "curs": 3, "tip": "vechi", "sursa": "Grile final, GRILE.RTF – exponent 1110111001 (variante reconstruite)", "intrebare": "Pentru numărul în virgulă mobilă 1110111001, cu mantisa pe 5 biți și exponentul pe 5 biți, valoarea exponentului este:", "variante": ["-7", "25", "7", "-9"], "corecte": [0], "explicatie": "Curs 3, slide-urile de conversie în virgulă mobilă: primii biți = mantisa, ultimii = exponentul (întreg în complement față de 2). Exponent = 11001 = –16 + 8 + 1 = –7. 25 = citire fără semn.", "sigur": true, "figura": ""}, {"id": "c3-v25", "curs": 3, "tip": "vechi", "sursa": "Grile final, GRILE.RTF – 10010001 (variante reconstruite)", "intrebare": "Numărul în virgulă mobilă 10010001, cu mantisa pe 5 biți și exponentul pe 3 biți, are valoarea:", "variante": ["-1,75", "-0,875", "1,125", "-3,5"], "corecte": [0], "explicatie": "Curs 3, slide-uri conversie: mantisa 10010 = –1 + 1/8 = –0,875; exponent 001 = 1; valoare = –0,875 × 2^1 = –1,75.", "sigur": true, "figura": ""}, {"id": "c3-v26", "curs": 3, "tip": "vechi", "sursa": "Grile final, GRILE.RTF – 1100000000111110 (variante reconstruite; = exemplul de pe slide 12, Curs 3)", "intrebare": "Numărul în virgulă mobilă 1100000000111110, cu mantisa pe 10 biți și exponentul pe 6 biți, are valoarea:", "variante": ["-0,125", "-0,5", "0,125", "-2"], "corecte": [0], "explicatie": "Curs 3, slide „Exemplu de conversie … număr negativ cu exponent negativ”: mantisa 1100000000 = –1 + 1/2 = –0,5; exponent 111110 = –32+16+8+4+2 = –2; valoare = –0,5 × 2^-2 = –0,125.", "sigur": true, "figura": ""}, {"id": "c3-v27", "curs": 3, "tip": "vechi", "sursa": "Grile final, GRILE.RTF – 01001011 (variante reconstruite)", "intrebare": "Numărul în virgulă mobilă 01001011, cu mantisa pe 5 biți și exponentul pe 3 biți, are valoarea:", "variante": ["4,5", "0,5625", "2,25", "-4,5"], "corecte": [0], "explicatie": "Mantisa 01001 = 1/2 + 1/16 = 0,5625; exponent 011 = 3; valoare = 0,5625 × 2^3 = 4,5 (metoda din slide-urile de conversie, Curs 3 §3.1).", "sigur": true, "figura": ""}, {"id": "c3-v28", "curs": 3, "tip": "vechi", "sursa": "Grile final, GRILE.RTF – „1010001” (în sursă lipsește un bit; corectat la 10100001, conform calculului din notițe; variante reconstruite)", "intrebare": "Numărul în virgulă mobilă 10100001, cu mantisa pe 5 biți și exponentul pe 3 biți, are valoarea:", "variante": ["-1,5", "-0,75", "1,25", "-3"], "corecte": [0], "explicatie": "Mantisa 10100 = –1 + 1/4 = –0,75; exponent 001 = 1; valoare = –0,75 × 2 = –1,5 (metoda din slide-urile de conversie, Curs 3 §3.1). Numărul din sursă are doar 7 biți, de aceea l-am completat.", "sigur": true, "figura": ""}, {"id": "c3-v29", "curs": 3, "tip": "vechi", "sursa": "Grile final, GRILE.RTF – IEEE 754 (variante reconstruite)", "intrebare": "Standardul IEEE 754 specifică următoarele formate de bază pentru reprezentarea în virgulă mobilă:", "variante": ["precizia simplă pe 32 de biți, cu 24 de biți mantisa și 8 biți exponentul;", "precizia dublă pe 64 de biți, cu 52 de biți mantisa și 12 biți exponentul;", "precizia simplă pe 16 biți, cu 10 biți mantisa și 6 biți exponentul;", "precizia simplă pe 32 de biți, cu 8 biți mantisa și 24 de biți exponentul;"], "corecte": [0, 1], "explicatie": "Capitol 3, §3.5 (IEEE 754): „Precizia simplă pe 32 de biți cu 24 de biți mantisa și 8 biți exponentul; Precizia dublă pe 64 de biți cu 52 de biți mantisa și 12 biți exponentul”. Notițele rețin doar precizia simplă; dacă apare și (b) cu cifrele din curs, e tot corectă. Variante reconstruite.", "sigur": false, "figura": ""}, {"id": "c4-v30", "curs": 4, "tip": "vechi", "sursa": "GRILE PS PARTIAL – SUBIECT POZA #4", "intrebare": "Biții de gardă:", "variante": ["sunt biți suplimentari, integrați în registrele acumulator", "sunt folosiți pentru a semnaliza erorile de accesare la memorie", "nu permit acumularea numerelor fără a avea depășiri și fără a fi nevoie de scalare", "oferă o flexibilitate mai mare decât scalarea produsului"], "corecte": [0, 3], "explicatie": "Curs 4 §4.1 Regiștrii acumulator: acumulatorul e mai mare decât ieșirea multiplicatorului cu câțiva biți, biții suplimentari = biți de gardă (a); ei PERMIT adunarea unui număr de valori fără depășire și fără scalarea rezultatelor intermediare, deci c) e fals. Capitol 4: „biții de gardă asigură o mai mare flexibilitate în evitarea depășirilor de scală decât scalarea produsului” (d). b) nu are legătură.", "sigur": true, "figura": ""}, {"id": "c4-v31", "curs": 4, "tip": "vechi", "sursa": "GRILE PS PARTIAL – SUBIECT POZA #6", "intrebare": "În cazul procesoarelor în virgulă mobilă, tratarea depășirilor se face prin:", "variante": ["scalarea corespunzătoare a tuturor valorilor", "creșterea gamei dinamice", "saturarea aritmetică", "creșterea preciziei"], "corecte": [2], "explicatie": "Curs 4 §4.2 Overflow, underflow: majoritatea DSP în virgulă mobilă înregistrează depășirea setând un bit de stare și limitând automat rezultatul la cea mai pozitivă sau cea mai negativă valoare reprezentabilă – adică saturare (c). Scalarea tuturor valorilor (a) e prima tehnică de la virgulă fixă. Nesigur: gama dinamică mai mare (b) este motivul pentru care depășirea e „mai puțin gravă” în virgulă mobilă și profesorul ar putea-o considera și ea corectă; cursul nu o prezintă însă ca metodă de tratare.", "sigur": false, "figura": ""}, {"id": "c4-v32", "curs": 4, "tip": "vechi", "sursa": "GRILE PS PARTIAL – SUBIECT POZA #7", "intrebare": "În cazul procesoarelor în virgulă mobilă, rotunjirea se referă la:", "variante": ["egalarea valorilor foarte mici cu 0", "reducerea lungimii cuvintelor prin eliminarea unui număr de biți", "reducerea spațiului de memorie ocupat prin suprapunerea biților", "trunchierea rezultatelor prin ignorarea biților cei mai nesemnificativi"], "corecte": [1], "explicatie": "Curs 4 §4.2 Rotunjirea: operațiile cresc numărul de biți, iar procesoarele rezolvă creșterea preciziei rotunjind automat la formatul intermediar de 40÷44 biți și, la scrierea în memorie, la formatul nativ de 32 biți – deci reducerea lungimii cuvintelor (b). a) descrie underflow-ul (rezultat setat la zero). d) descrie trunchierea, tratată în curs ca tehnică distinctă de rotunjire. Nesigur pentru că formularea lui b) e vagă, iar „rotunjirea către zero” din IEEE 754 seamănă cu trunchierea.", "sigur": false, "figura": ""}, {"id": "c4-v33", "curs": 4, "tip": "vechi", "sursa": "Grile final – GRILE.RTF (variantele originale lipsesc, reconstituite)", "intrebare": "Dacă multiplicatorul operează cu 2 numere pe n biți, registrul de la ieșirea acestuia ar trebui să aibă:", "variante": ["n biți", "2n biți", "n + 4 biți", "n/2 biți"], "corecte": [1], "explicatie": "Capitol 4 §4.1 Multiplicatorul (pag. 3): când înmulțim două numere în virgulă fixă pe n biți sunt necesari 2n biți pentru a reprezenta produsul fără eroare (legea de conservare a biților).", "sigur": true, "figura": ""}, {"id": "c4-v34", "curs": 4, "tip": "vechi", "sursa": "Grile final – GRILE.RTF (variantele originale lipsesc, reconstituite)", "intrebare": "La DSP-ul DSP16xx (AT&T) multiplicatorul lucrează pe 32 biți și acumulatoarele au capacitatea de 36 biți. Cu câți biți de gardă este prevăzut acest model de DSP?", "variante": ["2", "4", "8", "36"], "corecte": [1], "explicatie": "Capitol 4 §4.1 Regiștrii acumulator: DSP16xx asigură patru biți de gardă (acumulatoare de 36 biți, multiplicator pe 32 biți); 36 − 32 = 4.", "sigur": true, "figura": ""}, {"id": "c4-v35", "curs": 4, "tip": "vechi", "sursa": "Grile final – GRILE.RTF (variantele originale lipsesc, reconstituite)", "intrebare": "Ce valoare are numărul 0010101 în urma operației de trunchiere cu 4 biți?", "variante": ["001 = 1", "0010 = 2", "0011 = 3", "0101 = 5"], "corecte": [0], "explicatie": "Curs 4 §4.1 Trunchierea: se descarcă cei mai puțin semnificativi biți. Eliminând 4 LSB din 0010101 rămâne 001 = 1 (răspunsul din notițele studenților). Nesigur din cauza formulării: dacă „cu 4 biți” înseamnă „păstrând 4 biți”, rămân cei mai semnificativi 4 biți, 0010 = 2.", "sigur": false, "figura": ""}, {"id": "c4-v36", "curs": 4, "tip": "vechi", "sursa": "Grile final – GRILE.RTF (variantele originale lipsesc, reconstituite)", "intrebare": "Aplicând operația de rotunjire convergentă păstrând 6 biți, valoarea 1010011000 devine:", "variante": ["101001", "101010", "101000", "101011"], "corecte": [1], "explicatie": "Curs 4 §4.1 Rotunjirea: se păstrează 101001, partea eliminată 1000 este exact jumătate; la rotunjirea convergentă direcția depinde de bitul care devine LSB: aici e 1 → rotunjire în sus: 101001 + 1 = 101010.", "sigur": true, "figura": ""}, {"id": "c4-v37", "curs": 4, "tip": "vechi", "sursa": "Grile final – GRILE.RTF (variantele originale lipsesc, reconstituite)", "intrebare": "Aplicând operația de rotunjire convergentă păstrând 6 biți, valoarea 11101010 devine:", "variante": ["111010", "111011", "111001", "111100"], "corecte": [0], "explicatie": "Curs 4 §4.1 Rotunjirea: se păstrează 111010, partea eliminată 10 este exact jumătate; bitul care devine LSB e 0 → rotunjire în jos, rezultatul rămâne 111010.", "sigur": true, "figura": ""}, {"id": "c4-v38", "curs": 4, "tip": "vechi", "sursa": "Grile final – GRILE.RTF (variantele originale lipsesc, reconstituite)", "intrebare": "Aplicând operația de rotunjire convergentă păstrând 4 biți, valoarea 10100101 devine:", "variante": ["1010", "1011", "1001", "0101"], "corecte": [0], "explicatie": "Se păstrează 1010; partea eliminată 0101 e sub jumătate (1000), deci se rotunjește în jos la cea mai apropiată valoare: 1010 (regula LSB 0/1 a rotunjirii convergente contează doar la mijloc exact) – Curs 4 §4.1 Trunchierea și rotunjirea.", "sigur": true, "figura": ""}, {"id": "c4-v39", "curs": 4, "tip": "vechi", "sursa": "Grile final – GRILE.RTF (variantele originale lipsesc, reconstituite)", "intrebare": "Unitatea ALU a procesorului DSP cu virgulă mobilă nu poate executa operațiile:", "variante": ["adunări și scăderi", "calculul valorii absolute și negări", "înmulțire", "calculul valorii minime și maxime"], "corecte": [2], "explicatie": "Curs 4 §4.2 UAL: ALU în virgulă mobilă execută adunări, scăderi, valoare absolută, negări, minim/maxim; înmulțirea e făcută de multiplicator (răspunsul din notițe: c, înmulțire). Dacă pe foaie apare și „operații logice pe bit (ȘI, SAU, NEGARE)”, și aceea e corectă: nu sunt executate de ALU numai pentru virgulă mobilă.", "sigur": true, "figura": ""}, {"id": "c4-v40", "curs": 4, "tip": "vechi", "sursa": "Grile final – GRILE.RTF (variantele originale lipsesc, reconstituite)", "intrebare": "În general, într-un DSP succesiunea proceselor pe calea de date este:", "variante": ["Multiplicare, Acumulare, Deplasare, Rotunjire", "Acumulare, Multiplicare, Rotunjire, Deplasare", "Deplasare, Multiplicare, Rotunjire, Acumulare", "Rotunjire, Deplasare, Acumulare, Multiplicare"], "corecte": [0], "explicatie": "Ordinea secțiunilor din Curs 4 §4.1 și din Fig. 4.1: multiplicatorul → acumulatorul (MAC) → deplasatorul (scalarea pentru memorie) → trunchierea/rotunjirea la scrierea în memorie. Cursul nu formulează explicit o „succesiune”, răspunsul vine din notițele studenților.", "sigur": false, "figura": ""}, {"id": "c4-v41", "curs": 4, "tip": "vechi", "sursa": "Grile final – GRILE.RTF (variantele originale lipsesc, reconstituite)", "intrebare": "Scalarea (multiplicarea) ieșirii cu o dată putere a lui doi este realizată de:", "variante": ["multiplicator", "ALU", "deplasator", "acumulator"], "corecte": [2], "explicatie": "Curs 4 §4.1 Deplasatorul: un deplasator (shifter) pe calea de date ușurează selecția biților scalând (multiplicând) ieșirea cu o dată putere a lui doi.", "sigur": true, "figura": ""}, {"id": "c4-v42", "curs": 4, "tip": "vechi", "sursa": "Grile final – GRILE.RTF (variantele originale lipsesc, reconstituite)", "intrebare": "Când sunt înmulțite două date în virgulă mobilă cu precizie simplă IEEE-754, fiecare dată de intrare are lărgimea efectivă a mantisei de 24 biți. Pentru a menține întreaga precizie, data de ieșire ar necesita o mantisă de lărgime efectivă de:", "variante": ["24 biți", "32 biți", "48 biți", "56 biți"], "corecte": [2], "explicatie": "Curs 4 §4.2 Multiplicatorul: pentru a menține întreaga precizie ieșirea ar necesita o mantisă de 48 biți; majoritatea DSP-urilor nu admit această lungime și dau doar 8 sau 12 biți în plus.", "sigur": true, "figura": ""}, {"id": "c4-v43", "curs": 4, "tip": "vechi", "sursa": "Grile final – GRILE.RTF: „Câți biți de gardă are arhitectura din fig. de mai jos?” (notat 4?) și „Câți biți de gardă oferă arhitectura următoare?” (notat 8?) – figurile lipsesc", "intrebare": "Câți biți de gardă oferă arhitectura din figură (calea de date DSP5600x, Fig. 4.1: operanzi pe 24 biți, produs pe 48 biți, acumulatoare pe 56 biți)?", "variante": ["2", "4", "8", "16"], "corecte": [2], "explicatie": "Numărul de biți de gardă = lățimea acumulatorului − lățimea ieșirii multiplicatorului (Capitol 4 §4.1 Regiștrii acumulator). Pentru DSP5600x: 56 − 48 = 8. Figurile din grilele vechi nu s-au păstrat: dacă figura arată acumulator de 36 biți și multiplicator pe 32 (DSP16xx), răspunsul e 4; dacă arată 40/32 (ADSP-21xx), e 8. Pe foaie: scazi biții produsului din biții acumulatorului.", "sigur": false, "figura": ""}, {"id": "c4-v44", "curs": 4, "tip": "vechi", "sursa": "Grile final – GRILE.RTF (variantele originale lipsesc, reconstituite)", "intrebare": "Rezultatul produs de ALU este preluat de:", "variante": ["registrii acumulatori", "registrii de adresă", "numărătorul de program", "unitatea de generare a adreselor"], "corecte": [0], "explicatie": "Curs 4 §4.1 Regiștrii acumulator: rețin rezultatele parțiale și finale ale operației de multiplicare-acumulare și ale altor operații aritmetice; acumulatorul e folosit ca operand sursă și destinație pentru operațiile ALU (Capitol 4).", "sigur": true, "figura": ""}, {"id": "c4-v45", "curs": 4, "tip": "vechi", "sursa": "PS Grile (Google Form), PS Grile (1), Grile final – SUBIECTE POZA .PNG #21; grile mai vechi/26.png – selectat a", "intrebare": "Regiștrii ce se pot utiliza ca operanzi pentru majoritatea operațiilor aritmetice și de multiplicare sunt:", "variante": ["regiștri acumulatori", "regiștri pentru adresă", "registrul de uz general", "numărătorul de program"], "corecte": [0, 2], "explicatie": "Curs 4 §4.1/§4.2 Operanzii și regiștrii operand: operanzii provin de la regiștri operand sau de la acumulator (a); la virgulă mobilă, regiștrii de uz general pot primi rezultatele MAC și ale altor operații (TMS320C3x) (c). Regiștrii de adresă țin de unitatea de generare a adreselor, iar PC-ul de controlul programului. Nesigur: întrebarea pare luată din alt curs (setul de instrucțiuni / regiștri), iar varianta oficială poate fi doar a).", "sigur": false, "figura": ""}, {"id": "c4-v46", "curs": 4, "tip": "vechi", "sursa": "PS Grile (Google Form), PS Grile (1), Grile final – SUBIECTE POZA .PNG #15; grile mai vechi/19.png (Moodle Lucrare 2, Seria A 2020) întrebarea 16 – selectat d", "intrebare": "La deplasarea aritmetică la dreapta, numărul 010010 devine:", "variante": ["100101", "100100", "101001", "001001"], "corecte": [3], "explicatie": "Deplasarea aritmetică la dreapta copiază bitul de semn (0) în MSB: 010010 → 001001. Curs 4 §4.1 Deplasatorul menționează deplasările logice „fără extensie de semn” (DSP5600x), deci cele aritmetice păstrează/extind semnul.", "sigur": true, "figura": ""}, {"id": "c5-v47", "curs": 5, "tip": "vechi", "sursa": "GRILE PS PARTIAL #6", "intrebare": "Stările de așteptare pot avea următoarele cauze:", "variante": ["folosirea unor memorii lente", "împărțirea magistralei cu alte dispozitive", "memorie cache pentru secvențe de instrucțiuni", "apariția unor conflicte la accesarea resurselor"], "corecte": [0, 1, 3], "explicatie": "Curs 5, 5.3 (slide 12): „Stările de așteptare pot avea următoarele cauze: apariția unor conflicte la accesarea resurselor, folosirea unor memorii lente, împărțirea magistralei cu alte dispozitive.” Cache-ul pentru program este o metodă de reducere a accesărilor (5.2), nu o cauză.", "sigur": true, "figura": ""}, {"id": "c5-v48", "curs": 5, "tip": "vechi", "sursa": "GRILE PS PARTIAL #7", "intrebare": "Caracteristicile memoriilor cu acces multiplu sunt:", "variante": ["sunt mai eficiente decât folosirea mai multor blocuri de memorii separate", "cu instrucțiuni speciale, se pot executa în paralel operații de scriere și operații de citire", "se pot realiza, în cazul unui singur ciclu instrucțiune, două cicluri de acces la memorie", "au cel puțin două porturi de acces la memorie"], "corecte": [1, 2, 3], "explicatie": "b: Curs 5, 5.1 „Operații specializate de scriere” – instrucțiuni speciale permit scrieri în paralel cu citirile. c: Curs 2 / Capitol 2 „arhitectura multiacces” – mai multe cicluri de acces la memorie într-un singur ciclu instrucțiune; Capitol 5: memoriile rapide fac două accesări pe ciclu, dual-port permite două accesări simultane. d: memoriile multiport au mai multe seturi de bus-uri, cele mai folosite fiind dual-port (minim două porturi). a: cursul nu spune că ar fi „mai eficiente” decât blocurile separate – spune doar că elimină necesitatea ordonării datelor în blocuri și că au dezavantajul ariei mari pe chip. Nesigur: d e adevărat strict pentru memoriile multiport (memoriile rapide au un singur set de bus-uri), iar a ar putea fi considerat adevărat de profesor.", "sigur": false, "figura": ""}, {"id": "c5-v49", "curs": 5, "tip": "vechi", "sursa": "SUBIECT POZA #9 (variantă a GRILE PS PARTIAL #7)", "intrebare": "Caracteristicile memoriilor cu acces multiplu sunt:", "variante": ["nu se pot realiza, în cadrul unui singur ciclu instrucțiune, două cicluri de acces la memorie", "cu instrucțiuni speciale, se pot executa în paralel operații de scriere și operații de citire", "au cel puțin patru porturi de acces la memorie", "sunt mai eficiente decât folosirea mai multor blocuri de memorii separate"], "corecte": [1], "explicatie": "b: Curs 5, 5.1 – operații specializate de scriere, executate în paralel cu citirile prin instrucțiuni speciale. a e negația proprietății de bază (se pot face două sau mai multe accesări într-un ciclu). c: cele mai folosite sunt dual-port; 3–4 porturi doar rar (Capitol 5, 5.1). d: cursul nu afirmă asta (vezi PARTIAL #7). Nesigur doar din cauza lui d.", "sigur": false, "figura": ""}, {"id": "c5-v50", "curs": 5, "tip": "vechi", "sursa": "SUBIECT POZA #3", "intrebare": "Măsurile folosite pentru reducerea timpului de acces la memorie sunt:", "variante": ["folosirea unui singur bloc de memorie pentru date și instrucțiuni, cu acces multiplu prin porturi separate", "prevederea de memorii cache rapide, situate între memoria principală, de mare capacitate, și procesor", "introducerea unor arii de memorie în structura internă a procesorului, pentru stocarea programelor și a datelor, evitând astfel folosirea memoriei externe", "folosirea arhitecturii Harvard (blocuri separate de memorie cu magistrale separate de acces)"], "corecte": [1, 2, 3], "explicatie": "Lista nu apare identic în curs. d: Capitol 5, 5.1 – Harvard permite două accesări pe ciclu. b: 5.2 – cache-ul elimină întârzierile memoriei de program externe (și Capitol 1: cache-ul intern evită accesul la memoria externă mai lentă). c: Capitol 1 – arii de RAM/ROM interne pentru accelerarea transferului și reducerea transferurilor cu exteriorul; Capitol 5, 5.3 – memoria internă permite mai multe accesări pe ciclu, cea externă e lentă. a descrie o memorie de tip von Neumann; deși o memorie multiport ar permite acces multiplu, varianta pare distractorul. Nesigur pentru a.", "sigur": false, "figura": ""}, {"id": "c5-v51", "curs": 5, "tip": "vechi", "sursa": "SUBIECT POZA #5", "intrebare": "Spre deosebire de SRAM, memoriile DRAM au următoarele caracteristici:", "variante": ["sunt mai potrivite pentru aplicații cu volum mare de date", "au viteză de lucru mai mare", "mențin informațiile stocate cât timp sunt alimentate", "au un mecanism intern sau extern de reîmprospătare a memoriei"], "corecte": [0, 3], "explicatie": "Curs 5, 5.5 „Memoria dinamică” (slide 17): SRAM e mai rapidă (b fals) și reține datele cât e alimentată (c descrie SRAM); DRAM trebuie reîmprospătată periodic, cu un controler DRAM separat sau integrat pe chip (d). a: cursul spune că SRAM necesită suprafață mai mare și e mai scumpă pentru aceeași capacitate, deci DRAM e mai potrivită pentru capacități mari – deducție, nu afirmație explicită, de aici nesiguranța.", "sigur": false, "figura": ""}, {"id": "c5-v52", "curs": 5, "tip": "vechi", "sursa": "GRILE FINAL (GRILE.RTF) – „In Fig. 2, memoriile reprezentate sunt de tip”", "intrebare": "În figură (arhitectură Harvard cu memoria A și memoria B, ca în Fig. 5.4), memoriile reprezentate sunt de tip:", "variante": ["memoria A uni-port", "memoria B uni-port", "memoria A dublu-port", "(b) și (c)"], "corecte": [1, 2, 3], "explicatie": "În sursă apar doar răspunsurile („Memoria A dublu-port (c), Memoria B uni-port (b), (b) și (c)”), variantele sunt reconstruite. Curs 5, 5.1, slide 8 / Fig. 5.4: arhitectură Harvard cu o memorie de date cu două porturi (A) și o memorie de program cu un singur port (B) – două accesări la A și una la B pe ciclu, prin trei seturi de magistrale.", "sigur": true, "figura": ""}, {"id": "c5-v53", "curs": 5, "tip": "vechi", "sursa": "GRILE FINAL (GRILE.RTF) – „Memoria B este de tip”", "intrebare": "În arhitectura din figură (memorie de date A și memorie de program B, ca în Fig. 5.4), memoria B este de tip:", "variante": ["uni-port", "dublu-port", "cu patru porturi", "memorie cache pentru date"], "corecte": [0], "explicatie": "Variante reconstruite (sursa dă doar răspunsul „Uni-port”). Curs 5, slide 8: memoria de program B are un singur port; memoria de date A are două porturi.", "sigur": true, "figura": ""}, {"id": "c5-v54", "curs": 5, "tip": "vechi", "sursa": "GRILE FINAL (GRILE.RTF) – pag. 7, curs 5", "intrebare": "Memoria de capacitate mică din interiorul procesorului, folosită pentru memorarea instrucțiunilor, poartă numele de:", "variante": ["cache pentru program", "memorie ROM internă", "memorie dual-port de date", "linie de întârziere"], "corecte": [0], "explicatie": "Variante reconstruite (sursa dă doar răspunsul). Curs 5, 5.2 (slide 10): memoria cache pentru program este o memorie de capacitate mică în interiorul procesorului, folosită pentru memorarea instrucțiunilor.", "sigur": true, "figura": ""}, {"id": "c5-v55", "curs": 5, "tip": "vechi", "sursa": "GRILE FINAL (GRILE.RTF) – pag. 11, curs 5", "intrebare": "Față de memoria dinamică, memoria statică:", "variante": ["este mai ușor de folosit și mai rapidă", "necesită o suprafață mai mare pentru integrarea pe chip și este mai scumpă", "trebuie reîmprospătată periodic", "are interfețe mai simple"], "corecte": [0, 1, 3], "explicatie": "Variante reconstruite din lista de răspunsuri din sursă (mai ușor de folosit, mai rapidă, mai scumpă, suprafață mai mare, interfețe mai simple). Curs 5, 5.5 „Memoria dinamică” (slide 17): SRAM e mai ușor de folosit și mai rapidă decât DRAM, dar necesită suprafață mai mare și e mai scumpă; interfețele cu SRAM sunt mai simple. Reîmprospătarea periodică e specifică DRAM.", "sigur": true, "figura": ""}, {"id": "c5-v56", "curs": 5, "tip": "vechi", "sursa": "GRILE FINAL (GRILE.RTF)", "intrebare": "Interfețele cu memoria externă ale procesoarelor de semnal diferă prin:", "variante": ["numărul de porturi de memorie", "flexibilitatea și complexitatea interfeței", "constrângerile privitoare la timpii de acces", "a, b și c"], "corecte": [0, 1, 2, 3], "explicatie": "Curs 5, 5.5 (slide 14): interfețele diferă prin trei caracteristici principale: numărul de porturi de memorie, flexibilitatea și complexitatea interfeței și constrângerile privitoare la timpii de acces. Sursa dă ca răspuns „a, b și c”; la grila cu mai multe răspunsuri se bifează toate patru.", "sigur": true, "figura": ""}, {"id": "c5-v57", "curs": 5, "tip": "vechi", "sursa": "GRILE FINAL (GRILE.RTF)", "intrebare": "Arhitectura Harvard are:", "variante": ["memorie pentru instrucțiuni și memorie pentru date", "memorie pentru instrucțiuni și date și memorie numai pentru date", "un singur bloc de memorie pentru instrucțiuni și date, accesat printr-un singur set de magistrale", "primele 2 răspunsuri"], "corecte": [0, 1, 3], "explicatie": "Variante reconstruite; în sursă a doua variantă apare greșit („memorie pentru instrucțiuni și date și memorie pentru instrucțiuni”) și a fost corectată după curs. Curs 5, 5.1 (slide 7): Harvard standard – un bloc cu instrucțiunile, celălalt cu datele; varianta modificată de la DSP – un bloc cu instrucțiuni și date, celălalt numai cu date. c descrie arhitectura von Neumann. Nesigur din cauza textului reconstruit.", "sigur": false, "figura": ""}, {"id": "c5-v58", "curs": 5, "tip": "vechi", "sursa": "GRILE FINAL (GRILE.RTF) – „Organizarea memoriei din imagine”", "intrebare": "Organizarea memoriei din imagine (un singur bloc de memorie conectat la procesor printr-un singur set de magistrale de adrese și date) are structura de tip:", "variante": ["von Neumann", "Harvard", "Harvard modificată", "cu memorie multiport"], "corecte": [0], "explicatie": "Imaginea lipsește din sursă; răspunsul dat acolo este „Von Neumann”, deci figura e probabil Fig. 5.2 (slide 6). Curs 5, 5.1: structura cu un singur bloc, accesat printr-un singur set de magistrale de adrese și date, este arhitectura von Neumann. Nesigur pentru că figura nu se vede.", "sigur": false, "figura": ""}, {"id": "c5-v59", "curs": 5, "tip": "vechi", "sursa": "GRILE FINAL (GRILE.RTF)", "intrebare": "DMA este o tehnică cu ajutorul căreia datele pot fi transferate în și din memoria internă a procesorului:", "variante": ["fără intervenția acestuia", "numai prin instrucțiuni executate de procesor", "numai după pregătiri speciale în programul procesorului", "numai între două procesoare dintr-un sistem multiprocesor"], "corecte": [0], "explicatie": "Variante reconstruite (sursa dă doar „Fără ajutorul acestuia”). Curs 5, 5.5 (slide 18): DMA – datele sunt transferate în și din memoria internă a DSP fără intervenția acestuia; tehnică pur hardware, fără pregătiri în programe.", "sigur": true, "figura": ""}, {"id": "c5-v60", "curs": 5, "tip": "vechi", "sursa": "GRILE FINAL (GRILE.RTF)", "intrebare": "Memoria dinamică (DRAM) este mai rapidă decât memoria statică (SRAM).", "variante": ["Adevărat", "Fals"], "corecte": [1], "explicatie": "Curs 5, 5.5 (slide 17): memoria statică (SRAM) este mai ușor de folosit și mai rapidă decât memoria dinamică (DRAM). Întrebare Adevărat/Fals în sursă.", "sigur": true, "figura": ""}, {"id": "c5-v61", "curs": 5, "tip": "vechi", "sursa": "GRILE FINAL (GRILE.RTF)", "intrebare": "Procesoarele de semnal pot executa mai multe operații de citire sau de scriere din/în memorie într-un ciclu mașină.", "variante": ["Adevărat", "Fals"], "corecte": [0], "explicatie": "Capitol 5, introducere: „procesoarele de semnal pot executa mai multe operații de citire sau de scriere din/în memorie într-un ciclu-mașină” (ex. 4 accesări pentru MAC la FIR; Harvard, memorii rapide, multiport). Întrebare Adevărat/Fals în sursă.", "sigur": true, "figura": ""}, {"id": "c6-v62", "curs": 6, "tip": "vechi", "sursa": "psfinal Q2; PS_Grile (formular, nenumerotată); PS_Grile (1) (formular, nenumerotată); Grile_final – GRILE LINK-URI 6; Examen.pdf (Verificare 2, 17.01.2022) întrebarea 4 – bifat c, punctaj 3/3; v2_D.pdf (Lucrare de verificare 2, varianta D) întrebarea 5 – nemarcat (alte ordini ale variantelor)", "intrebare": "Din ce categorie de moduri de adresare face parte instrucțiunea „MUL a”, care are ca rezultat AX = AL * a, unde AX și AL sunt registrele procesorului folosite implicit pentru operația de înmulțire și „a” este o variabilă oarecare pe 8 biți?", "variante": ["adresare directă la memorie", "adresare implicită", "adresare imediată", "adresare directă la registru"], "corecte": [1], "explicatie": "Curs 6 / Capitol 6, 6.1: la adresarea implicită adresele operanzilor sunt indicate implicit de instrucțiune și nu pot fi schimbate (exemplul înmulțirii AT&T: X, Y → P). Enunțul subliniază că AX și AL sunt „folosite implicit” → adresare implicită. Nesigur doar pentru că „a” este o variabilă din memorie, ceea ce ar putea justifica și „directă la memorie” (o instrucțiune poate combina moduri). Răspunsul vizat de enunț este însă implicită; nu bifa imediată (a nu e constantă) și nici directă la registru (registrele nu pot fi alese).", "sigur": false, "figura": ""}, {"id": "c6-v63", "curs": 6, "tip": "vechi", "sursa": "psfinal Q3; PS_Grile (formular, apare de 2 ori); PS_Grile (1) (formular, apare de 2 ori); Grile_final Q31; Examen.pdf (Verificare 2, 17.01.2022) întrebarea 2 – bifat b, punctaj 3/3; subiect final 2024 1.pdf + subiect final 2024 2.jpg (Lucrare de verificare 2, varianta B) întrebarea 2 – încercuit „adresare indirectă cu registru” (a în acea variantă); v2_D.pdf (Lucrare de verificare 2, varianta D) întrebarea 3 – nemarcat", "intrebare": "Din ce categorie de moduri de adresare face parte instrucțiunea „A6 = A6 + *R6”, care are ca efect adunarea valorii stocate la locația de memorie indicată de conținutul registrului R6 la valoarea stocată în registrul acumulator A6?", "variante": ["adresare indirectă cu registru cu adresare modulo", "adresare indirectă cu registru", "adresare indirectă cu registru cu pre- sau post-incrementare", "adresare indirectă cu registru cu indexare"], "corecte": [1], "explicatie": "Curs 6 / Capitol 6, 6.5: exemplul „A0 = A0 + *R5” este dat exact ca adresare indirectă cu registru: „*R5” = conținutul locației indicate de R5. Fără ++/-- nu e pre/post-incrementare (6.6), fără al doilea registru/constantă nu e indexare (6.7), iar modulo (6.8) nu apare în instrucțiune.", "sigur": true, "figura": ""}, {"id": "c6-v64", "curs": 6, "tip": "vechi", "sursa": "psfinal Q9; PS_Grile (formular, apare de 2 ori); PS_Grile (1) (formular, apare de 2 ori); Grile_final Q33; Grile_final – GRILE LINK-URI 7; Examen.pdf (Verificare 2, 17.01.2022) întrebarea 6 – bifat b, punctaj 3/3; subiect final 2024 1.pdf + subiect final 2024 2.jpg (Lucrare de verificare 2, varianta B) întrebarea 4 – încercuit „adresare modulo” (d în acea variantă)", "intrebare": "Modul de adresare care folosește un buffer circular de tip FIFO este:", "variante": ["adresare indirectă cu registru cu adresare modulo", "adresare indirectă cu registru", "adresare indirectă cu registru cu pre- sau post-incrementare", "adresare indirectă cu registru cu indexare"], "corecte": [0], "explicatie": "Curs 6 / Capitol 6, 6.8: „Cea mai comună aplicație a acestui mod de adresare este implementarea unui buffer circular”; bufferele folosesc tehnica FIFO, iar capabilitatea se numește adresare modulo sau adresare circulară. Pointerii se actualizează tot prin pre/post-incrementare, dar modul cerut este cel modulo.", "sigur": true, "figura": ""}, {"id": "c6-v65", "curs": 6, "tip": "vechi", "sursa": "PS_Grile (formular, nenumerotată); PS_Grile (1) (formular, nenumerotată); Grile_final Q1", "intrebare": "La procesoarele care nu acceptă operația de inversare a biților implementată în unitatea de generare a adreselor, pentru generarea adreselor cu biții inversați este utilizată:", "variante": ["deplasarea", "comparația", "rotația", "instrucțiuni cu execuție condiționată"], "corecte": [2], "explicatie": "Cursul 6 (6.9) prezintă doar soluțiile hardware din AGU (bit în registrul de control la ADSP-210xx, aritmetica cu transport invers la DSP32C/DSP32xx) și nu spune ce se folosește când AGU nu o are. Răspunsul ține de setul de instrucțiuni (Curs 7): rotația e folosită la generarea adreselor cu biții inversați pe procesoarele fără suport în AGU. Nesigur pentru că textul Cursului 6 nu tranșează.", "sigur": false, "figura": ""}, {"id": "c6-v66", "curs": 6, "tip": "vechi", "sursa": "Grile_final – GRILE.RTF (fără variante, doar răspunsul; variantele sunt reconstituite)", "intrebare": "Instrucțiunea MOVE X:+(R0), A este de tip:", "variante": ["adresare indirectă cu registru cu pre-incrementare", "adresare indirectă cu registru cu post-incrementare", "adresare indirectă cu registru cu indexare", "adresare directă la memorie"], "corecte": [0], "explicatie": "Curs 6 / Capitol 6, 6.6: la Motorola DSP5600x, „MOVE X:-(R0), A1” e pre-decrementare (R0 modificat înainte de acces). Prin analogie, „+(R0)” cu semnul înaintea parantezei = pre-incrementare. Răspunsul din fișier e același; variantele au fost reconstituite.", "sigur": true, "figura": ""}, {"id": "c6-v67", "curs": 6, "tip": "vechi", "sursa": "Grile_final – GRILE.RTF (fără variante; variantele sunt reconstituite)", "intrebare": "Instrucțiunea AX1 = DM(1000) este de tip:", "variante": ["adresare directă la memorie", "adresare imediată", "adresare indirectă cu registru", "adresare directă la memorie paginată"], "corecte": [0], "explicatie": "Capitol 6, 6.4: „AX0 = DM(1000)” (ADSP-21xx) este exemplul de adresare directă la memorie (absolută): adresa 1000 e codată în instrucțiune. Nu e imediată, pentru că 1000 e adresă, nu valoare. Atenție: dacă apare și varianta „directă la registru”, ea se poate argumenta pentru destinația AX1.", "sigur": true, "figura": ""}, {"id": "c6-v68", "curs": 6, "tip": "vechi", "sursa": "Grile_final – GRILE.RTF (fără variante; variantele sunt reconstituite)", "intrebare": "Adresarea indirectă cu registru cu indexare poate avea forma:", "variante": ["MOVE Y1, X:(R5 + N6)", "A0 = A0 + *R5++R17", "MOVE #1234, A", "LDI *+AR1(2), R0"], "corecte": [0, 3], "explicatie": "Capitol 6, 6.7: „MOVE Y1, X:(R5 + N6)” (DSP5600x) este exemplul de indexare cu doi registri, iar „LDI *+AR1(2), R0” (TMS320C3x) este indexare cu valoare index imediată (folosită pentru argumentele din stivă). „*R5++R17” e post-incrementare cu offset (6.6), „MOVE #1234, A” e imediată (6.10). În fișier apare doar prima formă.", "sigur": true, "figura": ""}, {"id": "c6-v69", "curs": 6, "tip": "vechi", "sursa": "Grile_final – GRILE.RTF („A = A + R2*++”; enunț și variante reconstituite)", "intrebare": "Dacă R2 = 0x0000, după execuția instrucțiunii A = A + *R2++ registrul R2 devine:", "variante": ["0x0000", "0x0001", "0xFFFF", "0x0002"], "corecte": [1], "explicatie": "Capitol 6, 6.6: la „*R5++” registrul de adrese este incrementat cu unu după ce a fost folosit la accesare (post-incrementare). Nota din fișier: R2 = 0x0000 + 1 = 0x0001. Valoarea inițială a lui R2 vine din figura de laborator, care lipsește.", "sigur": true, "figura": ""}, {"id": "c6-v70", "curs": 6, "tip": "vechi", "sursa": "Grile_final – GRILE.RTF („A = A + *R6++R4, A = 5 → A = 8”; enunț și variante reconstituite)", "intrebare": "Dacă inițial A = 5 (memoria și registrele din figura de laborator), cât devine A după A = A + *R6++R4?", "variante": ["5", "8", "valoarea lui R4", "5 + R4"], "corecte": [1], "explicatie": "Capitol 6, 6.6 (*R5++R17): A primește A + conținutul locației de memorie indicate de R6 (adresa de dinainte de modificare), apoi R6 crește cu valoarea din R4. A nu crește cu R4. Răspunsul 8 e cel din fișier și presupune că la adresa din R6 se află 3; figura lipsește, deci nu se poate verifica.", "sigur": false, "figura": ""}, {"id": "c6-v71", "curs": 6, "tip": "vechi", "sursa": "Grile_final – GRILE.RTF („AX0 = DM(0X0002) → 1”; enunț și variante reconstituite)", "intrebare": "După execuția instrucțiunii AX0 = DM(0x0002) (memoria din figura de laborator), AX0 conține:", "variante": ["0x0002", "conținutul locației de memorie 0x0002 (în fișier: 1)", "adresa registrului AX0", "0"], "corecte": [1], "explicatie": "Capitol 6, 6.4: „AX0 = DM(1000)” încarcă în AX0 datele de la locația 1000 (adresare directă la memorie), nu valoarea 1000. Valoarea concretă (1) vine din figura care lipsește.", "sigur": false, "figura": ""}, {"id": "c6-v72", "curs": 6, "tip": "vechi", "sursa": "Grile_final – GRILE.RTF („AX0 = DM(0X102) → 110 = 6”; enunț și variante reconstituite)", "intrebare": "După execuția instrucțiunii AX0 = DM(0x102) (memoria din figura de laborator), AX0 conține:", "variante": ["0x102", "conținutul locației de memorie 0x102 (în fișier: 110b = 6)", "0x103", "conținutul registrului de adresă R2"], "corecte": [1], "explicatie": "Capitol 6, 6.4: adresare directă la memorie, deci în AX0 ajunge conținutul locației 0x102, nu adresa. Valoarea concretă (6) vine din figura care lipsește.", "sigur": false, "figura": ""}, {"id": "c6-v73", "curs": 6, "tip": "vechi", "sursa": "Grile_final – GRILE.RTF („A0 = A0 + R2*++R6”, typo pentru *R2++R6; variante reconstituite)", "intrebare": "Dacă R2 = 0x0103 și R6 = 0x00FB, în urma operației A0 = A0 + *R2++R6 valoarea registrului R2 devine:", "variante": ["0x0103", "0x01FE", "0x0104", "0x00FB"], "corecte": [1], "explicatie": "Capitol 6, 6.6: la „*R5++R17” registrul de adrese R5 este incrementat, după acces, cu valoarea din registrul offset R17. Aici R2 = 0x0103 + 0x00FB = 0x01FE (calculul din fișier). R2 crește cu R6, nu cu 1.", "sigur": true, "figura": ""}, {"id": "c6-v74", "curs": 6, "tip": "vechi", "sursa": "Grile_final – GRILE.RTF („A0 = A0 + *R7-- = 5 – 1 = 4”; enunț și variante reconstituite)", "intrebare": "Dacă valoarea inițială a lui A0 este 5, cât devine A0 în urma operației A0 = A0 + *R7-- (memoria din figura de laborator)?", "variante": ["4", "5", "5 + conținutul locației indicate de R7", "6"], "corecte": [2], "explicatie": "Capitol 6, 6.6: „A0 = A0 + *R5--” adună valoarea din locația indicată de R5 la A0, iar apoi DECREMENTEAZĂ R5, nu A0. Nota din fișier (5 – 1 = 4) pare să confunde decrementarea registrului de adrese cu o scădere din A0; 4 ar fi corect doar dacă la adresa din R7 s-ar afla −1. Fără figură, varianta sigură conceptual este „5 + conținutul locației indicate de R7”.", "sigur": false, "figura": ""}, {"id": "c6-v75", "curs": 6, "tip": "vechi", "sursa": "Grile_final – GRILE.RTF („Rezultatul operației 16 modul 5 este: 1”; variante reconstituite)", "intrebare": "Rezultatul operației 16 modulo 5 este:", "variante": ["1", "3", "0", "11"], "corecte": [0], "explicatie": "Capitol 6, 6.8: la aritmetica modulo rezultatul care depășește valoarea maximă e ajustat prin scăderea repetată a acesteia până intră în domeniu (14 modulo 12 = 2). 16 − 5 − 5 − 5 = 1.", "sigur": true, "figura":
