nou", "sursa": "nou", "intrebare": "Depășirea de scală (overflow) la procesoarele în virgulă fixă:", "variante": ["apare când suma depășește valoarea maximă care poate fi reprezentată în registrul acumulator", "face ca valoarea din acumulator să poată fi foarte îndepărtată de valoarea corectă", "poate apărea la transferul valorilor acumulate în memorie, dacă acumulatorul are biți de gardă", "poate apărea când un deplasator scalează valoarea acumulatorului pentru stocarea în memorie"], "corecte": [0, 1, 2, 3], "explicatie": "Curs 4 §4.1 Depășirea și saturația (a, b, c) și Capitol 4 (d: „depășirea poate să apară și dacă un deplasator este folosit pentru a scala valoarea acumulatorului în vederea stocării”).", "sigur": true, "figura": ""}, {"id": "c4-n181", "curs": 4, "tip": "nou", "sursa": "nou", "intrebare": "Modalitățile obișnuite de tratare a depășirii la procesoarele în virgulă fixă sunt:", "variante": ["scalarea cu grijă a tuturor rezultatelor calculelor", "aritmetica cu saturare", "rotunjirea convergentă", "setarea rezultatului la zero"], "corecte": [0, 1], "explicatie": "Curs 4 §4.1: „Există două modalități obișnuite de tratare a depășirii”: scalarea tuturor rezultatelor și aritmetica cu saturare. Rotunjirea reduce bias-ul, iar setarea la zero e acțiunea la underflow în virgulă mobilă.", "sigur": true, "figura": ""}, {"id": "c4-n182", "curs": 4, "tip": "nou", "sursa": "nou", "intrebare": "Aritmetica cu saturare:", "variante": ["folosește un circuit special care detectează apariția depășirii scalei", "înlocuiește valoarea eronată cu cel mai mare număr pozitiv sau cel mai mic număr negativ reprezentabil, după direcția depășirii", "furnizează întotdeauna rezultatul corect", "este implementată de o unitate hardware numită de unii producători limitator"], "corecte": [0, 1, 3], "explicatie": "Curs 4 §4.1 Depășirea și saturația; Capitol 4: rezultatul saturat este „desigur incorect”, dar eroarea e mai mică (c fals); unitatea = limitator.", "sigur": true, "figura": ""}, {"id": "c4-n183", "curs": 4, "tip": "nou", "sursa": "nou", "intrebare": "Trunchierea:", "variante": ["constă în descărcarea unui număr din cei mai puțin semnificativi biți ai reprezentării", "dă o valoare întotdeauna mai mare sau egală cu data originală", "introduce la semnale un deplasament (bias sau offset) sau o componentă continuă", "introduce un bias mai mic decât rotunjirea la valoarea cea mai apropiată"], "corecte": [0, 2], "explicatie": "Curs 4 §4.1 Trunchierea și rotunjirea: definiția (a) și bias-ul (c). Valoarea trunchiată e ≤ originala (b fals); bias-ul rotunjirii e mai mic decât al trunchierii (d fals).", "sigur": true, "figura": ""}, {"id": "c4-n184", "curs": 4, "tip": "nou", "sursa": "nou", "intrebare": "Rotunjirea la valoarea cea mai apropiată:", "variante": ["rotunjește întotdeauna la valoarea mai mare numerele aflate exact la mijloc între două valori consecutive", "se implementează adunând jumătate din valoarea LSB-ului cuvântului de ieșire și apoi trunchiind", "nu introduce niciun bias", "este tipul de rotunjire folosit de majoritatea procesoarelor DSP cu virgulă fixă"], "corecte": [0, 1, 3], "explicatie": "Curs 4 §4.1 și Capitol 4: a, b, d sunt citate. Introduce o asimetrie, deci un bias (mai mic decât al trunchierii), care poate crea probleme la filtrele IIR și adaptive (c fals).", "sigur": true, "figura": ""}, {"id": "c4-n185", "curs": 4, "tip": "nou", "sursa": "nou", "intrebare": "Rotunjirea convergentă:", "variante": ["reduce bias-ul care apare la rotunjirea la valoarea cea mai apropiată", "pentru numerele aflate exact la mijloc, direcția depinde de bitul care va deveni LSB al ieșirii: 0 → în jos, 1 → în sus", "are suport hardware la majoritatea procesoarelor DSP cu virgulă fixă", "este efectuată de familiile ADSP-21xx și DSP5600x"], "corecte": [0, 1, 3], "explicatie": "Curs 4 §4.1 și Capitol 4: a, b, d. Capitol 4: „mecanismul de rotunjire convergentă nu are suport hardware pentru majoritatea procesoarelor DSP cu virgulă fixă” (c fals).", "sigur": true, "figura": ""}, {"id": "c4-n186", "curs": 4, "tip": "nou", "sursa": "nou", "intrebare": "Aplicând rotunjirea convergentă și păstrând 4 biți, valoarea 01111000 devine:", "variante": ["0111", "1000", "0110", "1001"], "corecte": [1], "explicatie": "Se păstrează 0111, partea eliminată 1000 e exact jumătate; bitul care devine LSB e 1 → rotunjire în sus: 0111 + 1 = 1000 (Curs 4 §4.1 Trunchierea și rotunjirea).", "sigur": true, "figura": ""}, {"id": "c4-n187", "curs": 4, "tip": "nou", "sursa": "nou", "intrebare": "Operanzii la procesoarele DSP cu virgulă fixă:", "variante": ["sunt obținuți, în majoritatea procesoarelor, de la un mic număr de regiștri operand sau de la acumulator", "sunt aduși din memorie în regiștrii operand printr-o arhitectură de tip Von Neumann", "un procesor care prelucrează datele numai din regiștrii operand are arhitectură „load-store”", "regiștrii operand sunt accesați prin adresare indirectă cu registru"], "corecte": [0, 2], "explicatie": "Curs 4 §4.1 Operanzii și regiștrii operand: a, c; datele se aduc cu instrucțiuni „move”, iar regiștrii operand se accesează prin adresare directă la registru (register-direct), nu indirectă (d fals).", "sigur": true, "figura": ""}, {"id": "c4-n188", "curs": 4, "tip": "nou", "sursa": "nou", "intrebare": "Despre calea de date la procesoarele DSP cu virgulă mobilă, sunt adevărate:", "variante": ["la majoritatea, calea principală face calcule și în virgulă mobilă și în virgulă fixă, dar un singur tip de operație într-un ciclu", "unele procesoare au două căi de date: una pentru virgulă mobilă și una pentru virgulă fixă", "procesoarele cu căi de date separate au multiplicator pe calea pentru virgulă fixă", "calea pentru virgulă fixă, când există separat, are mai puține facilități"], "corecte": [0, 1, 3], "explicatie": "Capitol 4 §4.2 (introducere): a, b, d. „Procesoarele care au căi de date diferite pentru virgulă mobilă și virgulă fixă nu posedă multiplicator pe calea de date pentru operații în virgulă fixă” (c fals).", "sigur": true, "figura": ""}, {"id": "c4-n189", "curs": 4, "tip": "nou", "sursa": "nou", "intrebare": "Multiplicatoarele procesoarelor DSP cu virgulă mobilă:", "variante": ["acceptă doi operanzi cu virgulă mobilă de mărime nativă, de obicei 32 biți", "produc la ieșire un cuvânt suficient de mare pentru a evita pierderea preciziei", "pentru mantise de intrare de 24 biți ar avea nevoie de o mantisă de 48 biți la ieșire", "au formatul de ieșire în general ceva mai lung decât cel de intrare, cu 8 sau 12 biți în plus pentru mantisă"], "corecte": [0, 2, 3], "explicatie": "Curs 4 §4.2 Multiplicatorul: spre deosebire de virgula fixă, multiplicatoarele în virgulă mobilă NU produc un cuvânt suficient de mare (b fals); restul sunt citate din curs.", "sigur": true, "figura": ""}, {"id": "c4-n190", "curs": 4, "tip": "nou", "sursa": "nou", "intrebare": "Unitatea ALU a procesorului DSP cu virgulă mobilă execută:", "variante": ["adunări și scăderi", "calculul valorii absolute, negări, calculul valorii minime și/sau maxime", "operațiile logice pe bit ȘI, SAU, NEGARE asupra datelor în virgulă mobilă", "înmulțirea operanzilor"], "corecte": [0, 1], "explicatie": "Curs 4 §4.2 UAL: operații simple (a, b). Operațiile logice pe bit nu sunt semnificative pentru date în virgulă mobilă și în general nu sunt executate de ALU numai pentru virgulă mobilă (c fals); înmulțirea o face multiplicatorul (d fals).", "sigur": true, "figura": ""}, {"id": "c4-n191", "curs": 4, "tip": "nou", "sursa": "nou", "intrebare": "Operația de multiplicare-adunare:", "variante": ["diferă de multiplicare-acumulare prin faptul că rezultatul este scris într-un acumulator diferit de cel care furnizează data adunată cu produsul", "scrie rezultatul în același acumulator care furnizează data adunată", "este executată de unele procesoare, de exemplu DSP32C (AT&T)", "nu folosește multiplicatorul"], "corecte": [0, 2], "explicatie": "Curs 4 §4.2 UAL și Capitol 4: definiția (a) și exemplul DSP32C (c). Varianta b descrie multiplicarea-acumularea.", "sigur": true, "figura": ""}, {"id": "c4-n192", "curs": 4, "tip": "nou", "sursa": "nou", "intrebare": "La aritmetica în virgulă mobilă, excepțiile:", "variante": ["sunt situații neobișnuite care pot cauza rezultate aritmetice eronate (ex. depășirea de scală)", "sunt semnalizate prin setarea unui bit într-un registru de stare", "pot genera, opțional la unele procesoare, o întrerupere care lansează o rutină de tratare furnizată de programator", "sunt mai grave decât la virgulă fixă, din cauza gamei dinamice mai mici"], "corecte": [0, 1, 2], "explicatie": "Curs 4 §4.2 Overflow, underflow și alte excepții: a, b, c. Depășirea e MAI PUȚIN gravă în virgulă mobilă datorită gamei dinamice mai mari (d fals).", "sigur": true, "figura": ""}, {"id": "c4-n193", "curs": 4, "tip": "nou", "sursa": "nou", "intrebare": "La majoritatea procesoarelor DSP cu virgulă mobilă, la apariția depășirii (overflow):", "variante": ["se setează un bit de stare", "rezultatul este limitat automat la cea mai pozitivă sau cea mai negativă valoare reprezentabilă", "rezultatul este setat la zero", "procesorul se oprește din execuție"], "corecte": [0, 1], "explicatie": "Curs 4 §4.2: bit de stare și limitare automată a rezultatului. Setarea la zero (c) este acțiunea la underflow.", "sigur": true, "figura": ""}, {"id": "c4-n194", "curs": 4, "tip": "nou", "sursa": "nou", "intrebare": "Underflow-ul:", "variante": ["apare când rezultatul unei operații aritmetice este prea mic pentru a fi reprezentat", "se poate produce, de exemplu, la înmulțirea a două numere subunitare mici", "este tratat la multe procesoare prin setarea rezultatului la zero și setarea unui bit într-un registru de stare", "apare la împărțirea la zero"], "corecte": [0, 1, 2], "explicatie": "Curs 4 §4.2: a, b, c sunt citate. Împărțirea la zero e o altă excepție, semnalată la procesoarele cu operația „reciprocal seed” (d fals).", "sigur": true, "figura": ""}, {"id": "c4-n195", "curs": 4, "tip": "nou", "sursa": "nou", "intrebare": "Rotunjirea la procesoarele DSP cu virgulă mobilă:", "variante": ["rezultatele sunt rotunjite automat la un format intermediar de 40÷44 biți, folosit în interiorul căii de date", "la transferul în memorie, datele pot fi scrise în precizie extinsă sau rotunjite la formatul nativ, în general 32 biți", "majoritatea procesoarelor asigură rotunjirea la cel mai apropiat", "DSP96002 (Motorola) asigură toate modurile IEEE 754: convergentă, către +∞, către zero și către −∞"], "corecte": [0, 1, 2, 3], "explicatie": "Curs 4 §4.2 Rotunjirea și Capitol 4: toate afirmațiile sunt din curs.", "sigur": true, "figura": ""}, {"id": "c4-n196", "curs": 4, "tip": "nou", "sursa": "nou", "intrebare": "Deplasatorul la procesoarele DSP cu virgulă mobilă:", "variante": ["execută scalarea automată a rezultatelor pentru a conserva maximul de precizie", "scalarea automată prin hardware este principalul avantaj al aritmeticii în virgulă mobilă", "este explicit controlat de programator la operațiile în virgulă mobilă", "la procesoarele cu o singură cale de date pentru ambele aritmetici poate fi controlat explicit pentru datele în virgulă fixă"], "corecte": [0, 1, 3], "explicatie": "Curs 4 §4.2 Deplasatorul: în virgulă mobilă deplasatorul fie nu este vizibil, fie nu este explicit controlabil de programator (c fals); restul sunt citate.", "sigur": true, "figura": ""}, {"id": "c4-n197", "curs": 4, "tip": "nou", "sursa": "nou", "intrebare": "Regiștrii și operanzii la procesoarele DSP cu virgulă mobilă:", "variante": ["au în general regiștri mai mulți și de capacitate mai mare decât procesoarele cu virgulă fixă", "TMS320C3x are opt regiștri pe 40 biți și opt pe 32 biți care pot primi rezultatele operațiilor aritmetice", "operanzii provin de la regiștri operand sau acumulatoare, accesați prin adresare directă la registru", "câteva procesoare (DSP32xx) transferă operanzi pe calea de date direct din memorie, prin adresare indirectă cu registru"], "corecte": [0, 1, 2, 3], "explicatie": "Curs 4 §4.2 Regiștrii acumulator și Operanzii și regiștrii operand; exemplele din Capitol 4.", "sigur": true, "figura": ""}, {"id": "c5-n198", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Pentru fiecare instrucțiune de multiplicare-adunare dintr-un filtru RFI, procesorul trebuie să execute într-un ciclu de tact următoarele accesări ale memoriei:", "variante": ["citirea codului instrucțiunii de multiplicare-adunare (fetch)", "citirea valorii eșantionului corespunzător din linia de întârziere", "citirea valorii corespunzătoare a coeficientului filtrului", "scrierea eșantionului în următoarea locație a liniei de întârziere"], "corecte": [0, 1, 2, 3], "explicatie": "Capitol 5, introducere (Curs 5, slide 5): patru accesări pe ciclu – fetch, citirea eșantionului, citirea coeficientului și scrierea eșantionului pentru deplasarea datelor în linia de întârziere.", "sigur": true, "figura": ""}, {"id": "c5-n199", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Arhitectura von Neumann se caracterizează prin:", "variante": ["un singur bloc de memorie care conține atât instrucțiunile programului cât și datele", "accesarea memoriei printr-un singur set de magistrale de adrese și date", "două blocuri independente de memorie conectate prin două magistrale separate", "este întâlnită la multe tipuri de procesoare de uz general"], "corecte": [0, 1, 3], "explicatie": "Curs 5, 5.1 (slide 6): cea mai simplă structură, un singur bloc accesat printr-un singur set de magistrale, cu instrucțiuni și date; întâlnită la multe procesoare de uz general. c descrie arhitectura Harvard.", "sigur": true, "figura": ""}, {"id": "c5-n200", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Pe o mașină cu arhitectură von Neumann (un acces la memorie pe ciclu-mașină), operația de multiplicare-adunare dintr-un filtru FIR necesită:", "variante": ["un ciclu cu memoria", "două cicluri cu memoria", "trei cicluri cu memoria", "patru cicluri cu memoria"], "corecte": [3], "explicatie": "Capitol 5, 5.1: chiar dacă MAC s-ar face într-un ciclu, sunt necesare patru cicluri cu memoria, deoarece cele patru accesări se execută secvențial – motiv pentru care von Neumann nu e eficientă pentru DSP.", "sigur": true, "figura": ""}, {"id": "c5-n201", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Varianta modificată a arhitecturii Harvard folosită la procesoarele de semnal presupune:", "variante": ["un bloc de memorie conține instrucțiunile programului și date, iar celălalt conține numai date", "ambele blocuri de memorie conțin numai instrucțiuni", "datele pot fi mutate între cele două blocuri de memorie", "un singur set de magistrale pentru ambele blocuri"], "corecte": [0, 2], "explicatie": "Curs 5, 5.1 (slide 7) și Capitol 5: în varianta modificată un bloc are program și date, celălalt numai date; datele pot fi mutate între blocuri, lucru imposibil la Harvard standard. Blocurile au magistrale separate.", "sigur": true, "figura": ""}, {"id": "c5-n202", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Avantajul principal al arhitecturii Harvard permite ca cele patru accesări ale memoriei necesare filtrului RFI să fie executate în:", "variante": ["un ciclu-mașină", "două cicluri-mașină", "trei cicluri-mașină", "patru cicluri-mașină"], "corecte": [1], "explicatie": "Capitol 5, 5.1: avantajul principal al arhitecturii Harvard este că pot fi efectuate două accesări ale memoriei într-un ciclu-mașină, deci cele patru operații ale FIR se fac în două cicluri-mașină.", "sigur": true, "figura": ""}, {"id": "c5-n203", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Arhitectura Harvard modificată cu trei blocuri de memorie (de exemplu nucleele PineDSPCore și OakDSPCore):", "variante": ["conține un bloc de memorie de program și două blocuri de memorie de date, X și Y", "permite trei accesări independente ale memoriei într-un ciclu-mașină", "fiecare bloc este accesat cu setul lui propriu de magistrale", "este folosită de familia ADSP-21xx (Analog Devices)"], "corecte": [0, 1, 2], "explicatie": "Capitol 5, 5.1: trei blocuri (program, X, Y), fiecare cu setul ei de magistrale → o citire a instrucțiunii și câte un acces la X și Y pe ciclu (și la DSP5600x, DSP563xx, DSP96002, Z839xx, D950-CORE). ADSP-21xx este dat ca exemplu de Harvard cu două blocuri.", "sigur": true, "figura": ""}, {"id": "c5-n204", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Pe lângă arhitectura Harvard, alte soluții care permit mai multe accesări ale memoriei într-un ciclu-mașină sunt:", "variante": ["folosirea de memorii rapide care permit mai multe accesări secvențiale pe ciclu-mașină, printr-un singur set de magistrale", "utilizarea de memorii multiport care permit mai multe accesări concurente prin două sau mai multe seturi de magistrale", "folosirea memoriilor DRAM paginate", "introducerea de stări de așteptare programate"], "corecte": [0, 1], "explicatie": "Curs 5, 5.1 „Memoriile cu acces multiplu” (slide 8): cele două soluții sunt memoriile rapide (accesări secvențiale, un set de bus-uri) și memoriile multiport (accesări concurente, mai multe seturi). Stările de așteptare încetinesc accesul; DRAM paginată ține de interfața externă.", "sigur": true, "figura": ""}, {"id": "c5-n205", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Într-o arhitectură Harvard modificată cu două blocuri de memorie rapidă, dacă datele nu sunt ordonate (un bloc necesită trei accesări, iar celălalt una):", "variante": ["se obțin rezultate eronate", "procesorul prelungește automat execuția instrucțiunii pentru a finaliza accesarea memoriei", "crește timpul de execuție a programului", "se generează o întrerupere de cod ilegal"], "corecte": [1, 2], "explicatie": "Capitol 5, 5.1: procesorul prelungește automat execuția instrucțiunii; o ordonare suboptimă nu produce rezultate eronate, ci doar o creștere a timpului de execuție.", "sigur": true, "figura": ""}, {"id": "c5-n206", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Memoriile multi-port:", "variante": ["au mai multe seturi de bus-uri de adrese și de date, permițând mai multe accesări în paralel", "cele mai folosite sunt memoriile dual-port, care permit două accesări simultane", "elimină necesitatea ordonării datelor în mai multe blocuri independente de memorie", "au ca dezavantaj principal viteza mai mică decât a memoriilor uni-port"], "corecte": [0, 1, 2], "explicatie": "Capitol 5, 5.1: memoria multiport are mai multe seturi de bus-uri; cele mai folosite sunt dual-port (mai rar 3 sau 4 porturi); elimină necesitatea ordonării datelor în blocuri. Dezavantajul principal este folosirea unei arii mari de pe suprafața chip-ului, nu viteza.", "sigur": true, "figura": ""}, {"id": "c5-n207", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "O arhitectură Harvard cu o memorie de date cu două porturi (A) și o memorie de program cu un singur port (B):", "variante": ["permite într-un ciclu-mașină două accesări la memoria A și o accesare la memoria B", "folosește trei seturi independente de magistrale", "este folosită de procesoarele DSP561xx (Motorola)", "permite două accesări la memoria de program într-un ciclu-mașină"], "corecte": [0, 1, 2], "explicatie": "Curs 5, slide 8 și Capitol 5, Fig. 5.4: nucleul poate efectua simultan două accesări la bancul A și una la bancul B, prin trei seturi independente de magistrale; configurația e folosită de DSP561xx. Memoria de program e uni-port, deci un singur acces.", "sigur": true, "figura": ""}, {"id": "c5-n208", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Operațiile specializate de scriere în memorie oferite de unele procesoare de semnal:", "variante": ["permit ca scrierea în memoria de date să fie executată în paralel cu o citire din aceasta și cu o citire din memoria de program", "se realizează cu instrucțiuni speciale, dar cu anumite circumstanțe restrictive", "pot fi folosite pentru deplasarea datelor în lungul liniei de întârziere a filtrului RFI", "pot fi folosite cu orice instrucțiune, fără nicio restricție"], "corecte": [0, 1, 2], "explicatie": "Curs 5, 5.1 (slide 9): scrierea în paralel cu o citire din memoria de date și o citire din memoria de program, prin instrucțiuni speciale, cu circumstanțe restrictive; folosite la deplasarea datelor în linia de întârziere RFI.", "sigur": true, "figura": ""}, {"id": "c5-n209", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Procesoarele de semnal au în general un singur set de magistrale pentru extinderea memoriei în afara chip-ului deoarece:", "variante": ["extinderea magistralelor de accesare a memoriei în afara chip-ului este o soluție costisitoare", "bus-urile care se extind în afara chip-ului necesită un număr mare de pini", "memoria externă nu poate fi extinsă pentru mai multe blocuri interne", "accesul la memoria externă este întotdeauna mai rapid decât la cea internă"], "corecte": [0, 1], "explicatie": "Capitol 5, 5.1 și 5.5: extinderea magistralelor în afara chip-ului e costisitoare (crește complexitatea capsulei), iar bus-urile externe cer mulți pini → cost mai mare. Portul extern poate extinde oricare bloc intern; memoria externă e mai lentă.", "sigur": true, "figura": ""}, {"id": "c5-n210", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Memoria cache pentru program a procesoarelor de semnal:", "variante": ["este o memorie de capacitate mică în interiorul procesorului, folosită pentru memorarea instrucțiunilor", "elimină necesitatea accesării blocului de memorie de program de câte ori este executată o instrucțiune", "este folosită atât pentru instrucțiuni cât și pentru date", "este în general mai mică și mai simplă decât memoria cache internă a procesoarelor de uz general"], "corecte": [0, 1, 3], "explicatie": "Curs 5, 5.2 (slide 10) și Capitol 5: cache-ul pentru program memorează instrucțiunile, eliminând accesările memoriei de program; e mai mic și mai simplu decât la procesoarele de uz general. Capitol 5: cache-ul DSP este folosit doar pentru instrucțiuni (un cache de date ar cere coerență).", "sigur": true, "figura": ""}, {"id": "c5-n211", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Metodele de reducere a numărului de accesări ale memoriei prezentate în curs sunt:", "variante": ["memoria cache pentru program", "adresarea modulo n", "abordările bazate pe algoritmi", "introducerea stărilor de așteptare"], "corecte": [0, 1, 2], "explicatie": "Curs 5 / Capitol 5, 5.2: cache-ul pentru program, adresarea modulo n și abordările bazate pe algoritmi. Stările de așteptare (5.3) nu reduc numărul de accesări, ci întârzie execuția.", "sigur": true, "figura": ""}, {"id": "c5-n212", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Adresarea modulo n:", "variante": ["permite implementarea unei linii de întârziere fără ca datele să fie mutate efectiv în memorie", "simulează deplasarea datelor prin modificarea pointerilor de accesare folosind aritmetica modulo n", "realizează deplasarea prin mutarea fiecărui eșantion în locația următoare", "reduce numărul de accesări la memorie ale filtrului RFI de la patru la două pe ciclu-mașină"], "corecte": [0, 1], "explicatie": "Curs 5, 5.2 (slide 11): datele rămân în aceeași locație, iar deplasarea e simulată prin modificarea pointerilor cu aritmetica modulo n; la RFI reduce accesările de la patru la TREI pe ciclu-mașină.", "sigur": true, "figura": ""}, {"id": "c5-n213", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Despre abordările bazate pe algoritmi pentru reducerea numărului de accesări ale memoriei sunt adevărate afirmațiile:", "variante": ["nu sunt o caracteristică a procesoarelor de semnal", "folosesc algoritmi care exploatează modul de aranjare a datelor", "algoritmii care operează pe blocuri de date citesc de multe ori aceleași date în mod repetat", "un programator bun poate reutiliza date deja citite pentru a reduce numărul de accesări"], "corecte": [0, 1, 2, 3], "explicatie": "Capitol 5, 5.2 „Abordări bazate pe algoritmi”: deși nu e o caracteristică a procesoarelor, folosirea algoritmilor care exploatează aranjarea datelor reduce accesările; algoritmii pe blocuri citesc repetat aceleași date, iar programatorul poate reutiliza datele deja citite.", "sigur": true, "figura": ""}, {"id": "c5-n214", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Stările de așteptare (wait states):", "variante": ["sunt stări în care procesorul nu poate continua execuția programului deoarece așteaptă finalizarea unei activități începute", "sunt moduri de consum redus în care ceasul este oprit", "pot fi programate în timpul accesului la memoria externă lentă", "apar atunci când se folosește o memorie dual-port pentru două accesări simultane"], "corecte": [0, 2], "explicatie": "Curs 5, 5.3 (slide 12): definiția stărilor de așteptare și stările programate la accesul memoriei externe prea lente. Memoria dual-port suportă tocmai două accesări simultane, deci nu produce conflicte; modurile de consum redus țin de alt capitol.", "sigur": true, "figura": ""}, {"id": "c5-n215", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Stările de așteptare datorate conflictelor la accesarea resurselor apar:", "variante": ["când procesorul încearcă să realizeze mai multe accesări simultane ale unei memorii care nu suportă acces multiplu", "de exemplu, când un bloc de memorie uni-port conține atât instrucțiuni cât și date", "când o instrucțiune nu poate accesa un bloc de memorie deoarece instrucțiuni alăturate (în pipeline) îl accesează", "numai la procesoarele cu arhitectură Harvard cu memorii multiport"], "corecte": [0, 1, 2], "explicatie": "Capitol 5, 5.3: conflictele apar la accesări simultane ale unei memorii fără acces multiplu (ex. bloc uni-port cu instrucțiuni și date) și, din cauza pipeline-ului, când instrucțiuni alăturate accesează același bloc.", "sigur": true, "figura": ""}, {"id": "c5-n216", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Stările de așteptare programate:", "variante": ["sunt introduse de procesor în timpul accesului la memoria externă, prea lentă pentru mai multe accesări pe ciclu", "sunt configurate de programator pentru a încetini deliberat accesul și a respecta timpii de acces ai memoriilor lente", "la unele procesoare pot avea un număr diferit pentru regiuni diferite ale memoriei externe, permițând combinații de memorie rapidă și lentă", "au o durată cuprinsă între un sfert de ciclu-mașină și un ciclu-mașină, în funcție de procesor"], "corecte": [0, 1, 2, 3], "explicatie": "Capitol 5, 5.3: toate cele patru afirmații apar în text (durata: un sfert de ciclu la DSP32C, AT&T, un ciclu la majoritatea procesoarelor).", "sigur": true, "figura": ""}, {"id": "c5-n217", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Durata cea mai scurtă a unei stări de așteptare, menționată în curs pentru procesorul DSP32C (AT&T), este de:", "variante": ["un sfert de ciclu-mașină", "o jumătate de ciclu-mașină", "un ciclu-mașină", "două cicluri-mașină"], "corecte": [0], "explicatie": "Capitol 5, 5.3: stările de așteptare au durate între un sfert de ciclu-mașină (DSP32C, AT&T) și un ciclu-mașină (majoritatea procesoarelor); cele mai scurte permit operare mai eficientă.", "sigur": true, "figura": ""}, {"id": "c5-n218", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Referitor la memoria ROM a procesoarelor de semnal, sunt adevărate afirmațiile:", "variante": ["procesoarele destinate aplicațiilor ieftine (electronică de uz general, telecomunicații) au o memorie ROM internă pentru programe și constante", "versiunea cu memorie RAM internă este destinată prototipurilor și producției de volum scăzut", "versiunea cu ROM programabil la fabricarea circuitului este destinată prototipurilor", "unele procesoare citesc instrucțiunile din ROM pe octeți și le refac intern prin concatenare"], "corecte": [0, 1, 3], "explicatie": "Curs 5, 5.4 (slide 13): ROM intern la aplicațiile ieftine; RAM intern pentru prototipuri și volum scăzut; ROM programat la fabricare pentru producție de VOLUM MARE (c fals); citirea pe octeți și concatenarea internă.", "sigur": true, "figura": ""}, {"id": "c5-n219", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Majoritatea procesoarelor de semnal oferă pentru memoria externă:", "variante": ["un singur port extern, format dintr-o magistrală de adrese, una de date și un set de semnale de control", "un singur port extern chiar dacă au mai multe blocuri de memorie independente pe chip", "câte un port extern pentru fiecare bloc de memorie internă", "posibilitatea accesului multiplu la memoria externă într-un singur ciclu-mașină"], "corecte": [0, 1], "explicatie": "Curs 5, 5.5 (slide 14) și Capitol 5: cele mai multe DSP au un singur port extern, chiar dacă au mai multe blocuri interne; lipsa mai multor porturi externe face ca accesul multiplu la memoria externă într-un ciclu să nu fie posibil.", "sigur": true, "figura": ""}, {"id": "c5-n220", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Dintre procesoarele de mai jos, au mai multe porturi pentru memoria externă:", "variante": ["ADSP-21020 (Analog Devices)", "TMS320C30 (TI)", "TMS320C40 (TI)", "DSP96002 (Motorola)"], "corecte": [0, 1, 2, 3], "explicatie": "Capitol 5, 5.5: ADSP-21020 (port de program și port de date), TMS320C30 (două porturi), TMS320C40 (două porturi identice), DSP96002 (două porturi identice); sunt mai scumpe decât procesoarele cu un singur port.", "sigur": true, "figura": ""}, {"id": "c5-n221", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Posibilitatea de a lucra cu memorie cache manual înseamnă:", "variante": ["copierea unei secțiuni de cod din memoria lentă sau mai folosită într-o memorie mai rapidă sau mai puțin accesată", "poate fi folosită chiar dacă procesorul nu conține o zonă de memorie cache specializată", "copierea, de exemplu, a unei secțiuni de cod din ROM extern lent în RAM intern, la pornire sau la prima accesare", "transferul automat al instrucțiunilor în cache de către logica de comandă, transparent pentru programator"], "corecte": [0, 1, 2], "explicatie": "Curs 5, 5.5 (slide 15): programatorul mărește performanța copiind cod din memoria lentă/mai folosită într-una mai rapidă/mai puțin accesată, chiar fără cache specializat (ex. ROM extern → RAM intern). Copierea e făcută de programator, nu automat.", "sigur": true, "figura": ""}, {"id": "c5-n222", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Procesoarele de semnal proiectate pentru sisteme multiprocesor oferă pentru interfața cu memoria externă:", "variante": ["două porturi pentru memoria externă: unul pentru o memorie locală și unul pentru o memorie partajată cu alte procesoare", "un mecanism de arbitrare a magistralei, prin care procesoarele negociază controlul acesteia", "posibilitatea ca procesoarele care nu dețin controlul magistralei să transfere date pe aceasta", "blocarea bus-ului (operația test-and-set) pentru variabilele partajate"], "corecte": [0, 1, 3], "explicatie": "Curs 5, 5.5 (slide 16) și Capitol 5: două porturi externe (local + partajat, ex. DSP96002), arbitrarea magistralei care ÎMPIEDICĂ procesoarele fără control să transfere date, și blocarea bus-ului (test-and-set).", "sigur": true, "figura": ""}, {"id": "c5-n223", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Deosebirea principală dintre memoria statică (SRAM) și memoria dinamică (DRAM) este:", "variante": ["memoria statică reține datele atâta timp cât este alimentată", "memoria dinamică trebuie să fie periodic reîmprospătată", "memoria statică trebuie rescrisă la fiecare câteva fracțiuni de secundă", "memoria dinamică este mai ușor de folosit și mai rapidă"], "corecte": [0, 1], "explicatie": "Curs 5, 5.5 „Memoria dinamică” (slide 17): SRAM reține datele cât timp e alimentată, DRAM trebuie reîmprospătată periodic (rescriere la fiecare câteva fracțiuni de secundă). SRAM este cea mai ușor de folosit și mai rapidă.", "sigur": true, "figura": ""}, {"id": "c5-n224", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Folosirea memoriei DRAM ca memorie externă pentru procesoarele de semnal:", "variante": ["presupune de regulă un controler de DRAM separat care generează semnalele de control", "poate fi îmbunătățită prin memorii paginate sau cu coloane statice, cu acces rapid la accesarea repetată a aceleiași pagini", "este simplificată la unele procesoare care integrează controlerul DRAM pe chip (ex. DSP56004, DSP56007)", "are o interfață mai simplă decât memoria statică"], "corecte": [0, 1, 2], "explicatie": "Capitol 5, 5.5 „Memoria dinamică”: controler DRAM separat (cost suplimentar), DRAM paginate/cu coloane statice, controlere integrate la DSP56004/DSP56007. Interfețele cu memoria statică sunt mai simple, nu cele cu DRAM.", "sigur": true, "figura": ""}, {"id": "c5-n225", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Accesul direct la memorie (DMA):", "variante": ["este o tehnică prin care datele sunt transferate în și din memoria internă a procesorului fără intervenția acestuia", "constituie un tip aparte de întrerupere, fiind o tehnică pur hardware", "presupune pregătiri speciale în programele procesorului pentru fiecare transfer", "folosește un controler DMA care poate fi pe același chip cu procesorul sau extern acestuia"], "corecte": [0, 1, 3], "explicatie": "Curs 5, 5.5 (slide 18): DMA transferă date fără intervenția procesorului, este un tip aparte de întrerupere, tehnică pur hardware care NU presupune niciun fel de pregătiri în programe; controlerul DMA poate fi periferic pe chip sau extern.", "sigur": true, "figura": ""}, {"id": "c5-n226", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Pentru un transfer cu un controler DMA extern, procesorul transmite controlerului informații de control care conțin:", "variante": ["adresa de start a datelor în memorie", "numărul de locații care trebuie transferate", "direcția de transfer", "dispozitivul sursă sau destinație"], "corecte": [0, 1, 2, 3], "explicatie": "Capitol 5, 5.5 DMA: procesorul transmite adresa de start, numărul de locații, direcția de transfer și dispozitivul sursă sau destinație; apoi controlerul cere bus-ul, iar procesorul cedează controlul după instrucțiunea curentă.", "sigur": true, "figura": ""}, {"id": "c5-n227", "curs": 5, "tip": "nou", "sursa": "nou", "intrebare": "Controlerul DMA integrat al procesorului ADSP-2106x are:", "variante": ["două canale", "șase canale", "zece canale", "un singur canal"], "corecte": [2], "explicatie": "Capitol 5, 5.5 DMA: TMS320C4x – șase canale, ADSP-2106x – zece canale, DSP96002 – două canale; fiecare canal are propriul set de registre.", "sigur": true, "figura": ""}, {"id": "c6-n228", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Care din afirmațiile următoare referitoare la adresarea datelor sunt adevărate?", "variante": ["prin adresare se înțeleg mijloacele prin care sunt specificate locațiile operanzilor", "modul de adresare a datelor este indicat fie explicit în codul instrucțiunii, fie este implicit", "o instrucțiune poate combina două sau mai multe moduri de adresare, folosind moduri diferite pentru operanzi diferiți", "toate procesoarele DSP pun la dispoziție toate modurile de adresare pentru toate instrucțiunile"], "corecte": [0, 1, 2], "explicatie": "Curs 6, slide-ul „Adresarea datelor” / Capitol 6, introducere: a, b, c sunt citate din curs. Varianta d e falsă: multe procesoare au doar un subset al modurilor, uneori disponibile doar pentru un subset de instrucțiuni sau chiar pentru una singură.", "sigur": true, "figura": ""}, {"id": "c6-n229", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Unitățile de generare a adresei (AGU) ale procesoarelor DSP:", "variante": ["sunt dedicate calculului adreselor", "folosesc calea de date principală a procesorului pentru calculul adreselor", "pot efectua una sau mai multe operații complexe de calcul al adreselor pe ciclu de tact, în paralel cu operațiile aritmetice", "sunt denumite de AT&T „unitate de control aritmetică”"], "corecte": [0, 2, 3], "explicatie": "Capitol 6, introducere: AGU sunt dedicate calculului adreselor și lucrează fără a utiliza calea de date principală, deci în paralel cu operațiile aritmetice (b fals). Analog Devices le numește AGU, AT&T „unitate de control aritmetică”.", "sigur": true, "figura": ""}, {"id": "c6-n230", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Ce mod de adresare folosește instrucțiunea de înmulțire „P = X * Y” a procesorului DSP16xx (AT&T), care ar putea fi scrisă simplu „*”?", "variante": ["adresare directă la registru", "adresare implicită", "adresare imediată", "adresare indirectă cu registru"], "corecte": [1], "explicatie": "Curs 6 / Capitol 6, 6.1: toate instrucțiunile de înmulțire AT&T folosesc X și Y și depun rezultatul în P; programatorul nu poate specifica alte registre, deci adresarea e implicită. Nu e directă la registru tocmai pentru că registrele nu pot fi alese.", "sigur": true, "figura": ""}, {"id": "c6-n231", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "În instrucțiunea Analog Devices „AX0 = 1234” sunt folosite următoarele moduri de adresare:", "variante": ["adresarea imediată, pentru constanta 1234", "adresarea directă la registru, pentru registrul destinație AX0", "adresarea directă la memorie, pentru locația 1234", "adresarea implicită, pentru registrul AX0"], "corecte": [0, 1], "explicatie": "Curs 6 / Capitol 6, 6.2: „valoarea constantă este specificată prin adresare imediată, în timp ce registrul destinație, AX0, este specificat folosind adresarea directă la registru”. 1234 este valoare, nu adresă.", "sigur": true, "figura": ""}, {"id": "c6-n232", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Despre instrucțiunea „SUBF R1, R2” a procesorului TMS320C3x (Texas Instruments) sunt adevărate:", "variante": ["folosește adresarea directă la registru", "scade valoarea din R1 din cea din R2 și plasează rezultatul în R2", "ar fi putut folosi oricare două registre din cele opt existente pe cip", "folosește adresarea implicită, deoarece registrele sunt fixate de instrucțiune"], "corecte": [0, 1, 2], "explicatie": "Curs 6 / Capitol 6, 6.3: e exemplul de adresare directă la registru; programatorul specifică registrele și putea folosi oricare două din cele opt. Diferența față de implicită: acolo registrele sunt specificate de instrucțiune și nu pot fi schimbate (d fals).", "sigur": true, "figura": ""}, {"id": "c6-n233", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Instrucțiunea „AX0 = DM(1000)” (ADSP-21xx) folosește pentru sursă:", "variante": ["adresarea directă la memorie", "adresarea absolută", "adresarea imediată (încarcă valoarea 1000 în AX0)", "adresarea indirectă cu registru"], "corecte": [0, 1], "explicatie": "Capitol 6, 6.4: adresarea directă la memorie este „denumită și adresare absolută”; „AX0 = DM(1000)” încarcă în AX0 datele de la locația 1000, nu valoarea 1000. Adresa e codată în instrucțiune, nu într-un registru.", "sigur": true, "figura": ""}, {"id": "c6-n234", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Care afirmații despre adresarea imediată și adresarea directă la memorie sunt adevărate?", "variante": ["datele, respectiv adresele, de format mic pot fi codate în cuvântul instrucțiune, rezultând instrucțiuni de un singur cuvânt", "la format mare procesorul trebuie să citească două cuvinte din memoria de program, încetinind execuția", "la adresarea imediată în instrucțiune este codată adresa operandului", "la adresarea imediată, datele de lungime mică sunt de obicei jumătate din lungimea instrucțiunii sau mai mici"], "corecte": [0, 1, 3], "explicatie": "Capitol 6, 6.2 și 6.4: ambele moduri codează în instrucțiune datele/adresele mici și folosesc un cuvânt separat pentru cele mari (două citiri, execuție mai lentă). La imediată e codat operandul propriu-zis, nu adresa (c fals).", "sigur": true, "figura": ""}, {"id": "c6-n235", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Adresarea indirectă cu registru:", "variante": ["este cel mai folosit mod de adresare de pe majoritatea procesoarelor DSP", "este foarte potrivită utilizării tablourilor de date", "permite o adresare puternică și flexibilă folosind doar puțini biți din cuvântul instrucțiune", "presupune că datele adresate se află chiar în registrul specificat în instrucțiune"], "corecte": [0, 1, 2], "explicatie": "Curs 6 / Capitol 6, 6.5: datele se află în MEMORIE la adresa indicată de registru (d descrie adresarea directă la registru). Este cel mai folosit mod din două motive: tablourile de date și eficiența setului de instrucțiuni.", "sigur": true, "figura": ""}, {"id": "c6-n236", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Instrucțiunea „A0 = A0 + *R5++” a procesorului DSP32xx:", "variante": ["folosește adresarea indirectă cu registru cu post-incrementare", "folosește adresarea indirectă cu registru cu pre-incrementare", "folosește adresarea indirectă cu registru cu indexare", "după adunare R5 indică locația de memorie următoare"], "corecte": [0, 3], "explicatie": "Curs 6 / Capitol 6, 6.6: adună valoarea de la locația indicată de R5 cu A0 și APOI incrementează R5 ca să indice locația următoare. Modificarea după folosire = post-incrementare.", "sigur": true, "figura": ""}, {"id": "c6-n237", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Despre instrucțiunea „A0 = A0 + *R5++R17” (DSP32xx) sunt adevărate:", "variante": ["R17 este registrul pentru offset", "după accesarea memoriei, R5 este incrementat cu valoarea stocată în R17", "aceeași formă poate fi folosită pentru decrementare, deoarece R17 poate fi negativ", "R5 și R17 rămân nemodificate, adresa efectivă fiind R5 + R17"], "corecte": [0, 1, 2], "explicatie": "Capitol 6, 6.6: registrul cu valoarea de incrementare se numește registru pentru offset (Analog Devices: registru modificator); R17 poate fi negativ. Varianta d descrie indexarea (6.7), unde registrele nu se modifică.", "sigur": true, "figura": ""}, {"id": "c6-n238", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Instrucțiunea „MOVE X:-(R0), A1” a procesorului Motorola DSP5600x:", "variante": ["folosește adresarea indirectă cu registru cu pre-decrementare", "decrementează R0 înainte de utilizarea lui la adresarea memoriei", "folosește adresarea indirectă cu registru cu post-decrementare", "folosește adresarea cu indexare, R0 rămânând nemodificat"], "corecte": [0, 1], "explicatie": "Capitol 6, 6.6: este exemplul de pre-decrementare; R0 e decrementat înainte de a indica locația cu valoarea mutată în A1. Pre-modificarea necesită de obicei un ciclu instrucțiune în plus.", "sigur": true, "figura": ""}, {"id": "c6-n239", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Despre instrucțiunea „MOVE Y1, X:(R5 + N6)” (DSP5600x) sunt adevărate:", "variante": ["folosește adresarea indirectă cu registru cu indexare", "registrele R5 și N6 nu sunt modificate", "N6 poartă denumirea de registru index", "valoarea din Y1 este mutată în spațiul de adresare X, la adresa egală cu suma valorilor din R5 și N6"], "corecte": [0, 1, 2, 3], "explicatie": "Capitol 6, 6.7: toate cele patru afirmații reproduc explicația exemplului de indexare din curs.", "sigur": true, "figura": ""}, {"id": "c6-n240", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Instrucțiunea „LDI *-AR1(1), R7” a procesorului TMS320C3x:", "variante": ["folosește adresarea indirectă cu registru cu indexare, cu valoarea index furnizată imediat în instrucțiune", "nu modifică conținutul registrului AR1", "folosește pre-decrementarea, AR1 rămânând decrementat după execuție", "calculează adresa efectivă scăzând unu din valoarea lui AR1"], "corecte": [0, 1, 3], "explicatie": "Capitol 6, 6.7: index ca valoare imediată; adresa efectivă = AR1 − 1, datele de acolo merg în R7, iar „conținutul registrului AR1 nu este modificat”. Deci nu e pre-decrementare (c fals), deși sintaxa seamănă.", "sigur": true, "figura": ""}, {"id": "c6-n241", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Diferența dintre adresarea indirectă cu indexare și adresarea indirectă cu premodificare constă în faptul că:", "variante": ["la indexare valorile stocate în registre nu sunt modificate", "la indexare registrul de adrese este incrementat după acces", "la premodificare registrele nu sunt modificate", "nu există nicio diferență, termenii sunt sinonimi"], "corecte": [0], "explicatie": "Curs 6 / Capitol 6, 6.7, citat: „la indexare valorile stocate în registre nu sunt modificate”. Atenție: unii producători numesc „indexată” post-incrementarea cu valoare diferită de 1, dar asta e doar o chestiune de terminologie.", "sigur": true, "figura": ""}, {"id": "c6-n242", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Adresarea indexată este utilă:", "variante": ["atunci când același segment de cod este folosit cu mai multe seturi de date", "în compilatoare, la transmiterea argumentelor subrutinelor în/din stivă", "la rearanjarea rezultatelor FFT în ordinea firească", "la verificarea automată a depășirii sfârșitului unui buffer circular"], "corecte": [0, 1], "explicatie": "Capitol 6, 6.7: registrul index indică începutul setului de date (se schimbă doar el la trecerea la setul următor); compilatoarele o folosesc pentru argumentele din stivă (LDI *+AR1(2), R0). c ține de inversarea biților (6.9), d de adresarea modulo (6.8).", "sigur": true, "figura": ""}, {"id": "c6-n243", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Care dintre instrucțiunile următoare folosesc o formă de adresare indirectă cu registru (operandul se află în memorie la o adresă dată de un registru)?", "variante": ["A0 = A0 + *R5", "MOVE X:-(R0), A1", "AX0 = 1234", "SUBF R1, R2"], "corecte": [0, 1], "explicatie": "Capitol 6: „A0 = A0 + *R5” e indirectă cu registru (6.5), „MOVE X:-(R0), A1” e indirectă cu pre-decrementare (6.6). „AX0 = 1234” e imediată + directă la registru (6.2), „SUBF R1, R2” e directă la registru (6.3).", "sigur": true, "figura": ""}, {"id": "c6-n244", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Care dintre instrucțiunile următoare NU modifică registrul folosit pentru calculul adresei?", "variante": ["MOVE Y1, X:(R5 + N6)", "LDI *+AR1(2), R0", "A0 = A0 + *R5", "A0 = A0 + *R5--"], "corecte": [0, 1, 2], "explicatie": "Capitol 6: la indexare (6.7) registrele rămân nemodificate (MOVE Y1, X:(R5 + N6); LDI *+AR1(2), R0), iar la indirectă simplă (6.5) R5 doar indică adresa. „*R5--” decrementează R5 după adunare (6.6).", "sigur": true, "figura": ""}, {"id": "c6-n245", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Referitor la adresarea indirectă cu registru cu aritmetică a adreselor modulo, sunt adevărate afirmațiile:", "variante": ["cea mai comună aplicație a acestui mod de adresare este implementarea unui buffer circular", "bufferele folosesc tehnica FIFO, cu un pointer de citire și un pointer de scriere", "elimină necesitatea verificării de către programator a depășirii bufferului de către pointeri și a ajustării acestora", "necesită alocarea dinamică a memoriei pentru buffer la fiecare operație de scriere"], "corecte": [0, 1, 2], "explicatie": "Curs 6 / Capitol 6, 6.8: buffer circular, FIFO, doi pointeri; modulo face automat verificarea și readuce pointerul la început. La sistemele în timp real alocarea dinamică e prea scumpă, de aceea programatorul rezervă dinainte memoria (d fals).", "sigur": true, "figura": ""}, {"id": "c6-n246", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "În exemplul din curs cu bufferul circular care conține ultimele patru eșantioane (coeficienții w0, w1, w2, w3), la momentul n+1:", "variante": ["pointerul este deplasat la adresa ocupată de x(n−3), cel mai vechi eșantion, care este înlocuit cu x(n+1)", "toate eșantioanele sunt mutate cu o poziție în memorie", "pointerul rămâne pe x(n)", "prin ajustarea automată a pointerului, cantitatea de date care trebuie deplasată este minimizată"], "corecte": [0, 3], "explicatie": "Capitol 6, 6.8 (figura cu principiul bufferului circular): la n pointerul P accesează x(n), la n+1 trece pe x(n−3), care e înlocuit cu x(n+1); datele nu sunt mutate (vezi și Curs 5, adresarea modulo n la linia de întârziere FIR).", "sigur": true, "figura": ""}, {"id": "c6-n247", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Când adresarea modulo este controlată printr-un registru modulo (registru modificator), un buffer circular de 48 de cuvinte trebuie de obicei să înceapă la granița unui segment de:", "variante": ["48 de cuvinte", "64 de cuvinte", "32 de cuvinte", "128 de cuvinte"], "corecte": [1], "explicatie": "Capitol 6, 6.8: registrul conține doar lungimea, deci bufferul începe la granița unui segment de k cuvinte, k = cea mai mică putere a lui 2 ≥ dimensiunea; pentru 48 → 64 (exemplul din curs).", "sigur": true, "figura": ""}, {"id": "c6-n248", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Un buffer circular cu lungimea 256, gestionat printr-un registru modulo, poate începe la adresa:", "variante": ["0", "256", "512", "384"], "corecte": [0, 1, 2], "explicatie": "Capitol 6, 6.8: „un buffer circular cu lungimea 256 poate începe la adresa 0, 256, 512 sau orice altă adresă multiplu de 256”. 384 nu e multiplu de 256.", "sigur": true, "figura": ""}, {"id": "c6-n249", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Registrul modulo (registrul modificator) folosit la adresarea circulară:", "variante": ["conține lungimea bufferului circular", "conține atât lungimea, cât și adresa de început a bufferului", "este asociat cu unul sau mai mulți registri adresă, care folosesc automat aritmetica modulo după încărcarea lui", "poate exista într-un singur exemplar sau în mai multe exemplare pe un procesor"], "corecte": [0, 2, 3], "explicatie": "Capitol 6, 6.8: lungimea bufferului e încărcată în registrul modificator/modulo; un procesor poate avea unul sau câteva, fiecare asociat cu unul sau mai mulți registri adresă. Registrul NU conține adresa de start (de aici condiția granița puterii lui 2).", "sigur": true, "figura": ""}, {"id": "c6-n250", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Procesoarele care controlează adresarea modulo prin registre de start și de sfârșit ale bufferului circular sunt:", "variante": ["DSP16xx (AT&T)", "TMS320C5x (Texas Instruments)", "TMS320C3x (Texas Instruments)", "DSP5600x (Motorola)"], "corecte": [0, 1], "explicatie": "Capitol 6, 6.8: „Procesoare care folosesc registri de start/sfârșit sunt DSP16xx (AT&T) și TMS320C5x (TI)”. TMS320C3x și Motorola folosesc registrul modulo (prima metodă).", "sigur": true, "figura": ""}, {"id": "c6-n251", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Numărul de buffere circulare active cu adresare modulo suportate este:", "variante": ["DSP16xx (AT&T) – unul singur", "TMS320C5x (TI) – două", "Motorola DSP561xx – patru", "procesoarele Analog Devices – două"], "corecte": [0, 1, 2], "explicatie": "Capitol 6, 6.8: DSP16xx – un buffer (un singur registru de start și unul de sfârșit), TMS320C5x – două, DSP561xx – patru, DSP5600x și toate procesoarele Analog Devices – opt (d fals).", "sigur": true, "figura": ""}, {"id": "c6-n252", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Adresarea indirectă cu registru cu inversarea biților:", "variante": ["este folosită la algoritmii FFT în baza 2, cu decimare în timp sau în frecvență", "este folosită numai în anumite împrejurări foarte speciale", "la ADSP-210xx (Analog Devices) este activată prin setarea unui bit în registrul de control", "este folosită pentru implementarea bufferelor circulare FIFO"], "corecte": [0, 1, 2], "explicatie": "Capitol 6, 6.9: algoritmii FFT radix-2 (DIT/DIF) folosesc intrarea sau produc ieșirea în ordine inversată; la ADSP-210xx modul se activează printr-un bit în registrul de control, iar ieșirii unui registru de adrese i se inversează biții înainte de magistrala de adrese. Bufferele circulare țin de adresarea modulo (6.8).", "sigur": true, "figura": ""}, {"id": "c6-n253", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Pentru o FFT în baza 2 cu 8 puncte, ordinea cu biții inversați a indicilor 0, 1, 2, …, 7 este:", "variante": ["0, 4, 2, 6, 1, 5, 3, 7", "0, 1, 2, 3, 4, 5, 6, 7", "7, 6, 5, 4, 3, 2, 1, 0", "0, 2, 4, 6, 1, 3, 5, 7"], "corecte": [0], "explicatie": "Curs 6, 6.9 (figura FFT cu opt puncte) / Capitol 6, Fig. 6.3: ieșirea numărătorului binar scrisă cu biții în ordine inversă (LSB primul): 001 → 100 = 4, 010 → 010 = 2, 011 → 110 = 6 etc.", "sigur": true, "figura": ""}, {"id": "c6-n254", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Aritmetica cu transport invers, ca alternativă pentru adresarea cu inversarea biților:", "variante": ["inversează direcția în care se propagă biții de transport când un increment este adăugat valorii dintr-un registru adresă", "dă o adresă cu biții inversați dacă programatorul furnizează adresa de bază și incrementul cu ordinea biților inversată", "este utilizată la DSP32C și DSP32xx (AT&T)", "este activată la ADSP-210xx prin setarea unui bit în registrul de control"], "corecte": [0, 1, 2], "explicatie": "Capitol 6, 6.9: a, b, c reproduc descrierea aritmeticii cu transport invers. Bitul din registrul de control (d) este mecanismul ADSP-210xx, nu transportul invers.", "sigur": true, "figura": ""}, {"id": "c6-n255", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Instrucțiunea „MOVE #1234, A” a procesorului Motorola DSP5600x:", "variante": ["folosește adresarea imediată", "folosește adresarea directă la memorie (încarcă datele de la adresa 1234)", "poate fi codată într-un singur cuvânt de memorie de program dacă datele au 12 biți sau mai puțin", "poate fi codată într-un singur cuvânt doar dacă datele au cel mult 6 biți"], "corecte": [0, 2], "explicatie": "Curs 6 / Capitol 6, 6.10 a): „#” indică date imediate, încărcate în A. În general sunt necesare două cuvinte, dar dacă datele au 12 biți sau mai puțin încap într-un singur cuvânt. 6 biți e limita adresării scurte directe la memorie.", "sigur": true, "figura": ""}, {"id": "c6-n256", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Instrucțiunea „MOVE $1000, A” a procesorului Motorola DSP5600x:", "variante": ["folosește adresarea directă la memorie", "încarcă în registrul A datele aflate la adresa 1000", "încarcă în registrul A constanta 1000", "folosește adresarea indirectă cu registru"], "corecte": [0, 1], "explicatie": "Curs 6 / Capitol 6, 6.10 b): „$” indică o adresă; instrucțiunea încarcă datele de la adresa 1000 în A (directă la memorie). Constanta s-ar scrie cu „#” (adresare imediată).", "sigur": true, "figura": ""}, {"id": "c6-n257", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Despre modurile de adresare scurte sunt adevărate afirmațiile:", "variante": ["includ într-un singur cuvânt atât instrucțiunea cât și adresa, pe seama unor restricții la nivelul adreselor", "la Motorola DSP5600x, adresarea scurtă directă la memorie permite codarea în instrucțiune a adreselor de până la șase biți", "adresarea scurtă directă la memorie economisește un cuvânt de memorie și un ciclu instrucțiune", "DSP5600x folosește un mod de adresare scurtă directă la memorie pentru registrele I/O mapate pe ultimele 64 de locații de memorie"], "corecte": [0, 1, 2, 3], "explicatie": "Curs 6 / Capitol 6, 6.10: toate afirmațiile sunt din curs. Ultima este varianta care adaugă un offset implicit la adresa scurtă.", "sigur": true, "figura": ""}, {"id": "c6-n258", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "La adresarea directă la memorie paginată a procesoarelor TMS320C2x și TMS320C5x (Texas Instruments):", "variante": ["instrucțiunile folosesc 7 biți de adresă", "memoria este împărțită în pagini de 128 de cuvinte", "instrucțiunile folosesc direct o adresă de 16 biți", "memoria este împărțită în pagini de 64 de cuvinte"], "corecte": [0, 1], "explicatie": "Curs 6 / Capitol 6, 6.11: procesorul adresează 64 K cuvinte, dar instrucțiunile nu folosesc direct adresa de 16 biți; au 7 biți de adresă, suficienți pentru un cuvânt din 128 (2^7), deci pagini de 128 cuvinte. 64 este numărul locațiilor I/O de la DSP5600x (6.10).", "sigur": true, "figura": ""}, {"id": "c6-n259", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Care afirmații despre adresarea directă la memorie paginată sunt adevărate?", "variante": ["un registru special stochează numărul paginii de memorie adresate", "instrucțiunea specifică locația relativă a cuvântului în interiorul paginii", "pentru adresarea unui cuvânt din afara paginii, registrul de pagină trebuie actualizat sau se folosește alt registru de pagină", "tehnica este eficientă indiferent de numărul de accesări făcute într-o pagină"], "corecte": [0, 1, 2], "explicatie": "Curs 6 / Capitol 6, 6.11: a, b, c sunt din definiție. Tehnica este eficientă „doar dacă programatorul poate organiza programul astfel încât să aibă loc un număr semnificativ de accesări în interiorul unei pagini” (d fals).", "sigur": true, "figura": ""}, {"id": "c6-n260", "curs": 6, "tip": "nou", "sursa": "nou", "intrebare": "Cea mai comună modificare efectuată asupra unui registru de adrese este:", "variante": ["adăugarea unui increment cu valoarea unu după ce registrul a fost folosit la accesarea operandului (post-incrementare cu unu)", "pre-decrementarea cu unu", "adunarea unui registru index fără modificarea registrului de adrese", "inversarea biților registrului de adrese"], "corecte": [0], "explicatie": "Curs 6 / Capitol 6, 6.6, citat: „Cea mai comună modificare efectuată asupra unui registru de adrese constă în adăugarea unui increment cu valoarea 1 după ce registrul de adrese este folosit”. Este și modul cel mai comun menționat în Curs 2 (adresarea indirectă cu post-incrementare).", "sigur": true, "figura": ""}]};
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L = "abcd";
const store = {
  get(k, d) { try { const v = localStorage.getItem("psl1:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("psl1:" + k, JSON.stringify(v)); } catch {} }
};
const titlu = n => (DATA.cursuri.find(c => c.curs === n) || {}).titlu || "";
let state = { tab: "invata", curs: store.get("curs", 1), filtru: store.get("filtru", "toate"), idx: 0, sim: null };

// pista de semnal din antet: o sinusoidă eșantionată
(function () {
  let d = "";
  for (let i = 0; i <= 120; i++) { const x = i * 5, y = 17 - 12 * Math.sin(i / 6.5) * Math.cos(i / 31); d += (i ? " L" : "M") + x + " " + y.toFixed(1) + " L" + (x + 5) + " " + y.toFixed(1); }
  $("#trace").setAttribute("d", d);
  const t = new Date(2026, 10, 10, 8, 0), now = new Date(), z = Math.ceil((t - now) / 864e5);
  $("#countdown").innerHTML = z > 1 ? `mai sunt <b>${z} zile</b>` : z === 1 ? "<b>mâine</b>" : z === 0 ? "<b>azi</b>" : "";
})();

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function wrong() { return store.get("gresite", []); }
function mark(id, good) {
  let w = new Set(wrong()); good ? w.delete(id) : w.add(id); store.set("gresite", [...w]);
  const st = store.get("stat", {}); st[id] = { ok: good, t: Date.now() }; store.set("stat", st);
}

function questionCard(q, n, total, onDone) {
  const el = document.createElement("section");
  el.className = "sheet q";
  el.innerHTML = `
    <div class="qhead"><span>${n ? `Întrebarea ${n}${total ? " / " + total : ""}` : ""}</span>
      <span class="row"><span class="tag">Curs ${q.curs}</span><span class="tag ${q.tip === "vechi" ? "vechi" : ""}">${q.tip === "vechi" ? "grilă veche" : "nouă"}</span></span></div>
    <div class="qtext">${esc(q.intrebare)}</div>
    ${q.figura ? `<div class="figure">Figură: ${esc(q.figura)}</div>` : ""}
    <div class="opts">${q.variante.map((v, i) => `<label class="opt" for="o-${q.id}-${i}"><input type="checkbox" id="o-${q.id}-${i}" data-i="${i}"><span class="l">${L[i] || i + 1}.</span><span>${esc(v)}</span></label>`).join("")}</div>
    <div class="row"><button class="btn" data-act="check">Verifică</button><span class="verdict"></span></div>
    <div class="expl" hidden></div>`;
  const check = $("[data-act=check]", el);
  check.onclick = () => {
    const picked = [...el.querySelectorAll("input")].filter(x => x.checked).map(x => +x.dataset.i);
    const corect = new Set(q.corecte);
    el.querySelectorAll(".opt").forEach((o, i) => {
      const p = picked.includes(i), c = corect.has(i);
      o.classList.add(p && c ? "ok" : p && !c ? "bad" : !p && c ? "miss" : "x");
      $("input", o).disabled = true;
    });
    const good = picked.length === corect.size && picked.every(i => corect.has(i));
    const v = $(".verdict", el); v.className = "verdict " + (good ? "ok" : "bad");
    v.textContent = good ? "Corect" : "Greșit · corect: " + q.corecte.map(i => L[i]).join(", ");
    const ex = $(".expl", el); ex.hidden = false;
    ex.innerHTML = (q.sigur === false ? `<p class="unsure">Răspuns dedus, nesigur: cursul nu o spune explicit.</p>` : "") +
      `<p>${esc(q.explicatie)}</p><p class="muted">${q.tip === "vechi" ? "Din grilele vechi: " + esc(q.sursa) : "Grilă nouă, făcută după curs."}</p>`;
    check.disabled = true;
    mark(q.id, good);
    onDone && onDone(good);
  };
  return el;
}

const views = {
  invata() {
    const c = DATA.cursuri.find(x => x.curs === state.curs) || DATA.cursuri[0];
    const v = $("#view");
    v.innerHTML = `<div class="chips">${DATA.cursuri.map(x => `<button class="chip" aria-pressed="${x.curs === c.curs}" data-c="${x.curs}">Curs ${x.curs}</button>`).join("")}</div>
      <h2>Cursul ${c.curs}. ${esc(c.titlu)}</h2>
      <section class="sheet">${c.rezumat.map(s => `<div class="sec"><h3>${esc(s.titlu)}</h3><ul>${s.puncte.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>`).join("")}</section>
      ${c.capcane && c.capcane.length ? `<section class="trap"><h3>Capcane</h3><ul>${c.capcane.map(p => `<li>${esc(p)}</li>`).join("")}</ul></section>` : ""}
      <div class="row"><button class="btn" id="go-grile">Grile din cursul ${c.curs} (${DATA.grile.filter(q => q.curs === c.curs).length})</button></div>`;
    v.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { state.curs = +b.dataset.c; store.set("curs", state.curs); render(); });
    $("#go-grile").onclick = () => { state.filtru = "c" + c.curs; state.idx = 0; store.set("filtru", state.filtru); go("grile"); };
  },
  grile() {
    const f = state.filtru;
    const list = DATA.grile.filter(q => f === "toate" ? true : f === "vechi" ? q.tip === "vechi" : q.curs === +f.slice(1));
    if (state.idx >= list.length) state.idx = 0;
    const v = $("#view");
    const filters = [["toate", "Toate"], ["vechi", "Doar grile vechi"], ...DATA.cursuri.map(c => ["c" + c.curs, "Curs " + c.curs])];
    v.innerHTML = `<div class="chips">${filters.map(([k, t]) => `<button class="chip" aria-pressed="${k === f}" data-f="${k}">${t}</button>`).join("")}</div>
      <div class="progress" aria-hidden="true"><i style="width:${list.length ? ((state.idx + 1) / list.length * 100) : 0}%"></i></div>`;
    v.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { state.filtru = b.dataset.f; state.idx = 0; store.set("filtru", state.filtru); render(); });
    if (!list.length) { v.insertAdjacentHTML("beforeend", `<p class="muted">Nicio grilă aici.</p>`); return; }
    v.appendChild(questionCard(list[state.idx], state.idx + 1, list.length));
    v.insertAdjacentHTML("beforeend", `<div class="row"><button class="btn ghost" id="prev">Înapoi</button><button class="btn" id="next">Următoarea</button></div>`);
    $("#prev").onclick = () => { state.idx = (state.idx - 1 + list.length) % list.length; render(); };
    $("#next").onclick = () => { state.idx = (state.idx + 1) % list.length; render(); window.scrollTo(0, 0); };
  },
  sim() {
    const v = $("#view");
    if (!state.sim) {
      const best = store.get("sim", []);
      v.innerHTML = `<h2>Simulare de test</h2>
        <section class="sheet"><p>10 întrebări din cursurile 1–6, ca la test: patru variante, una sau mai multe corecte. Bifează tot ce e corect și apasă Verifică; o întrebare e bună doar dacă ai bifat exact variantele corecte. Scorul apare după ce le verifici pe toate 10.</p>
        <p class="muted">Jumătate din întrebări vin din grilele vechi, restul sunt noi, din toate cursurile.</p>
        <div class="row"><button class="btn" id="start">Începe simularea</button></div></section>
        ${best.length ? `<section class="sheet"><h3>Simulările tale</h3><ul>${best.slice(-8).reverse().map(s => `<li><span class="mono">${s.p}/10</span> · ${new Date(s.t).toLocaleString("ro-RO", { dateStyle: "short", timeStyle: "short" })}</li>`).join("")}</ul></section>` : ""}`;
      $("#start").onclick = () => {
        const vechi = shuffle(DATA.grile.filter(q => q.tip === "vechi")), noi = shuffle(DATA.grile.filter(q => q.tip !== "vechi"));
        const pick = [], seenC = {};
        const take = (src, n) => { for (const q of src) { if (pick.length >= n) break; if (!pick.includes(q) && (seenC[q.curs] || 0) < 3) { pick.push(q); seenC[q.curs] = (seenC[q.curs] || 0) + 1; } } };
        take(vechi, 5); take(noi, 10); take(shuffle(DATA.grile), 10);
        state.sim = { qs: shuffle(pick), done: 0, good: 0 };
        render();
      };
      return;
    }
    const s = state.sim;
    v.innerHTML = `<h2>Simulare · <span class="mono">${s.done}/10</span> răspunse</h2>`;
    s.qs.forEach((q, i) => v.appendChild(questionCard(q, i + 1, 10, good => {
      s.done++; if (good) s.good++;
      $("h2", v).innerHTML = `Simulare · <span class="mono">${s.done}/10</span> răspunse`;
      if (s.done === 10) {
        const all = store.get("sim", []); all.push({ p: s.good, t: Date.now() }); store.set("sim", all);
        v.insertAdjacentHTML("beforeend", `<section class="sheet"><div class="score">${s.good}/10</div><p>${s.good >= 8 ? "Ești pregătit." : s.good >= 5 ? "Aproape. Reia grilele greșite din tabul Greșeli." : "Mai citește rezumatul cursurilor la care ai greșit și reia grilele."}</p><div class="row"><button class="btn" id="again">Încă o simulare</button></div></section>`);
        $("#again").onclick = () => { state.sim = null; render(); window.scrollTo(0, 0); };
      }
    })));
  },
  gresite() {
    const ids = new Set(wrong());
    const list = DATA.grile.filter(q => ids.has(q.id));
    const v = $("#view");
    v.innerHTML = `<h2>Grilele greșite (${list.length})</h2>
      <p class="muted">Aici ajung grilele la care ai greșit. Când răspunzi corect, ies din listă. Se păstrează doar în browserul ăsta.</p>`;
    if (!list.length) { v.insertAdjacentHTML("beforeend", `<section class="sheet"><p>Nicio grilă greșită momentan. Fă o simulare sau treci prin grile.</p></section>`); return; }
    list.forEach((q, i) => v.appendChild(questionCard(q, i + 1, list.length)));
  }
};

function go(tab) { state.tab = tab; render(); window.scrollTo(0, 0); }
function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === state.tab));
  views[state.tab]();
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => go(b.dataset.tab));
render();
</script>
