<script>
const DATA = {"cursuri": [{"curs": 1, "titlu": "Procesoare digitale de semnal și sisteme PDS", "rezumat": [{"titlu": "1.1. Introducere", "puncte": ["Impulsul inițial pentru folosirea tehnicilor numerice în prelucrarea semnalelor l-au dat calculatoarele numerice de uz general; inconveniente: flexibilitate redusă, gabaritul mare, preț de cost mare, ceea ce limitează domeniile de aplicabilitate.", "Elemente ale tehnicii de calcul numerice au fost folosite apoi pentru echipamente specializate în prelucrarea semnalelor.", "Dezvoltarea circuitelor cu grad mare de integrare (VLSI, GLSI, peste 10^6 tranzistoare/cip) a deschis o nouă etapă în PDS, care a debutat în 1979 cu familia de procesoare Intel 2920 (avea convertoare A/D și D/A încorporate; filtre numerice de ordin mic în banda audio, zeci de kHz).", "Aproape simultan: Texas Instruments – TMS 320 (productivitate deosebită datorită unui nou tip de arhitectură internă); AMD – procesorul bit-slice AMD 29500 (împreună cu AMD 2900).", "Cei mai importanți producători de circuite PDS: Texas Instruments (57%, lider), AT&T (13%), Motorola (13%), NEC (8%), Analog Devices (6%), alți producători (3%).", "Procesoarele PDS actuale sunt optimizate în raport cu: viteza de prelucrare, consumul de energie și prețul de cost; sunt un concurent redutabil pentru microprocesoarele de uz general și microcontrolere.", "Domenii de utilizare: telecomunicații (modemuri, echipamente radio, sisteme de televiziune, transmisiuni de date, telefonie celulară), medicină, industria automobilelor, instrumentație, echipamente periferice (drivere de disc flexibil și optic, imprimante, sisteme de achiziție), robotică, electronică de consum."]}, {"titlu": "1.2. Caracteristici ale procesoarelor PDS (Capitol 1 – §1.1)", "puncte": ["Definiție: procesoarele PDS sunt circuite integrate specializate pentru implementarea algoritmilor de prelucrare numerică a semnalelor (convoluție, filtrare recursivă, TFD, prelucrare neliniară, prelucrare logică).", "Particularitățile impuse de algoritmi (cerințe): viteză mare de prelucrare pentru lucrul în timp real; executarea unui volum mare de operații aritmetice și logice simple; asigurarea unei precizii mari de prelucrare; semnalele de intrare sunt în multe cazuri semnale analogice.", "Căi de satisfacere a cerințelor (1/2): arhitecturi cu grad mare de paralelism combinate cu execuția pipeline (multe instrucțiuni executate într-un singur tact); module incluse în circuit pentru creșterea productivității: multiplicator hardware de tip paralel, circuite pentru deplasări binare, memorii interne pentru date și programe, stivă internă; facilități hardware pentru execuția eficientă a buclelor; unitatea de comandă în logică cablată.", "Căi de satisfacere a cerințelor (2/2): circuite pentru conversia A/D și D/A și interfețe rapide (porturi seriale și paralele, controlere DMA); interfețe specifice (timere, circuite PLL, controlere de întreruperi); precizie de 16 sau 32 de biți, în virgulă fixă sau mobilă; set de instrucțiuni adaptat (înmulțire și acumulare, manipularea blocurilor de date, set mai bogat pentru periferice); moduri de adresare specifice (pre/post incrementare/decrementare, inversarea biților, modulo).", "Multe procesoare PDS folosesc o arhitectură paralelă care combină prelucrarea pipeline cu structura Harvard. Pipeline = fragmentarea activităților și executarea lor pe unități funcționale distincte. Harvard = memorii separate pentru coduri și date și căi separate de transfer, deci transferul operanzilor simultan cu extragerea codurilor.", "Partea operațională: UAL rapidă cu acumulator, multiplicator paralel și circuit de deplasare cu unul sau mai multe ranguri într-un singur tact (barrel shifter). Unele circuite fac înmulțirea prin adunări și deplasări succesive (I-2920). Scăderea se face prin adunarea operanzilor în complement față de doi.", "Procesoarele PDS funcționează în virgulă fixă (pe 16 biți) sau în virgulă mobilă (pe 32 de biți); o alternativă la virgula mobilă este aritmetica în virgulă mobilă pe bloc.", "Memorie internă RAM și/sau ROM/EPROM/flash. Coeficienții și constantele se păstrează în memoria de program (fixă) și se transferă la pornire în memoria de date, deci Harvard tradițională a fost modificată (transferuri între cele două memorii cu instrucțiuni speciale). Registrele interne de uz general sunt de tip RAM, până la 128 de cuvinte sau mai mult.", "Harvard la DSP vs. procesoare de uz general (PUG) cu cache: la DSP programatorul controlează explicit datele și instrucțiunile din memoriile interne; la PUG transferul cu cache-ul e automat, transparent pentru programator. DSP în general nu au cache de date; unele au un mic cache de instrucțiuni pentru bucle.", "Unități hardware specializate: multiplicator intern paralel, circuite de deplasare, unități aritmetice separate pentru calculul adreselor. Interfețe specializate: convertoare A/D și D/A sau interfețe pentru ele; TMS 320 are în locul convertoarelor controlere pentru întreruperi.", "Stiva implementată hardware permite salvarea/restaurarea rapidă a contextului la întreruperi sau subrutine; fiind limitată, poate fi extinsă în memoria RAM pentru date.", "Unitatea de comandă a DSP e realizată în logică cablată (la PUG prin microprogramare): mai puțin flexibilă, dar mai rapidă.", "Setul de instrucțiuni are instrucțiuni generale și strict specializate: MAC (multiplicare și acumulare), operații strict specializate, instrucțiuni pentru reperare.", "Lungimea cuvintelor de calcul: 8, 16, 25 și chiar 40 de biți. Unele operații interne se fac în precizie dublă pentru mărirea gamei dinamice. Precizia e impusă de performanțele dorite, de exemplu un raport semnal/zgomot convenabil.", "Prima generație a renunțat la cicluri programabile, la un sistem dezvoltat de întreruperi și la metode de transfer eficiente; a doua generație atinge performanțele celor mai bune microprocesoare single-cip de uz general.", "Convergență: PUG primesc facilități PDS (MMX, SSE la Pentium), iar DSP preiau facilități PUG (memorie virtuală, multiprogramare, cache). DSP derivate din microcontrolere: 68HC16 (Motorola), Z89C00 (Zilog, din Z8), National Semiconductor.", "Tendințe: viteză mai mare prin tehnologii noi (Ga-As, 33 ps; multiplicatoare Bell Labs 8x12 biți cu joncțiuni Josephson, 2 ns); coprocesoare pentru calcule complexe; potrivirea algoritmilor PDS cu arhitectura; arhitecturi data flow sau rețele dedicate în locul celor tradiționale (unitate centrală + memorie); circuite mai bune și mai universale, cu întreruperi și virgulă mobilă, mai ieftine; circuite PDS la cerere (nucleu PDS + memorie și periferice; TI vinde 10–20% astfel, din nucleu în virgulă fixă).", "Inconveniente: folosirea DSP e mai dificilă decât a altor microprocesoare, așa că au apărut „seturile PDS” (circuitul sau plachetă cu el + software-ul de programare).", "Două metode de programare la îndemâna utilizatorului: programarea la nivel de blocuri (Block-Level Programming: graf din blocuri funcționale standard, ORCAD, PROTEL, simulare, apoi cod pentru procesor, FPGA sau ASIC) și programarea bazată pe meniuri (Array Microsystems, „Array so FFT”: TFR în 1024 de puncte în maximum 132 µs).", "Pentru cod propriu se folosesc compilatoare de nivel înalt (mai ales C; ADA la TMS 320C3x/C4x) și sisteme de operare specifice: Spox (Spectron Microsystems, cel mai popular: nucleu de multiprocesare de timp real, gestiunea memoriei, bibliotecă matematică PDS, bibliotecă C, depanare), MicroSpox (în virgulă fixă), VRTX (Ready Systems).", "Evaluarea familiilor de DSP: timpul operației de înmulțire și adunare (slide: de ordinul ns; capitol: de ordinul a 200 ns) și timpul pentru o sarcină precisă, de exemplu o filtrare numerică sau o TFR într-un număr dat de puncte (de regulă 1024).", "Cost pe operație (TFR 1024 de puncte în virgulă fixă): CRAY1 1 $/operație, un sistem cu TMS 320 doar 0,00066 $/operație.", "Avantajele folosirii DSP în sistemele PDS: sisteme în timp real, universale și flexibile, cu programare rapidă pentru o funcție predeterminată; precizie mare, care depinde de precizia reprezentării interne a datelor; stabilitate mare la variații de temperatură, tensiune de alimentare sau parametri ai componentelor; lipsa problemelor cu zgomotul surselor de alimentare; existența unor modele matematice pentru proiectare și analiză; cost redus al componentelor și procedee standard de fabricație."]}, {"titlu": "1.3. Caracteristici ale sistemelor PDS (Capitol 1 – §1.2)", "puncte": ["Caracteristici comune ale sistemelor PDS: a) algoritmii, b) rata de eșantionare, c) tactul, d) reprezentarea numerelor (tipul aritmeticii).", "Algoritmul specifică operațiile aritmetice care trebuie efectuate, dar nu arată cum sunt implementate. Același algoritm poate rula pe un microprocesor de uz general, pe un DSP sau pe un circuit integrat dedicat; tehnologia se alege și după viteză și precizie.", "Rata de eșantionare este viteza cu care eșantioanele sunt achiziționate, prelucrate și generate. Împreună cu complexitatea algoritmilor, ea determină cerințele de viteză ale tehnologiei de implementare (exemplu: CD audio, 44,1 kHz pe două canale).", "Sistemele PDS multirată folosesc mai multe rate de eșantionare. Exemple: conversia CD 44,1 kHz → DAT 48 kHz (raportul nu e întreg, deci se face în etape, cu cel puțin două rate intermediare) și bancurile de filtre (codarea vorbirii, audio, video). Raportul dintre rata minimă și cea maximă poate depăși cinci ordine de mărime.", "Ratele de eșantionare acoperă 12 ordine de mărime, dar aplicațiile cu rate înalte sunt rare (costul și dificultatea cresc cu rata), deci algoritmii la rate mari tind să fie mai simpli. Fig. 1.1: radarul are rată foarte mare și algoritmi simpli; modelarea vremii (weather modeling) are rată foarte mică și algoritmi complecși.", "Sistemele de timp real trebuie să satisfacă cerințele de viteză în orice condiții (bazele de date doar pe ansamblu). Convertorul CD→DAT primește un eșantion la fiecare 22,6 µs și produce unul la fiecare 20,8 µs; dacă nu reușește, se pierd date și ieșirea e distorsionată.", "Tactul: frecvența de tact corespunde uzual frecvenței cu care sistemul execută operațiile elementare; la produsele comerciale sunt comune frecvențe de până la 100 MHz. Raportul dintre rata de eșantionare și tact stabilește modul de implementare și cantitatea de hardware necesară; cu cât raportul crește, cu atât crește și cantitatea și complexitatea hardware-ului.", "Reprezentarea numerelor: adunarea și înmulțirea sunt comune majorității algoritmilor PDS, deci aritmetica influențează puternic comportarea și performanțele. Cea mai importantă decizie a proiectantului este alegerea între virgula fixă și virgula mobilă.", "Virgula fixă: numere într-o gamă fixă (de exemplu între −1,0 și +1,0), pe cuvinte cu număr finit de biți (lungimea cuvântului). Pe 8 biți rezoluția este 1/256 din valoarea maximă. Numerele din afara domeniului nu pot fi reprezentate; la depășire se face saturarea (limitare la cea mai mică/mare valoare) sau eliminarea biților excedentari (wrap around).", "Virgula mobilă (floating point) extinde mult domeniul de lucru: fiecare număr = mantisă M (între −1,0 și +1,0) și exponent E, N = M × 2^E.", "Virgula mobilă are o gamă dinamică mult mai mare (gama dinamică = raportul dintre cea mai mare și cea mai mică valoare reprezentabilă). Reduce depășirile de scală și operațiile de normare, deci simplifică proiectarea algoritmului și a software-ului. În schimb e mai lentă și mai scumpă, iar hardware-ul e mai complicat."]}, {"titlu": "1.4. Folosirea procesoarelor PDS (Capitol 1 – §1.3)", "puncte": ["Niciun DSP nu satisface toate aplicațiile. Proiectantul alege procesorul după performanțe, cost, posibilități de integrare, consum și alți factori.", "Categorii de aplicații: sistemele dedicate ieftine; aplicații de înaltă performanță; aplicații multimedia pe calculatoare PC.", "Sistemele dedicate ieftine sunt cele mai multe aplicații, produse în număr mare (telefoane celulare, drivere de disc, modemuri; în tabel și pagere, detectoare radar, telefoane fără fir, control auto în timp real). Primează costul și simplitatea integrării; la produsele portabile pe baterie, puterea consumată e și ea critică.", "Aplicațiile de înaltă performanță prelucrează un volum mare de date cu algoritmi complecși: sonar, explorări seismice (în tabel: radar, imagistică seismică, identificarea vorbitorului). Se fac puține produse, iar proiectarea e complexă: se exploatează la maximum procesorul, cu suport multiprocesor, eventual pe un sistem standard de dezvoltare cu biblioteci.", "Multimedia pe PC: mesagerie vocală, modemuri de date și fax, sinteză de muzică și voce, compresie de imagini. Cer cost redus, integrare mare, performanțe înalte (mai multe funcții simultan), comutare eficientă între funcții (multiprocesare) și memorie suficientă.", "Tendință: procesoarele de uz general primesc funcții specifice PDS și uneori pot lucra fără un DSP separat."]}, {"titlu": "1.5. Problematica proiectării sistemelor PDS (Capitol 1 – §1.4)", "puncte": ["Proiectarea sistemelor PDS în timp real presupune studiul principiilor și metodelor de construcție a algoritmilor, programelor și mijloacelor hardware și are 5 etape:", "I. Studierea și elaborarea metodelor de sinteză a operatorilor de prelucrare fizic realizabili, pentru diverse probleme aplicative (de exemplu sinteza funcțiilor de transfer ale filtrelor numerice).", "II. Elaborarea și optimizarea algoritmilor efectivi de calcul ai operatorilor din etapa I. Volumul de calcule stabilește eficiența necesară a procesorului; optimizarea reduce volumul de calcul și deci necesarul de hardware.", "III. Analiza calității algoritmilor: estimarea preciziei de execuție, influența lungimii cuvintelor, analiza stabilității, diverse efecte neliniare.", "IV. Stabilirea principiilor de realizare hardware și software a algoritmilor PDS (arhitectura structurii, blocurile funcționale, mijloacele software).", "V. Elaborarea mijloacelor de proiectare automată a sistemelor PDS în timp real. Rol important are modelul funcțional al procesorului; cele mai bune rezultate se obțin cu module de simulare speciale (emulatoare de procesoare specializate)."]}], "capcane": ["Prima etapă PDS pe VLSI a început în 1979 cu Intel 2920, nu cu TMS 320 (lansat aproape simultan) și nici cu AMD 29500 (bit-slice).", "Liderul de piață este Texas Instruments (57%), nu Motorola sau AT&T (13% fiecare), NEC (8%) ori Analog Devices (6%).", "Cerința din curs este un volum mare de operații aritmetice și logice SIMPLE, nu complexe. Semnalele de intrare sunt „în multe cazuri” analogice, de aici nevoia de A/D și D/A integrate.", "Harvard = memorii SEPARATE pentru coduri și date, cu căi separate, deci operanzii se transferă simultan cu extragerea codurilor. Von Neumann = o singură memorie pentru instrucțiuni și date (o variantă greșită clasică). DSP folosesc Harvard (modificată).", "Pipeline (fragmentarea activităților pe unități funcționale distincte) nu e același lucru cu Harvard (memorii și căi separate). Multe DSP le combină pe amândouă.", "Unitatea de comandă la DSP e în LOGICĂ CABLATĂ (mai puțin flexibilă, mai rapidă). Microprogramarea este la procesoarele de uz general.", "Stiva la DSP este implementată HARDWARE (stivă internă) și se poate extinde în RAM-ul de date. Varianta „implementarea software a stivei pentru salvarea rapidă a contextului” este falsă.", "Virgula mobilă are gama dinamică mai mare și simplifică proiectarea algoritmului/software-ului, dar e mai lentă, mai scumpă și are hardware mai complicat. Virgula fixă e mai ieftină, mai rapidă, cu arhitectură mai simplă, dar are gamă dinamică mică și programare mai grea. Atenție: capitolul are o greșeală de tipar („virgula fixă asigură o gamă dinamică mult mai mare decât ... virgula fixă”); corect este virgula MOBILĂ.", "Fixă = 16 biți, mobilă = 32 de biți (Capitol 1). Alternativa la virgula mobilă este „virgulă mobilă pe bloc”.", "La avantaje apare EXISTENȚA unor modele matematice pentru proiectare și analiză; „lipsa” lor este varianta falsă. Apare în schimb LIPSA problemelor legate de zgomotul surselor de alimentare. Precizia DEPINDE de precizia reprezentării interne a datelor.", "Algoritmul spune CE operații aritmetice se fac, nu și CUM sunt implementate.", "Rata de eșantionare = viteza cu care eșantioanele sunt achiziționate, prelucrate și generate. Tactul = frecvența cu care se execută operațiile elementare. Nu le inversa. Raportul rată de eșantionare/tact stabilește modul de implementare și cantitatea de hardware (crește raportul, crește hardware-ul).", "Rată de eșantionare mare înseamnă algoritmi mai SIMPLI (radar). Rată mică merge cu algoritmi complecși (modelarea vremii, modelare financiară).", "Depășirea în virgulă fixă se tratează prin saturare sau wrap around (eliminarea biților excedentari), nu prin modificarea exponentului.", "Timpul MAC: în slide „de ordinul nsec.”, în capitol „de ordinul a 200 nsec.”. TFR-ul de referință e de regulă în 1024 de puncte.", "DSP în general NU au cache de date; unele au un cache mic de instrucțiuni pentru bucle. La DSP programatorul controlează explicit memoria internă; la PUG cache-ul e gestionat automat, transparent.", "TMS 320 (TI) are, în locul convertoarelor A/D și D/A, controlere pentru întreruperi.", "Metodele de programare la îndemâna utilizatorului sunt două: la nivel de blocuri și bazată pe meniuri. „Seturile PDS” (circuit sau plachetă + software) sunt răspunsul la dificultatea de utilizare.", "Cele trei categorii de aplicații: sisteme dedicate ieftine (cele mai numeroase; contează costul și integrarea), înaltă performanță (sonar, seismic, puține produse, multiprocesor) și multimedia pe PC.", "Numerotarea diferă: în slide-uri 1.2 e „procesoare PDS” și 1.3 „sisteme PDS”; în capitol 1.1 e „procesoare”, 1.2 „sisteme”, 1.3 „folosirea”, 1.4 „problematica proiectării”."], "esential": ["Lider de piață: **Texas Instruments** (57%), apoi AT&T, Motorola, NEC, Analog Devices. Prima etapă VLSI: 1979, Intel 2920.", "**Cerințe funcționale generale:** viteză mare de prelucrare (timp real); volum mare de operații aritmetice și logice simple și repetitive; precizie mare; suport pentru CAD/CNA rapide (semnalele de intrare sunt analogice).", "**Caracteristici:** paralelism mare + pipeline (multe instrucțiuni într-un tact); module incluse pe cip (multiplicator hardware paralel, circuite de deplasare, memorii interne, **stivă internă hardware**); set de instrucțiuni adaptat algoritmilor PDS; interfețe rapide (seriale, paralele, DMA).", "**Arhitectura Harvard:** memorii separate pentru program și date, cu magistrale separate. Combinată cu pipeline.", "**Unitatea de comandă:** logică cablată (nu microprogramată) → mai rapidă, mai puțin flexibilă. Facilități pentru bucle, stivă, întreruperi.", "**Domenii:** telecomunicații (modemuri, radio, telefonie, transmisiuni de date), medicină, automobile, militar, multimedia. (Routerele nu apar în curs.)", "**Avantaje DSP:** timp real, universale și flexibile (se reprogramează), precizie mare, fiabilitate. Clasa cu **rate mici de eșantionare + algoritmi complecși**: modelarea vremii.", "**Caracteristici comune ale sistemelor PDS:** algoritmii, rata de eșantionare, tactul, reprezentarea numerelor.", "**Virgulă fixă:** mai ieftine, mai simple ca arhitectură. **Virgulă mobilă:** gamă dinamică mare, mai scumpe, programare mai ușoară."]}, {"curs": 2, "titlu": "Procesoare DSP. Încapsulări. Alternative.", "rezumat": [{"titlu": "2.1 Procesoare PDS – caracteristicile comune (Tabelul 2.2)", "puncte": ["Multe procesoare PDS au unele caracteristici comune pentru a putea executa activități repetitive și cu un volum mare de calcule. Cele mai importante 5 caracteristici: (1) operația rapidă de multiplicare și acumulare; (2) arhitectura multiacces a memoriei; (3) moduri de adresare specializate; (4) controlul specializat al funcționării; (5) periferice și interfețe I/O.", "Utilizarea lor (Tabelul 2.2): MAC – majoritatea algoritmilor PDS (filtrare, transformate) folosesc intensiv multiplicări; multiacces – operațiile PDS intensive în date cer citirea unei instrucțiuni și a mai multor date în fiecare ciclu instrucțiune; adresare specializată – manipularea eficientă a tablourilor de date și a bufferelor FIFO din memorie; control specializat – controlul eficient al buclelor pentru algoritmii iterativi și tratarea rapidă a întreruperilor pentru operațiile I/O frecvente; periferice pe cip (ex. convertoare A/D) – sisteme mici, cu cost redus, iar interfețele I/O adaptate perifericelor comune permit conectarea simplă la dispozitivele I/O din afara cipului.", "Tabelul 2.1 (familii comerciale): Analog Devices ADSP-21xx (virgulă fixă, 16 biți) și ADSP-210xx (virgulă mobilă, 32 biți); AT&T DSP16xx (fixă, 16) și DSP32xx (mobilă, 32); Motorola DSP5600x/DSP563xx (fixă, 24), DSP561xx (fixă, 16), DSP96002 (mobilă, 32); NEC µPD7701x (fixă, 16); Texas Instruments TMS320C1x/C2x/C2xx/C5x/C54x (fixă, 16), TMS320C3x/C4x (mobilă, 32), TMS320C8x (fixă, 8/16); Zoran ZR3800x (fixă, 20)."]}, {"titlu": "Operația rapidă de multiplicare și acumulare (MAC)", "puncte": ["Una dintre caracteristicile cele mai reprezentative ale procesoarelor PDS este posibilitatea de a executa operația de multiplicare-acumulare (MAC) într-un singur ciclu instrucțiune.", "MAC este utilă în algoritmii care necesită calculul produsului a doi vectori (de exemplu filtrarea digitală, corelația, calculul transformatei Fourier).", "Pentru aceasta procesoarele PDS includ un multiplicator și un acumulator integrate în unitatea aritmetică de prelucrare, denumită calea de date (detaliată în Cap. 4). Calea de date permite efectuarea operațiilor de multiplicare și acumulare fără a produce depășire de scală aritmetică (overflow): procesoarele PDS permit stocarea unui număr de biți suplimentari în registrele de acumulare, pentru a le adapta la dimensiunea rezultatului."]}, {"titlu": "Arhitectura multiacces a memoriei", "puncte": ["Posibilitatea de a executa câteva cicluri de acces la memorie într-un singur ciclu instrucțiune.", "Permite procesorului să extragă simultan o instrucțiune și operanzii pentru instrucțiune sau să stocheze rezultatul instrucțiunii anterioare în memorie. Este necesară o lărgime de bandă mare între memorie și procesor pentru o performanță bună (algoritmi cu operații repetitive executate intensiv cu date).", "La multe procesoare PDS accesarea multiplă într-un singur ciclu este restricționată: în mod curent toate locațiile accesate sunt localizate în cip, iar accesarea multiplă poate fi executată doar cu anumite instrucțiuni.", "Pentru accesarea simultană a mai multor locații procesoarele PDS posedă: magistrale interne multiple, memorii interne multicip și, în unele situații, mai multe bancuri de memorie independente (arhitectura memoriei – Cap. 5)."]}, {"titlu": "Moduri de adresare specializate", "puncte": ["Pentru a executa operațiile cu viteză maximă și pentru a permite specificarea operanzilor multipli cu ajutorul unor cuvinte instrucțiune scurte, procesoarele PDS conțin unități dedicate pentru adresare. Odată configurați registrele pentru adresare, unitatea de generare a adresei lucrează în background, calculând adresele operanzilor în paralel cu executarea operațiilor aritmetice.", "Cel mai comun mod adaptat aplicațiilor PDS este adresarea indirectă cu post-incrementare, folosită la operații repetitive pe șiruri de date stocate la adrese succesive în memorie.", "Moduri speciale: adresarea circulară (modulo) – simplifică accesarea bufferelor de date; adresarea cu inversarea biților (la unele procesoare) – utilizată în calculul Transformatei Fourier Rapide (TFR). Detalii în Cap. 6."]}, {"titlu": "Controlul specializat al funcționării", "puncte": ["Pentru că mulți algoritmi PDS implică calcule repetitive, unele procesoare PDS oferă un suport eficient pentru executarea buclelor. Deseori există o instrucțiune de buclare sau o instrucțiune „repeat” care permite implementarea ciclurilor for-next fără mărirea ciclului instrucțiune prin actualizarea și testarea contorului de buclă sau prin saltul înapoi la începutul buclei.", "Alte facilități de comandă pentru îmbunătățirea performanțelor: comutarea rapidă a contextului și latența redusă, executarea întreruperilor cu încărcare minimă, executarea rapidă a operațiilor de intrare-ieșire."]}, {"titlu": "Periferice și interfețe I/O", "puncte": ["Pentru cost redus și performanțe I/O înalte, multe procesoare PDS încorporează una sau mai multe interfețe I/O seriale și/sau paralele, precum și mecanisme speciale pentru I/O, cum ar fi accesul direct la memorie (DMA). Interfețele cu perifericele sunt proiectate deseori pentru interfațarea directă cu perifericele I/O comune, cum ar fi convertoarele A/D și D/A.", "Odată cu creșterea densității de integrare și a flexibilității, producătorii au început să includă în procesor nu numai interfețe noi, ci și dispozitive periferice complete (ex.: circuitele pentru telefoanele celulare au convertoare A/D și D/A în cip)."]}, {"titlu": "2.2 Variante constructive de procesoare PDS", "puncte": ["Varianta cea mai comună de microprocesor PDS este procesorul single-cip.", "Proliferarea aplicațiilor PDS, creșterea nivelului de integrare pentru toate produsele electronice și dezvoltarea unor noi tehnici de încapsulare au făcut ca procesoarele PDS să fie disponibile în multe variante constructive.", "Cele 6 variante constructive: module multicip (MCM), cipuri multiprocesor, seturi de circuite, nuclee PDS, procesoare PDS personalizate, multiprocesoarele."]}, {"titlu": "Module multicip (MCM)", "puncte": ["MCM sunt un fel de „supercipuri”: în loc de a încapsula un singur circuit integrat într-o capsulă din plastic sau ceramică (ca la procesoarele convenționale), un MCM conține mai multe cipuri încapsulate împreună.", "Primul avantaj: densitate mare de încapsulare (mai multe circuite pe unitatea de suprafață a plăcii de circuit imprimat), ceea ce duce la creșterea vitezei de operare și la scăderea consumului. Exemplu: Texas Instruments – MCM cu două procesoare TMS320C40 și 128 kcuvinte de 32 de biți de memorie SRAM."]}, {"titlu": "Cipuri multiprocesor", "puncte": ["Proiectanții încorporează mai multe procesoare într-un singur circuit integrat, pentru mai multe facilități și performanțe într-un procesor single-cip.", "Exemple: Motorola și Zilog – un microprocesor și un microcontroler într-un singur cip (combinație foarte întâlnită); Siemens – circuitul TriCore, care conține un procesor de uz general, un procesor PDS și un microcontroler. Ca și MCM, cipurile multiprocesor asigură creșterea performanțelor și reduc consumul față de sistemele realizate cu componente separate; totuși oferta este limitată la câteva dispozitive."]}, {"titlu": "Seturi de circuite", "puncte": ["Un procesor PDS este „împărțit” în două sau mai multe capsule separate (ex.: Butterfly PDS – generatorul de adrese LH9320 și procesorul LH9124, vândut și de Sharp Microelectronics).", "Divizarea funcțională este justificată când procesorul este foarte complex și numărul de pini de intrare/ieșire este foarte mare și nu poate fi asigurat de o singură capsulă.", "Avantaje: se pot folosi capsule mai ieftine, deci se reduce prețul de cost; crește flexibilitatea – proiectantul combină circuitele individuale în configurația cea mai potrivită aplicației. La setul Butterfly se pot folosi mai multe generatoare de adrese cu un singur procesor; rezultă un procesor cu opt magistrale externe de 24 de biți, mult mai mult decât oferă capsula unui procesor single-cip."]}, {"titlu": "Nuclee PDS", "puncte": ["Abordare pentru producția de masă: împerecherea într-un singur cip a unui procesor PDS programabil cu un circuit definit de utilizator. Combină beneficiile procesoarelor PDS (programabilitatea, existența instrumentelor de dezvoltare și a bibliotecilor de software) cu avantajele circuitelor realizate la cerere (costuri reduse de producție, gabarit redus, putere consumată redusă).", "Două variante: un ASIC (application-specific integrated circuit) având la bază un nucleu PDS și un procesor PDS realizat la cerere.", "Definiție: un nucleu PDS este un procesor PDS destinat folosirii ca bloc de construcție la realizarea unui circuit mai complex, în loc de a fi încapsulat de sine stătător într-un cip. Un ASIC bazat pe nucleu PDS permite integrarea într-un singur circuit integrat a unui PDS programabil, a logicii de interfață, a perifericelor, a memoriei și a altor componente cerute de client (Fig. 2.1, 2.2).", "Firmele definesc diferit ce include un nucleu: Texas Instruments – procesor, memorie și periferice; Clarkspur Design și PDS Group – memorie, dar nu și periferice; SGS-Thomson – numai procesorul.", "Două categorii de furnizori: (1) furnizorii care asigură și producerea circuitului ASIC cu nucleul PDS (Texas Instruments, SGS-Thomson); (2) furnizorii care dau licența pentru nucleu, iar clientul își alege singur fabricantul (PDS Group, Clarkspur Design, Infinite Solutions, Tensleep Design, TCSI, 3Soft).", "TI TEC320C52 (volume mici): procesorul de 16 biți TMS320C52 + o arie de 15.000 de porți; „nucleele PDS completate cu arie de porți” ieftinesc costul de proiectare și de producție și scurtează ciclul de fabricație. SGS-Thomson oferă nucleul de 16 biți D950-CORE ca macrocelulă în biblioteca ASIC. La nucleele sub licență clientul primește descrierea completă a nucleului, îl poate produce unde vrea și îl poate modifica; deseori sunt disponibile descrieri VHDL sau Verilog HDL."]}, {"titlu": "Procesoare PDS personalizate", "puncte": ["În unele situații nucleul PDS însuși trebuie modificat sau extins (alternativă la adăugarea de circuite externe în jurul nucleului), ex.: o unitate pentru corecția erorilor de codare sau pentru manipularea biților adăugată la calea de date; aceste procesoare se numesc „customizabile” sau personalizate. Furnizorii folosesc termenul de nucleu diferit: de la posibilitatea de a adăuga periferice și memorie până la posibilitatea de a modifica chiar unitatea de execuție a procesorului.", "Limitările nucleelor PDS: (1) la nucleele produse chiar de furnizor cumpărătorul nu are acces la proiectul intern, deci toate modificările le face furnizorul, soluție deseori costisitoare; (2) la nucleele cu licență proiectul intern e disponibil clientului, dar e nevoie de experiență pentru modificări; (3) modificarea arhitecturii nucleului impune și modificarea instrumentelor de dezvoltare software (asamblor, linker, simulator etc.).", "Cele mai bine plasate firme: AT&T Microelectronics (nucleul DSP1600, proiectat pentru atașarea facilă a unor noi unități de execuție la calea de date) și Philips (nucleul EPICS, cu versiuni de diferite lungimi ale cuvintelor)."]}, {"titlu": "Multiprocesoarele", "puncte": ["Oricât de performante devin procesoarele PDS, nevoile unei clase largi de aplicații nu pot fi satisfăcute de un singur procesor; unele aplicații se realizează cel mai bine cu procesoare dedicate. Dacă programabilitatea este importantă, o soluție bună sunt sistemele multiprocesor cu procesoare comerciale (aproape orice procesor comercial poate fi utilizat în configurații multiprocesor).", "Procesoare speciale pentru multiprocesor: TMS320C4x (Texas Instruments), DSP96002 (Motorola), ADSP-2106x (Analog Devices); au facilități suplimentare – magistrale externe multiple, logică de arbitraj a magistralei, porturi multiple dedicate pentru comunicații interprocesor – care simplifică proiectarea hardware și îmbunătățesc performanțele."]}, {"titlu": "2.3 Alternative pentru procesoarele PDS", "puncte": ["Cele 3 alternative: microprocesoarele de uz general; calculatoarele personale și stațiile de lucru; hardware-ul personalizat (realizat la cererea clientului)."]}, {"titlu": "Microprocesoarele de uz general", "puncte": ["Devenind mai rapide, pot realiza și funcțiuni de prelucrare a semnalelor, deși sunt mai lente și mai puțin eficiente decât procesoarele PDS pentru aplicații PDS.", "Motivul 1: multe produse electronice (de la telefoane la controlere pentru automobile) folosesc deja microprocesoare pentru control, interfața cu utilizatorul și comunicare; adăugarea aplicației PDS pe microprocesorul existent este avantajoasă din punct de vedere al costului.", "Motivul 2: instrumentele software de dezvoltare existente pentru microprocesoarele de uz general sunt în general mai sofisticate și mai puternice decât cele pentru PDS – important pentru aplicațiile la care performanțele nu sunt foarte stricte.", "Tendință: procesoarele de uz general primesc caracteristici PDS – PowerPC 601, MIPS R10000, Sun UltraSPARC, HP PA-7100LC execută MAC în virgulă mobilă într-un singur ciclu instrucțiune; Intel a realizat un Pentium cu facilități pentru operații PDS. Nu este încă clar dacă procesoarele hibride sau perechea uz general + PDS separat vor deveni abordarea comună; se așteaptă ca aplicațiile cu o cantitate semnificativă de operații PDS să fie realizate cu procesoare PDS specializate."]}, {"titlu": "Calculatoare personale și stații de lucru", "puncte": ["Unele aplicații PDS pot fi implementate direct pe calculatoare sau stații de lucru fără procesoare PDS (au calitățile și limitările procesoarelor de uz general). Prelucrările PDS executate numai software sunt viabile acolo unde cerințele nu sunt stricte și unde există deja un PC sau o stație de lucru; ex.: aplicații științifice sau inginerești de analiză sau sinteză fără restricții de timp real.", "Intel NSP (native signal processing): folosirea procesorului gazdă din PC pentru aplicații multimedia de bază (compresia/decompresia audio, sinteza muzicii și a sunetelor); avantaj – reducerea costului prin eliminarea unor componente hardware complexe.", "Tendință: producătorii de PC-uri și stații adaugă facilități PDS – procesoare PDS pe plăcile de bază sau periferice ca convertoare A/D și D/A ori interfețe pentru linia telefonică."]}, {"titlu": "Hardware personalizat (la cerere / custom)", "puncte": ["Două rațiuni pentru care hardware-ul la cerere e uneori mai bun decât un procesor PDS: performanțele și prețul de producție. Practic pentru orice aplicație se poate proiecta hardware la cerere cu performanțe mai bune decât un PDS comercial; în aplicațiile care cer o frecvență de eșantionare mare, hardware-ul la cerere este unica opțiune.", "Pentru produse de masă este mai puțin costisitor: plasează în hardware numai funcțiunile necesare aplicației, în timp ce la un procesor PDS se plătește de fiecare dată pentru toate funcțiunile, chiar dacă unele sunt foarte puțin folosite. Dificultăți: cele mai evidente sunt costurile proiectării, în special pentru cipurile realizate la cerere.", "Forme: de la o mică placă de circuit imprimat cu câteva componente până la un sistem complex cu circuite integrate la cerere; abordare comună – plăci care includ dispozitive logice standard, unități aritmetice cu funcții fixe sau configurabile, arii de porți FPGA și FASIC (circuite pentru funcții specifice). FASIC = circuit proiectat pentru a realiza o funcție specifică, probabil pentru o singură aplicație (ex.: filtru digital configurabil; circuite modem-faximil, care nu pot fi folosite în alt scop).", "Multe circuite oferite pentru aplicații PDS sunt procesoare PDS standard cu programe la cerere stocate în ROM (ex.: modemurile Phylon pe procesoare Analog Devices și TI; Rockwell – arhitecturi proprii).", "Proiectarea circuitului propriu asigură maximum de flexibilitate, fiind adaptat nevoilor aplicației până la nivelul fiecărei porți logice."]}], "capcane": ["MAC se execută într-un SINGUR ciclu instrucțiune; o variantă care spune că procesoarele PDS „nu permit multiplicare-acumulare în același ciclu” e falsă.", "Multiacces = MAI MULTE accesări la memorie într-un singur ciclu instrucțiune, nu o singură accesare în mai multe cicluri.", "Accesarea multiplă e restricționată: locațiile sunt de regulă în cip și doar anumite instrucțiuni o pot face; nu e valabilă pentru orice instrucțiune sau pentru memoria externă.", "Biții suplimentari pentru evitarea overflow-ului la MAC sunt în registrele de ACUMULARE (calea de date), nu în unitatea de adresare.", "Cel mai comun mod de adresare specializat este adresarea indirectă cu post-incrementare; circulară (modulo) = buffere de date; inversarea biților = TFR. Nu le încurca.", "Unitatea de generare a adreselor lucrează în background, în paralel cu operațiile aritmetice, după ce registrele de adresare au fost configurate.", "Instrucțiunea de buclare/„repeat” implementează for-next FĂRĂ mărirea ciclului instrucțiune (nu cu cicluri în plus pentru testarea contorului).", "Varianta constructivă cea mai comună este procesorul single-cip, nu MCM-ul sau nucleul PDS.", "MCM = mai multe CIPURI într-o singură capsulă; cipuri multiprocesor = mai multe PROCESOARE într-un singur circuit integrat; seturi de circuite = UN procesor împărțit în mai multe capsule.", "Microprocesor + microcontroler într-un cip (Motorola, Zilog) și TriCore (Siemens: uz general + PDS + microcontroler) sunt exemple de cipuri multiprocesor, nu de MCM.", "Avantajul MCM este densitatea mare de încapsulare → viteză mai mare și consum mai mic; seturile de circuite reduc prețul prin capsule mai ieftine și dau mai mulți pini, nu mai puțini.", "La nuclee PDS: programabilitatea, instrumentele de dezvoltare și bibliotecile sunt beneficiile procesoarelor PDS; costul redus de producție, gabaritul redus și puterea redusă sunt avantajele circuitelor la cerere.", "Nucleu produs de furnizor → clientul NU are acces la proiectul intern (modificări costisitoare, făcute de furnizor); nucleu cu licență → are acces, dar îi trebuie experiență. TI și SGS-Thomson produc ei ASIC-ul; PDS Group, Clarkspur, 3Soft etc. dau licență.", "Microprocesoarele de uz general sunt mai LENTE și mai puțin eficiente pentru PDS; avantajele lor sunt costul (procesorul există deja în produs) și instrumentele software mai sofisticate.", "Prelucrarea numai software pe PC/stație de lucru e viabilă doar pentru cerințe nestricte, fără timp real; la frecvențe de eșantionare mari singura opțiune e hardware-ul la cerere.", "Rațiunile hardware-ului la cerere sunt performanțele și prețul de producție (la produse de masă); dezavantajul cel mai evident este costul proiectării, nu prețul de producție.", "Modulele multicip, nucleele și multiprocesoarele sunt VARIANTE CONSTRUCTIVE (2.2); microprocesoarele de uz general, PC-urile/stațiile și hardware-ul personalizat sunt ALTERNATIVE (2.3)."], "esential": ["**Cele 5 caracteristici comune:** MAC într-un singur ciclu instrucțiune; arhitectura multiacces a memoriei; moduri de adresare specializate; control specializat al funcționării (bucle); periferice și interfețe I/O pe cip.", "**MAC** = multiplicare + acumulare într-un ciclu, utilă la **produsul a doi vectori** (filtrare, corelație, Fourier). Pentru a evita depășirea: acumulator cu **biți de gardă**.", "**Multiacces:** mai multe accesări ale memoriei **într-un singur ciclu instrucțiune** (instrucțiunea + operanzii simultan). Prin magistrale multiple, memorii multiport, bancuri separate. Restricție: de obicei doar memorie pe cip.", "**Adresare specializată:** cea mai comună e **indirectă cu post-incrementare**; speciale: **modulo (circulară)** și **inversarea biților** (FFT).", "**Control specializat:** bucle hardware (instrucțiune de buclă, fără test explicit), întreruperi rapide, comutare rapidă de context.", "**Varianta cea mai comună:** procesorul **single-cip**. **Cele 6 variante constructive:** module multicip (MCM), cipuri multiprocesor, seturi de circuite, nuclee PDS, procesoare personalizate, multiprocesoare.", "**Cipuri multiprocesor** = mai multe procesoare într-un cip (ex. microprocesor + microcontroler: Motorola, Zilog; TriCore Siemens). **Seturi de circuite** = un DSP împărțit în mai multe capsule (Butterfly).", "**Nucleu PDS** = DSP folosit ca bloc de construcție într-un circuit mai mare (ASIC), nu încapsulat separat.", "**Cele 3 alternative:** microprocesoarele de uz general; PC-urile și stațiile de lucru; hardware-ul personalizat (la cerere)."]}, {"curs": 3, "titlu": "Reprezentarea numerelor. Aritmetici.", "rezumat": [{"titlu": "Introducere (Capitol 3, Fig. 3.1)", "puncte": ["Una dintre cele mai importante caracteristici care determină disponibilitatea unui procesor DSP pentru o aplicație este tipul de reprezentare numerică binară folosită de procesor.", "Fig. 3.1 – reprezentări uzuale la DSP-urile comerciale: virgulă fixă pe 16, 20 sau 24 de biți; virgulă mobilă pe 32 de biți (IEEE 754 sau alt format)."]}, {"titlu": "3.1 Virgula fixă (aritmetică întreagă și fracționară)", "puncte": ["Primele procesoare DSP au folosit aritmetica în virgulă fixă; procesoarele DSP cu virgulă fixă încă sunt utilizate (capitolul: „încă sunt dominante”).", "În procesoarele cu virgulă fixă numerele sunt reprezentate fie ca întregi (aritmetica întreagă), fie ca fracții cu valoarea între –1,0 și +1,0 (aritmetica fracționară).", "Algoritmii și hardware-ul utilizate pentru aritmetica fracționară sunt virtual identici cu cei pentru aritmetica cu întregi; principala diferență este modul în care sunt manipulate rezultatele operațiilor de multiplicare.", "În practică, (majoritatea) procesoarelor DSP cu virgulă fixă suportă atât aritmetica fracționară, cât și cea cu întregi: prima e mai folositoare pentru algoritmii de procesare a semnalului, a doua pentru operații de control, calculul adreselor și alte operații fără legătură cu semnalele.", "Folosind aritmetica cu întregi pe un DSP cu virgulă fixă, uneori calculele consumă mai mult timp sau sunt supuse unor constrângeri decât cu aritmetica fracționară.", "Complement față de 2: întreg pe 8 biți – ponderi –2^7, 2^6, …, 2^0 (ex. 01010011 = 83; 10101100 = –84); fracționar pe 8 biți – ponderi –2^0, 2^-1, …, 2^-7, virgula după bitul de semn (ex. 01010000 = 0,625).", "Domenii (calcul derivat): întreg pe N biți: –2^(N-1) … 2^(N-1)–1 (16 biți: –32768 … 32767); fracționar pe N biți: –1 … 1–2^-(N-1), pas 2^-(N-1) (8 biți: –1 … 0,9921875; 16 biți „Q15”: –1 … 1–2^-15); +1,0 nu se poate reprezenta exact."]}, {"titlu": "3.1 Virgula mobilă", "puncte": ["Altă clasă de procesoare DSP folosește aritmetica cu virgulă mobilă, unde numerele sunt reprezentate prin mantisă și exponent.", "Mantisa este de obicei valoarea fracționară a semnalului; exponentul este un întreg care reprezintă numărul de ranguri binare cu care virgula mantisei trebuie deplasată la stânga sau la dreapta pentru a obține valoarea numărului inițial. Valoarea: valoare = mantisa × 2^exponent (în cursul 1: N = M × 2^E).", "Format din exemple: întâi mantisa (fracționară, complement față de 2, bitul de semn are ponderea –2^0), apoi exponentul (întreg, complement față de 2). Ex. (mantisă 10 biți, exponent 6 biți): 0110100000 000011 = 0,8125 × 2^3 = 6,5; 0100000000 111110 = 0,5 × 2^-2 = 0,125; 1110100000 000011 = –0,1875 × 2^3 = –1,5; 1100000000 111110 = –0,5 × 2^-2 = –0,125.", "În general, procesoarele cu virgulă mobilă acceptă și date cu virgulă fixă (de obicei întregi), necesare pentru operații cu date inerent întregi, cum ar fi adresele memoriei.", "Aritmetica cu virgulă mobilă este un mecanism mai flexibil și mai general decât cea cu virgulă fixă: acces la o gamă dinamică mai largă și, în multe cazuri, la o precizie mai bună."]}, {"titlu": "3.1 Precizia", "puncte": ["Definiția preciziei este bazată pe ideea erorii de cuantizare = eroarea numerică introdusă atunci când un format de număr mai lung (cu mai mulți biți) este convertit la unul mai scurt (ex. 1,325 rotunjit la 1,33 → eroare 0,005).", "Cu cât eroarea de cuantizare posibilă este mai mare față de mărimea valorii reprezentate, cu atât precizia este mai mică.", "Virgulă fixă: precizia maximă posibilă = numărul de biți din format; Precizia maximă [biți] = log2(|valoarea maximă| / |eroarea maximă de cuantizare|). Ex. fracționar pe 16 biți: log2(1/2^-16) = 16 biți.", "Dacă data are o mărime mai mică decât cea maximă, precizia obținută e mai mică decât precizia maximă – de aici importanța scalării atente a semnalului în virgulă fixă (scalarea: cap. 4).", "Virgulă mobilă: precizia maximă posibilă = numărul de biți din mantisă; procesoarele cu virgulă mobilă mențin o precizie foarte bună fără efort suplimentar din partea programatorului; în teorie alegerea fixă/mobilă e independentă de precizie, în practică virgula mobilă asigură o precizie mai înaltă."]}, {"titlu": "3.1 Gama dinamică", "puncte": ["Gama dinamică = raportul dintre cel mai mare și cel mai mic număr reprezentabil într-un anumit format de date; aici formatele cu virgulă mobilă au avantajul major.", "Virgulă fixă fracționară pe 32 de biți: minim 2^-31, maxim 1,0 – 2^-31 → gama dinamică ≈ 2,15 × 10^9 ≈ 187 dB.", "Virgulă mobilă pe 32 de biți (mantisă 24 biți, exponent 8 biți): de la ≈ 5,88 × 10^-39 la 3,40 × 10^38 → gama dinamică ≈ 5,79 × 10^76, peste 1535 dB; cu același număr de biți, virgula mobilă dă o gamă dinamică mult mai mare.", "În dB: 20·log10(raport). Pentru N biți în virgulă fixă raportul ≈ 2^(N-1) → ≈ 6,02·(N–1) dB (16 biți ≈ 90 dB, 24 biți ≈ 138 dB, 32 biți ≈ 187 dB).", "Gama dinamică = interval de amplitudini ale semnalului care pot fi prelucrate menținând o fidelitate suficient de mare; aplicații diferite au nevoie de game diferite: telecomunicații ≈ 50 dB, audio de înaltă fidelitate ≈ 90 dB; o gamă mai mare decât minimul degrevează programatorul de o parte din problemele de scalare."]}, {"titlu": "3.1 Cost, programare, alegerea procesorului", "puncte": ["Procesoarele DSP cu virgulă mobilă sunt în general mai scumpe decât cele cu virgulă fixă, dar mai ușor de programat.", "Costul ridicat: circuit mai complex → cip mai mare; lungimea mai mare a cuvintelor cere magistrale externe și memorii externe mai mari → crește costul total al sistemului.", "Ușurința programării în virgulă mobilă: programatorul e degrevat de controlul gamei dinamice și al preciziei; la virgulă fixă trebuie să fie atent la scalarea datelor în diverse stadii ale programului.", "Deși virgula mobilă oferă performanțe superioare, din cauza dificultăților de implementare potențialul ei nu este deplin valorificat – doar prin arhitecturi complet paralele combinate cu logică combinațională pipeline.", "Cea mai mare parte a aplicațiilor dedicate folosesc procesoare cu virgulă fixă, pentru că prioritatea este costul scăzut (gama dinamică și precizia se stabilesc analitic sau prin simulare, apoi se adaugă scalare în cod). Virgula mobilă e mai potrivită pentru aplicații mai puțin sensibile la cost, cu cerințe stricte de gamă dinamică și precizie, sau unde programarea mai ușoară e mai importantă."]}, {"titlu": "3.2 Lărgimea nativă a cuvintelor pentru date", "puncte": ["Lungimea nativă a cuvintelor de date = lungimea datelor pe care magistralele procesorului și calea de date le pot manipula într-un singur ciclu instrucțiune.", "DSP-uri cu virgulă mobilă uzuale: 32 de biți (slide: 32 sau 64 de biți); virgulă fixă: cea mai folosită 16 biți; DSP5600x/DSP563xx (Motorola) 24 biți; ZR3800x (Zoran) 20 biți; nucleul CD2450 (Clarkspur Design) permite orice mărime între 16 și 24 de biți.", "Mărimea cuvintelor are impact major asupra costului: influențează mărimea cipului, numărul de pini ai capsulei (package pins) și mărimea și numărul dispozitivelor de memorie externă; de aceea se alege cea mai mică lungime acceptată de aplicație.", "La alegerea fixă/mobilă există adesea un compromis (trade-off) între mărimea cuvântului și creșterea complexității: o aplicație ce pare să ceară 24 de biți poate fi făcută uneori pe 16 biți, cu algoritmi și/sau programare mai complexe."]}, {"titlu": "3.3 Precizia extinsă", "puncte": ["Precizia extinsă = folosirea reprezentărilor care asigură o precizie mai mare decât cea oferită de formatul de date nativ al procesorului.", "Se obține în două moduri: (1) suport încorporat pentru un format cu precizie extinsă pentru operații care au loc exclusiv în interiorul căii de date (fără transfer de date intermediare la/de la memorie; rotunjire finală la stocarea în memorie); (2) construirea unor cuvinte mai mari din secvențe de cuvinte de date native (ex. pe 16 biți se leagă perechi → cuvinte pe 32 de biți).", "Fiecare operație în precizie extinsă necesită o secvență de instrucțiuni în precizie simplă → aritmetica cu precizie extinsă este mult mai lentă decât precizia simplă.", "Suport hardware la unele procesoare: păstrarea bitului de transport (carry) de la o adunare în precizie simplă pentru o adunare ulterioară; considerarea operanzilor multiplicării cu sau fără semn, sub controlul programului.", "Dacă doar o mică secțiune a codului cere precizie mai mare → folosire selectivă a preciziei extinse; dacă cea mai mare parte a aplicației cere precizie ridicată → un procesor cu lungime nativă mai mare a datelor."]}, {"titlu": "3.4 Emularea virgulei mobile și virgula mobilă pe bloc", "puncte": ["Pe un procesor cu virgulă fixă se pot obține precizia și gama dinamică ale aritmeticii de precizie extinsă prin rutine software care emulează comportamentul unui procesor cu virgulă mobilă.", "Unii producători furnizează o bibliotecă de rutine de emulare a virgulei mobile; dacă nu există, rutinele trebuie scrise de utilizator.", "Rutinele de emulare sunt foarte scumpe în număr de tacte → emularea e potrivită doar dacă o parte foarte mică a calculelor implică virgula mobilă; altfel se alege un procesor cu virgulă mobilă.", "Virgula mobilă pe bloc (block floating point): un grup de numere cu mantise diferite, dar un singur exponent, tratat ca un bloc de date; exponentul comun este înmagazinat într-un cuvânt de date separat (nu în fiecare cuvânt). Ex.: bloc de 8 valori → 9 locații de memorie (8 mantise + 1 exponent).", "Exponentul blocului e determinat de elementul cu cea mai mare magnitudine: valori mici → deplasate (ex. 7 poziții) la stânga → exponent negativ relativ mare; valori mari → deplasare mică/nulă → exponent negativ mic sau nul; dacă data nu poate fi deplasată, precizia este aceeași ca în formatul nativ în virgulă fixă. Ex.: ieșiri pe 32 de biți → mantise pe 16 biți + exponent pe 4 biți per bloc.", "Conversia între formatul nativ în virgulă fixă și virgula mobilă pe bloc este executată de programator prin software; unele procesoare au hardware specializat – cea mai cunoscută: instrucțiunea de „detecție a exponentului”, care calculează deplasarea necesară pentru a converti un rezultat intermediar de precizie înaltă (ex. din acumulator) în virgulă mobilă pe bloc.", "TMS320C54 (TI): instrucțiunea EXP calculează exponentul unei date; instrucțiunea NORM separă mantisa de exponent după ce a fost executată EXP."]}, {"titlu": "3.5 Standardul IEEE 754 (Capitol 3)", "puncte": ["1985, IEEE: standardul IEEE-754 definește formatele standard pentru virgulă mobilă și reguli pentru aritmetică (algoritmii de rotunjire, tratarea excepțiilor: împărțire la zero, depășire).", "Două formate de bază (conform cursului): precizie simplă pe 32 de biți – 24 biți mantisă, 8 biți exponent; precizie dublă pe 64 de biți – 52 biți mantisă, 12 biți exponent; mantisa și exponentul sunt numere cu semn.", "DSP96002 (Motorola): suport hardware pentru precizie simplă IEEE-754; ADSP-210xx (Analog Devices): suport aproape complet; DSP32xx (AT&T) nu respectă standardul, dar are hardware pentru conversia rapidă între formatul intern și IEEE-754. Fără hardware de conversie, un DSP neconform folosește rutine software de conversie, care pot consuma timp."]}, {"titlu": "3.5 (slide) / 3.6 (capitol) Relația între mărimea cuvintelor de date și de instrucțiuni", "puncte": ["Majoritatea DSP-urilor folosesc cuvinte de instrucțiune de lungime egală cu cuvintele de date, dar există și excepții: ADSP-21xx (Analog Devices) și MDSP2780 (IBM) – date pe 16 biți, instrucțiuni pe 24 biți; ZR3800x (Zoran) – date pe 20 biți, instrucțiuni pe 32 biți.", "Procesoarele cu mărimi diferite permit în general stocarea datelor în memoria de program (ex. 16 biți dintr-o locație de 24 biți), dar nu e cel mai eficient mod de folosire a memoriei: o parte importantă din memoria de program este irosită, cu impact asupra costului total al sistemului."]}], "capcane": ["Principala diferență între aritmetica întreagă și cea fracționară (virgulă fixă) este modul de manipulare a rezultatelor multiplicărilor – NU complexitatea hardware (algoritmii și hardware-ul sunt virtual identici), nici pinii sau memoria externă.", "Emularea virgulei mobile CREȘTE atât precizia, cât și gama dinamică (nu reduce niciuna), dar e foarte lentă (multe tacte) → doar când o parte foarte mică a calculelor e în virgulă mobilă.", "Virgula mobilă pe bloc = ACELAȘI exponent, mantise DIFERITE (nu invers); exponentul comun stă într-un cuvânt separat; 8 valori → 9 locații.", "Virgula fixă: mai ieftină, arhitectură mai puțin complexă, dar gamă dinamică mai mică și programare mai grea (scalare). Virgula mobilă: mai scumpă, gamă dinamică mai mare, programare mai ușoară. Nu inversa avantajele!", "Gama dinamică este un RAPORT (cel mai mare / cel mai mic număr reprezentabil), nu o diferență; în dB: 20·log10(raport).", "Precizia maximă în virgulă mobilă = numărul de biți ai MANTISEI (nu ai exponentului); în virgulă fixă = numărul de biți ai formatului.", "Cu cât eroarea de cuantizare e mai MARE față de valoare, cu atât precizia e mai MICĂ; o dată mică (nescalată) are precizie sub cea maximă.", "Precizia extinsă este mult mai LENTĂ decât precizia simplă (secvență de instrucțiuni simple pentru fiecare operație).", "Procesoarele cu virgulă mobilă acceptă și date în virgulă fixă (de obicei întregi), pentru adrese de memorie – nu sunt „doar virgulă mobilă”.", "Fracționar în complement față de 2: intervalul e [–1, 1–2^-(N-1)]; –1 se reprezintă exact, +1 NU. Cursul spune simplu „între –1,0 și +1,0”, iar grilele dau „[–1, 1]” ca variantă corectă.", "Primele DSP-uri au fost în virgulă FIXĂ (nu mobilă), iar cea mai mare parte a aplicațiilor dedicate folosesc virgulă fixă (cost scăzut).", "Lungimi native: virgulă mobilă 32 biți (slide: 32 sau 64); virgulă fixă cel mai des 16; Motorola DSP5600x/563xx = 24; Zoran ZR3800x = 20 (instrucțiuni 32); ADSP-21xx și MDSP2780 = date 16, instrucțiuni 24.", "IEEE-754 conform cursului: simplă 32 = 24 mantisă + 8 exponent; dublă 64 = 52 mantisă + 12 exponent (răspunde cu cifrele din curs, chiar dacă alte surse dau 11 biți de exponent).", "Detecția exponentului (și EXP/NORM la TMS320C54) servește la virgula mobilă PE BLOC, nu la IEEE-754.", "Numerotare: în slide-uri 3.5 = relația cuvinte date/instrucțiuni; în capitol 3.5 = IEEE 754, iar 3.6 = relația date/instrucțiuni.", "Capitolul spune că formatul pe 32 de biți cu mantisă de 24 biți „furnizează o precizie de 16 biți” – formulare confuză; după definiție, precizia maximă = numărul de biți ai mantisei (24). Dacă apare, alege varianta conformă definiției.", "Citire numere în virgulă mobilă: întâi mantisa (bit de semn cu ponderea –1, apoi 1/2, 1/4…), apoi exponentul (MSB cu pondere negativă). Nu interpreta biții ca număr fără semn."], "esential": ["Virgulă fixă: numere **întregi** (aritmetică întreagă) sau **fracții între −1 și 1** (aritmetică fracționară). Același hardware; **diferența principală = modul de manipulare a rezultatului înmulțirii**. Majoritatea DSP cu virgulă fixă suportă ambele.", "Virgulă mobilă: **valoare = mantisă × 2^exponent**; mantisa e fracționară, exponentul e întreg (amândouă cu semn). Procesoarele cu virgulă mobilă acceptă și date în virgulă fixă (întregi, ex. adrese).", "**Precizia maximă = log₂(valoare maximă / eroarea maximă de cuantizare)**: la virgulă fixă = numărul de biți ai formatului; la virgulă mobilă = numărul de biți ai mantisei.", "**Gama dinamică** = cel mai mare / cel mai mic număr reprezentabil. Fix fracționar 32 biți: ≈ 2,15 × 10⁹ (≈ 187 dB). Mobil 32 biți (24 + 8): ≈ 5,79 × 10⁷⁶ (> 1535 dB). Telecom: 50 dB; audio Hi-Fi: 90 dB.", "**Virgulă mobilă** = mai scumpe, dar programare mai ușoară (fără grija scalării). **Virgulă fixă** = majoritatea aplicațiilor dedicate, pentru că prioritatea e **costul**.", "**Lungimea nativă** = ce pot manipula magistralele și calea de date într-un singur ciclu. Influențează costul (mărimea cipului, nr. de pini, memoria externă).", "**Precizia extinsă:** suport intern în calea de date SAU cuvinte mai mari construite din cuvinte native → **mult mai lentă**.", "**Emularea virgulei mobile:** rutine software (biblioteci) pe un procesor cu virgulă fixă → **crește precizia și gama dinamică**.", "**Virgulă mobilă pe bloc:** un grup de numere cu **mantise diferite și un singur exponent comun**, stocat separat. Instrucțiunea de „detecție a exponentului” ajută la conversie.", "**IEEE-754 (cum e în curs):** simplă precizie 32 biți = 24 mantisă + 8 exponent; dublă 64 biți = 52 + 12."]}, {"curs": 4, "titlu": "Calea de date", "rezumat": [{"titlu": "Introducere: ce este calea de date", "puncte": ["Calea de date (data path) a unui procesor DSP este locul din structură unde au loc operațiile de prelucrare a datelor.", "La procesoarele DSP calea de date este foarte specializată pentru a atinge performanțe înalte la execuția operațiilor cerute de algoritmii DSP: transfer de date, multiplicare și acumulare, scalare ș.a.", "Facilitățile căii de date, împreună cu arhitectura memoriei, sunt caracteristicile care diferențiază cel mai clar procesoarele DSP de alte tipuri de procesoare.", "Calea de date la DSP în virgulă mobilă este semnificativ diferită de cea de la DSP în virgulă fixă, datorită cerințelor diferite ale aritmeticilor folosite.", "Calea de date în virgulă fixă conține: multiplicator, ALU (UAL), unul sau mai multe registre de deplasare (shiftere), registre de lucru, acumulatoare și alte unități specializate. Exemplu (Fig. 4.1): DSP5600x (Motorola), virgulă fixă pe 24 de biți.", "Calea de date NU este folosită pentru calculul adreselor: DSP-urile au o unitate separată, unitatea de generare a adreselor (adresare modulo, cu inversarea biților etc.)."]}, {"titlu": "4.1 Virgulă fixă – Multiplicatorul", "puncte": ["Multiplicarea este esențială în toate aplicațiile DSP (jumătate sau chiar mai multe operații o implică), de aceea aproape toate DSP-urile au un multiplicator hardware de tip paralel care înmulțește doi operanzi de mărime nativă într-un singur ciclu instrucțiune.", "Timpul de latență = întârzierea (poate fi mai mare de un ciclu, din cauza pipeline-ului intern al multiplicatorului) de la aplicarea operanzilor la intrări până când rezultatul este disponibil. Multiplicatoarele pipeline dau un rezultat la fiecare ciclu doar la șiruri lungi de înmulțiri.", "Multiplicatorul poate fi integrat cu un sumator într-o unitate multiplicator-acumulator (DSP5600x) sau separat, cu ieșirea într-un registru de produs (DSP16xx); la variantă separată rezultatul MAC e întârziat în general cu un ciclu.", "Legea de conservare a biților: produsul a două numere în virgulă fixă pe n biți necesită 2n biți pentru a fi reprezentat fără eroare; multiplicarea în virgulă fixă produce un rezultat de două ori mai mare decât operanzii (ex. Z893xx face excepție: 16×16 → 24 biți, cu erori).", "Programatorul selectează un subset din biții de la ieșirea multiplicatorului pentru pasul următor; sau, la un șir de produse adunate, se păstrează toți biții și lungimea se reduce la final.", "Poziția virgulei în rezultatul complet depinde de poziția virgulei operanzilor. Aritmetică întreagă: ieșirea e tot un întreg, se rețin în general cei mai puțin semnificativi biți (operanzii constrânși astfel încât valoarea semnificativă să ocupe jumătatea de ordin inferior).", "Aritmetică fracționară: rezultatul complet are de două ori mai mulți biți la dreapta virgulei decât operanzii; se descarcă jumătatea cea mai puțin semnificativă, posibil prin rotunjire.", "Deosebirea dintre care parte a rezultatului multiplicării este selectată pentru pasul următor constituie diferența principală între aritmetica întreagă și cea fracționară la DSP-urile în virgulă fixă.", "Optimizare: interzicerea ca un operand să ia cea mai negativă valoare (NMAX) → rezultatul are 2n−1 biți în loc de 2n; la fracții rezultă un singur bit de semn și niciun bit întreg.", "Hardware ajutător: registrul de la ieșirea multiplicatorului (2n biți) sau acumulatorul văzut ca doi registri de n biți adresabili independent (jumătatea superioară pentru fracții, cea inferioară pentru întregi) și deplasarea automată la stânga cu un bit după multiplicare (la unele procesoare activată/dezactivată printr-un bit de mod)."]}, {"titlu": "4.1 Virgulă fixă – Regiștrii acumulator și biții de gardă", "puncte": ["Regiștrii acumulator rețin rezultate parțiale și finale ale operației de multiplicare-acumulare și ale altor operații aritmetice. Majoritatea DSP-urilor au doi sau mai mulți acumulatori; un singur acumulator devine deseori o „gâtuire” (trebuie încărcat/stocat frecvent).", "Ideal, acumulatorul este mai mare decât cuvântul de la ieșirea multiplicatorului cu câțiva biți: biții suplimentari se numesc biți de gardă și permit adunarea unui număr de valori fără riscul depășirii și fără scalarea rezultatelor intermediare.", "Un acumulator cu n biți de gardă permite adunarea a până la 2ⁿ valori fără depășirea scalei.", "Majoritatea procesoarelor au 4 sau 8 biți de gardă: DSP16xx (AT&T) – acumulator 36 biți, multiplicator 32 biți → 4 biți de gardă; ADSP-21xx (Analog Devices) – acumulator 40 biți, multiplicator 32 biți → 8 biți de gardă (DSP5600x: acumulator 56 biți, produs 48 biți).", "Fără biți de gardă, datele de intrare sau rezultatele intermediare trebuie scalate înainte de acumulare, în general prin deplasarea produsului la dreapta cu câțiva biți (TMS320C2x/C5x: deplasare automată la dreapta cu 6 biți); pierderea de precizie e mică.", "Biții de gardă oferă o flexibilitate mai mare decât scalarea produsului, pentru că păstrează precizia maximă în etapele intermediare; TMS320C1x nu are nici biți de gardă, nici scalarea produsului (limitare serioasă)."]}, {"titlu": "4.1 Virgulă fixă – UAL (ALU)", "puncte": ["ALU execută operațiile logice și aritmetice de bază într-un singur ciclu instrucțiune: adunare, scădere, incrementare, negare și operațiile logice ȘI, SAU, NU.", "ALU diferă prin mărimea cuvintelor folosite pentru operațiile logice: unele lucrează pe lărgimea completă a acumulatorului (DSP16xx – 36 biți), altele doar pe cuvinte de lărgime nativă (DSP5600x – 24 biți, deși acumulatorul are 56). Altfel operațiile logice se fac în mai multe etape: programare complicată și cicluri suplimentare.", "În unele procesoare ALU execută adunarea pentru operația de multiplicare-acumulare; în altele se folosește un sumator separat."]}, {"titlu": "4.1 Virgulă fixă – Deplasatorul (shifter)", "puncte": ["Multiplicarea și acumularea cresc numărul de biți ai rezultatelor; deplasatorul ușurează selecția setului de biți scalând (multiplicând) ieșirea cu o putere a lui doi.", "Scalarea este importantă în virgulă fixă deoarece multe operații produc expandarea sau contractarea gamei valorilor semnalelor; trebuie făcută cu grijă (depășire vs. gamă dinamică și precizie).", "Scalarea este complementară biților de gardă (ambele elimină/reduc depășirea): scalarea reduce gama rezultatelor la domeniul reprezentabil, biții de gardă dau o reprezentare intermediară cu gamă dinamică mai largă. Biții de gardă NU înlătură nevoia scalării finale (ex.: 16 biți + 4 biți de gardă → scalare cu 2⁻⁴ înainte de scrierea în memorie).", "Amplasare: adesea imediat după multiplicator și ALU; la unele între multiplicator și ALU (scalarea produsului); unele DSP au mai multe shiftere (DSP5600x – două, independente). Shiftere limitate: stânga 1 bit, dreapta 1 bit, fără deplasare; barrel shifter = deplasări cu mai multe ranguri într-un singur ciclu de tact."]}, {"titlu": "4.1 Virgulă fixă – Depășirea și saturația", "puncte": ["Depășirea de scală (overflow): la acumularea unui șir de numere (ex. filtrare) suma poate depăși valoarea maximă reprezentabilă în acumulator → se înmagazinează o valoare incorectă, posibil foarte îndepărtată de cea corectă (ex. 2 cifre: 50+45+20 → 15 în loc de 115).", "Chiar dacă acumulatorul nu intră în depășire, aceasta poate apărea la transferul în memorie, dacă acumulatorul are biți de gardă (reprezintă numere mai lungi decât o locație de memorie), sau la scalarea cu deplasatorul pentru stocare.", "Două modalități obișnuite de tratare a depășirii: (1) scalarea cu grijă a tuturor rezultatelor (risc: valori prea mici, fidelitate slabă); (2) aritmetica cu saturare: un circuit special detectează depășirea și înlocuiește valoarea eronată cu cel mai mare număr pozitiv reprezentabil (depășire pozitivă) sau cel mai mic număr negativ reprezentabil (depășire negativă).", "Rezultatul saturat este tot incorect, dar eroarea e mai mică (ex. 99 în loc de 15). Saturarea intervine automat (uneori controlată de un registru de mod) sau printr-o instrucțiune specială; unitatea hardware se numește uneori limitator."]}, {"titlu": "4.1 Virgulă fixă – Trunchierea și rotunjirea", "puncte": ["Trunchierea = descărcarea unui număr din cei mai puțin semnificativi biți (ex.: 36 → 16 biți, se descarcă cei 20 LSB). Valoarea trunchiată e întotdeauna ≤ originala; la semnale trunchierea introduce un deplasament (bias sau offset) sau o componentă continuă.", "Tehnicile de rotunjire reduc eroarea aritmetică și bias-ul introdus de reducerea preciziei; rotunjirea se face automat (registru de mod) la transferuri sau printr-o instrucțiune specială.", "Rotunjirea la valoarea cea mai apropiată (cea convențională, folosită de majoritatea DSP în virgulă fixă): numerele aflate exact la mijloc sunt întotdeauna rotunjite la valoarea mai mare; implementare: se adună jumătate din LSB-ul ieșirii, apoi se trunchiază. Introduce un bias mai mic decât trunchierea (problemă la filtre IIR și adaptive), dar e ușor de implementat.", "Rotunjirea convergentă (reduce bias-ul): la mijloc, direcția depinde de bitul care va deveni LSB al ieșirii: 0 → în jos, 1 → în sus; rotunjește în sus jumătate din cazuri. Are suport hardware la puține DSP în virgulă fixă (ADSP-21xx, DSP5600x).", "Eroarea de rotunjire/trunchiere e modelată ca zgomot aleator; diferența principală între cele trei tehnici este bias-ul adăugat semnalului; în telecomunicații tehnica e impusă de standard."]}, {"titlu": "4.1 Virgulă fixă – Operanzii și regiștrii operand", "puncte": ["În majoritatea DSP în virgulă fixă operanzii provin de la un mic număr de regiștri operand sau de la acumulator; datele se aduc din memorie în regiștrii operand cu instrucțiuni „move”, celelalte instrucțiuni nu pot adresa direct memoria → arhitectură „load-store” (încarcă-stochează); regiștrii operand se accesează prin adresare directă la registru (register-direct). Excepții: TMS320C2x/5x, PineDSPCore – operanzi direct din memorie."]}, {"titlu": "4.2 Virgulă mobilă – structură, multiplicator, ALU", "puncte": ["La majoritatea DSP în virgulă mobilă calea principală face calcule și în virgulă mobilă și în virgulă fixă, dar un singur tip de operație într-un ciclu. Unele au două căi de date: una pentru virgulă mobilă și una (cu mai puține facilități) pentru virgulă fixă, fără multiplicator pe calea în virgulă fixă. Exemplu (Fig. 4.6): DSP3210 (AT&T), 32 biți.", "Multiplicatorul în virgulă mobilă acceptă doi operanzi de mărime nativă (de obicei 32 biți) și NU produce un cuvânt suficient de mare pentru a evita pierderea preciziei: mantisele de 24 biți (precizie simplă) ar cere o mantisă de 48 biți; ieșirea are în general 8 sau 12 biți în plus pentru mantisă.", "ALU în virgulă mobilă: adunări, scăderi, valoare absolută, negări, minim/maxim; execută adunarea din MAC. Multiplicare-adunare (ex. DSP32C) ≠ multiplicare-acumulare: rezultatul e scris într-un acumulator diferit de cel care furnizează data adunată cu produsul.", "Operațiile logice pe bit (ȘI, SAU, NEGARE) nu sunt semnificative pentru datele în virgulă mobilă și în general nu sunt executate de ALU destinată numai virgulei mobile."]}, {"titlu": "4.2 Virgulă mobilă – Overflow, underflow și alte excepții", "puncte": ["Overflow-ul și situațiile asemănătoare se numesc excepții = situații neobișnuite care pot cauza rezultate eronate; semnalizare prin setarea unui bit într-un registru de stare sau prin întrerupere (opțional) care lansează o rutină de tratare scrisă de programator.", "Depășirea e mai puțin gravă decât în virgulă fixă (gamă dinamică mai mare); majoritatea procesoarelor setează un bit de stare și limitează automat rezultatul la cea mai pozitivă sau cea mai negativă valoare reprezentabilă.", "Underflow = rezultat prea mic pentru a fi reprezentat (ex. produsul a două numere subunitare mici) → rezultatul se setează la zero și se setează un bit de stare. Împărțirea la zero cauzează o excepție la procesoarele cu operația „reciprocal seed”."]}, {"titlu": "4.2 Virgulă mobilă – Rotunjire, acumulatori, deplasator, operanzi", "puncte": ["Majoritatea DSP în virgulă mobilă rotunjesc automat rezultatele la un format intermediar de 40÷44 biți folosit în calea de date; în memorie datele se scriu fie în precizie extinsă (mai multe locații și operații „move”), fie rotunjite la formatul nativ, în general 32 biți.", "Majoritatea asigură rotunjirea la cel mai apropiat; unele au mai multe opțiuni; DSP96002 (Motorola) asigură toate modurile IEEE 754 pentru precizie simplă: rotunjirea convergentă, către +∞, către zero și către −∞.", "Procesoarele în virgulă mobilă au regiștri mai mulți și mai mari: unele au câțiva regiștri dedicați ca acumulatori (DSP3210), altele regiștri de uz general care pot primi rezultatele MAC (TMS320C3x: 8 regiștri pe 40 biți și 8 pe 32 biți).", "În virgulă mobilă hardware-ul scalează automat rezultatele pentru precizie maximă (principalul avantaj al virgulei mobile); deplasatorul nu e vizibil sau nu e controlabil explicit de programator; la procesoarele cu o singură cale pentru ambele aritmetici el poate fi controlat explicit pentru datele în virgulă fixă.", "Operanzii provin de la regiștri operand sau acumulatoare (adresare directă la registru), încărcați cu „move” explicite (unele în paralel cu instrucțiuni aritmetice); câteva procesoare (DSP32xx) iau operanzi direct din memorie prin adresare indirectă cu registru."]}], "capcane": ["Biți de gardă: n biți de gardă → până la 2ⁿ valori adunate fără depășire (nu 2n, nu n). În textul extras apare „2n” pentru că exponentul s-a pierdut.", "Numărul de biți de gardă = lățimea acumulatorului − lățimea ieșirii multiplicatorului (nu − lățimea operandului): DSP16xx 36−32 = 4, ADSP-21xx 40−32 = 8, DSP5600x 56−48 = 8.", "Biții de gardă PERMIT acumularea fără depășire și fără scalarea rezultatelor intermediare, sunt integrați în acumulator și dau flexibilitate mai mare decât scalarea produsului; NU semnalizează erori de memorie și NU înlătură nevoia scalării finale.", "Multiplicatorul în virgulă fixă dă 2n biți (fără eroare); cel în virgulă mobilă NU dă destui biți (ar trebui mantisă de 48, dă doar 8 sau 12 biți în plus).", "Aritmetică întreagă → se păstrează jumătatea MAI PUȚIN semnificativă a produsului; aritmetică fracționară → se păstrează jumătatea MAI semnificativă (se descarcă LSB-urile). Diferența principală întreg/fracționar = ce parte a rezultatului multiplicării se selectează.", "Calea de date NU calculează adresele: există o unitate separată de generare a adreselor.", "Depășirea poate apărea și când acumulatorul NU a intrat în depășire: la transferul în memorie (acumulator cu biți de gardă) sau la scalarea cu deplasatorul.", "Saturarea nu dă rezultatul corect, doar o eroare mai mică (99 în loc de 115, față de 15 fără saturare).", "Rotunjirea la cel mai apropiat (cea mai folosită) are tot bias, dar mai mic decât trunchierea; rotunjirea convergentă e cea care evită bias-ul și are suport hardware la PUȚINE DSP (ADSP-21xx, DSP5600x).", "Rotunjirea convergentă contează doar la mijloc exact: bitul care devine LSB = 0 → în jos, = 1 → în sus. Dacă partea eliminată e sub/peste jumătate, se rotunjește normal.", "Trunchierea dă o valoare ≤ originala și introduce bias / componentă continuă.", "Overflow în virgulă mobilă → bit de stare + limitare la cea mai pozitivă/negativă valoare; underflow → rezultat setat la ZERO + bit de stare (nu la valoarea minimă).", "Multiplicare-adunare ≠ multiplicare-acumulare: la multiplicare-adunare rezultatul se scrie într-un acumulator diferit de cel care dă data adunată.", "ALU numai pentru virgulă mobilă nu face operații logice pe bit (ȘI, SAU, NEGARE) și nu face înmulțirea (o face multiplicatorul); ALU în virgulă fixă face ȘI, SAU, NU.", "Deplasatorul în virgulă mobilă e invizibil/necontrolabil de programator (scalarea e automată); controlabil explicit doar pentru date în virgulă fixă pe o cale comună.", "Procesoarele cu două căi de date (mobilă + fixă) NU au multiplicator pe calea în virgulă fixă, iar calea în virgulă fixă are mai puține facilități. Căile de date fixă/mobilă NU sunt identice.", "Operanzii regiștrilor operand se accesează prin adresare directă la registru (register-direct); arhitectura în care se lucrează doar din regiștri = „load-store”, nu Von Neumann/Harvard.", "Formatul intermediar de rotunjire în virgulă mobilă este 40÷44 biți; formatul nativ în memorie, în general 32 biți."], "esential": ["Calea de date (virgulă fixă) = multiplicator, ALU, **acumulatori**, deplasator (shifter), registre de operanzi.", "**Multiplicatorul:** n × n biți → **2n biți** (2n − 1 dacă se interzice cel mai negativ număr). La fracționar se păstrează jumătatea de sus.", "**Acumulatorii** rețin rezultatele parțiale și finale (preiau rezultatul ALU). Majoritatea DSP au doi sau mai mulți.", "**Biți de gardă** = biți suplimentari în acumulator → poți aduna **până la 2ⁿ valori** fără depășire. Biți de gardă = acumulator − produs: DSP16xx 36 − 32 = **4**; ADSP-21xx 40 − 32 = **8**. Biții de gardă dau mai multă flexibilitate decât scalarea produsului, dar nu elimină nevoia scalării.", "**Deplasatorul:** scalare cu puteri ale lui 2. Deplasare aritmetică la dreapta copiază bitul de semn (010010 → 001001); la stânga intră 0.", "**Depășire (overflow):** valoare greșită, departe de cea corectă. Tratare: scalare atentă SAU **aritmetică cu saturare** (înlocuiește cu cel mai mare pozitiv / cel mai mic negativ; circuitul = limitator). 50 + 45 + 20 pe 2 cifre → 15 fără saturare, **99** cu saturare.", "**Trunchiere:** arunci biții de jos → rezultat mereu ≤ original → **bias** (componentă continuă).", "**Rotunjire la cea mai apropiată:** + jumătate de LSB, apoi trunchiere; la egalitate mereu în sus → bias mic. **Rotunjire convergentă:** la egalitate decide LSB-ul păstrat (0 → jos, 1 → sus) → fără bias.", "**Virgulă mobilă:** ALU-ul **nu face înmulțiri** (le face multiplicatorul); mantise 24 × 24 → 48 biți. La depășire se saturează la cea mai mare valoare.", "Ordinea obișnuită: **multiplicare → acumulare → deplasare → rotunjire**."]}, {"curs": 5, "titlu": "Arhitectura memoriei", "rezumat": [{"titlu": "Introducere: de ce contează arhitectura memoriei", "puncte": ["Căile de date ale DSP sunt optimizate pentru performanțe ridicate; pentru a menține fluxul de date și a memora rezultatele, procesoarele de semnal trebuie să transfere cantități mari de date în și din memorie.", "Organizarea memoriei și modul de interconectare a acesteia cu calea de procesare a datelor = arhitectura memoriei procesorului (alt factor important pentru performanță).", "DSP execută operația de multiplicare-adunare (MAC) de regulă într-un singur ciclu de tact, cu o instrucțiune specializată.", "Filtrul RFI (FIR) în structură transversală: N prize, (N-1) eșantioane în linia de întârziere; fiecare priză = un multiplicator și un sumator (executate prin software).", "Pentru fiecare instrucțiune MAC din FIR procesorul trebuie să execute PATRU accesări ale memoriei într-un ciclu de tact: (1) citirea codului instrucțiunii MAC (fetch); (2) citirea eșantionului din linia de întârziere; (3) citirea coeficientului filtrului; (4) scrierea eșantionului în următoarea locație a liniei de întârziere (deplasarea datelor).", "Unele procesoare reduc numărul de accesări necesare la trei sau chiar două; procesoarele de semnal pot executa mai multe operații de citire sau scriere din/în memorie într-un ciclu-mașină."]}, {"titlu": "5.1 Organizarea memoriei – von Neumann și Harvard", "puncte": ["Arhitectura von Neumann: cea mai simplă structură – un singur bloc de memorie, accesat printr-un singur set de magistrale de adrese și date; memoria conține atât instrucțiunile programului cât și datele; folosită la primele generații de microprocesoare și la multe procesoare de uz general.", "Von Neumann, cazul cel mai simplu: un singur acces la memorie (o citire sau o scriere) pe ciclu-mașină → MAC din FIR necesită 4 cicluri cu memoria (accesări secvențiale); de aceea von Neumann nu execută eficient algoritmii de prelucrare a semnalelor.", "Arhitectura Harvard: procesorul este conectat la două blocuri independente de memorie prin două magistrale separate; în varianta standard un bloc conține instrucțiunile programului, iar celălalt datele.", "La DSP se folosește arhitectura Harvard MODIFICATĂ: un bloc de memorie conține instrucțiunile programului și date, iar celălalt conține numai date; datele pot fi mutate între cele două blocuri (imposibil la arhitectura standard).", "Avantajul principal al arhitecturii Harvard: două accesări ale memoriei într-un ciclu-mașină → cele 4 accesări ale FIR se fac în 2 cicluri-mașină. Exemple: ADSP-21xx (Analog Devices), DSP16xx (AT&T) – la DSP16xx o scriere durează 2 cicluri, deci nu se folosește întregul potențial.", "Harvard modificată cu trei blocuri (PineDSPCore, OakDSPCore – DSP Group): un bloc de memorie de program și două blocuri de date X și Y, fiecare cu setul ei de magistrale → trei accesări independente pe ciclu-mașină (citirea instrucțiunii + câte un acces la X și Y). Și la Z839xx (Zilog), D950-CORE (SGS-Thomson), DSP5600x, DSP563xx, DSP96002 (Motorola).", "A patra accesare a FIR este eliminată la procesoarele cu 3 accesări/ciclu prin adresarea modulo n.", "Extinderea magistralelor în afara chip-ului e costisitoare (crește complexitatea capsulei) → DSP au în general un singur set de magistrale pentru memoria externă (o magistrală
