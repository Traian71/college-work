""}, {"id": "c6-v76", "curs": 6, "tip": "vechi", "sursa": "Grile_final – GRILE.RTF („A0 = A0 + *R3++ → R3 = 0x100”; enunț și variante reconstituite)", "intrebare": "Dacă valoarea inițială a lui A0 este 5, cât devine registrul R3 în urma operației A0 = A0 + *R3++ (registrele din figura de laborator)?", "variante": ["valoarea inițială a lui R3 + 1 (în fișier: 0x100)", "valoarea inițială a lui R3 − 1", "6", "neschimbat"], "corecte": [0], "explicatie": "Capitol 6, 6.6: după acces R3 este post-incrementat cu unu și indică locația de memorie următoare; A0 nu influențează R3. Răspunsul 0x100 din fișier presupune R3 = 0x0FF inițial (figura lipsește).", "sigur": false, "figura": ""}, {"id": "c2-v77", "curs": 2, "tip": "vechi", "sursa": "Examen.pdf (Verificare 2, 17.01.2022) întrebarea 7 – bifat c, punctaj 3/3; subiect final 2024 1.pdf + subiect final 2024 2.jpg (Lucrare de verificare 2, varianta B) întrebarea 8 – încercuit „buclare hardware” (a în acea variantă); v2_D.pdf (Lucrare de verificare 2, varianta D) întrebarea 8 – nemarcat", "intrebare": "Care din următoarele facilități sunt specifice procesoarelor de semnal pentru execuția buclelor?", "variante": ["sunt identice cu cele de la procesoarele de uz general", "registre speciale pe post de contor de buclă", "buclare hardware pentru execuția buclelor fără cicluri mașină suplimentare", "instrucțiuni de salt (software)"], "corecte": [2], "explicatie": "Curs 2, §2.1 Procesoare PDS (6/7), „Controlul specializat al funcționării”: procesoarele PDS oferă suport eficient pentru bucle, o instrucțiune de buclare sau „repeat” care implementează ciclurile for-next fără mărirea ciclului instrucțiune pentru actualizarea/testarea contorului sau saltul înapoi, adică buclare hardware fără cicluri suplimentare. Registre speciale de contor nu sunt menționate în curs. Punctajul 3/3 cu doar c bifat confirmă.", "sigur": true, "figura": ""}, {"id": "c1-n78", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Noua etapă în prelucrarea digitală a semnalelor, deschisă de circuitele VLSI, a debutat:", "variante": ["în 1979, cu procesorul TMS 320 de la Texas Instruments", "în 1979, cu lansarea familiei de procesoare Intel 2920", "cu procesorul bit-slice AMD 29500", "în 1989, cu lansarea familiei de procesoare Intel 2920"], "corecte": [1], "explicatie": "Curs 1 §1.1 (1/2): etapa „a debutat în anul 1979 cu lansarea familiei de procesoare Intel 2920”. TMS 320 și AMD 29500 au apărut „aproape simultan” (Capitol 1, Introducere), dar nu ele marchează debutul.", "sigur": true, "figura": ""}, {"id": "c1-n79", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Cei mai importanți producători de circuite PDS, conform cursului, sunt:", "variante": ["Texas Instruments", "AT&T", "Motorola", "NEC"], "corecte": [0, 1, 2, 3], "explicatie": "Curs 1 §1.1 (2/2) îi enumeră pe Texas Instruments, AT&T, Motorola, NEC și Analog Devices. Toate cele patru variante sunt în listă.", "sigur": true, "figura": ""}, {"id": "c1-n80", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Caracteristicile structurale și funcționale ale procesoarelor PDS sunt adaptate particularităților impuse de algoritmii de prelucrare, adică:", "variante": ["viteză mare de prelucrare pentru asigurarea lucrului în timp real", "executarea unui volum mare de operații aritmetice și logice complexe", "asigurarea unei precizii mari de prelucrare", "semnalele de intrare sunt în multe cazuri semnale analogice"], "corecte": [0, 2, 3], "explicatie": "Curs 1 §1.2 (1/6): cursul cere un volum mare de operații aritmetice și logice SIMPLE, nu complexe, deci b e falsă. Celelalte trei sunt copiate din curs.", "sigur": true, "figura": ""}, {"id": "c1-n81", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Cerințele specifice algoritmilor PDS sunt satisfăcute prin:", "variante": ["arhitecturi cu grad mare de paralelism combinate cu execuția pipeline a instrucțiunilor", "implementarea unității de comandă prin microprogramare", "facilități hardware pentru execuția eficientă a buclelor de instrucțiuni", "moduri de adresare specifice (pre/post incrementare/decrementare, inversarea biților, modulo)"], "corecte": [0, 2, 3], "explicatie": "Curs 1 §1.2 (2/6). Unitatea de comandă e implementată în LOGICĂ CABLATĂ; microprogramarea e specifică procesoarelor de uz general (Capitol 1 §1.1 g).", "sigur": true, "figura": ""}, {"id": "c1-n82", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Modulele incluse în circuitul procesoarelor PDS pentru creșterea productivității sunt:", "variante": ["multiplicator hardware de tip paralel", "circuite pentru deplasări binare", "memorii interne pentru date și programe", "stivă internă"], "corecte": [0, 1, 2, 3], "explicatie": "Curs 1 §1.2 (2/6), cuvânt cu cuvânt: „multiplicator hardware de tip paralel, circuite pentru deplasări binare, memorii interne pentru date și programe, stivă internă”.", "sigur": true, "figura": ""}, {"id": "c1-n83", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Arhitectura Harvard se caracterizează prin:", "variante": ["memorii separate pentru coduri și pentru date, cu căi separate de transfer", "o singură memorie pentru coduri și date, accesată pe o singură magistrală", "fragmentarea activităților și executarea lor pe unități funcționale distincte", "posibilitatea transferului operanzilor simultan cu extragerea codurilor"], "corecte": [0, 3], "explicatie": "Capitol 1 §1.1 a): Harvard are memorii separate pentru coduri și date și căi separate de transfer, „în acest mod este posibil transferul operanzilor simultan cu extragerea codurilor”. b descrie Von Neumann, c descrie pipeline-ul.", "sigur": true, "figura": ""}, {"id": "c1-n84", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Organizarea pipeline a operațiilor constă în:", "variante": ["folosirea unor memorii separate pentru coduri și date", "executarea tuturor operațiilor pe o singură unitate funcțională, strict secvențial", "fragmentarea activităților și executarea acestora pe unități funcționale distincte", "implementarea în logică cablată a unității de comandă"], "corecte": [2], "explicatie": "Capitol 1 §1.1 a): „Organizarea pipeline a operațiilor constă în fragmentarea activităților și executarea acestora pe unități funcționale distincte.” a e definiția Harvard, d e altă caracteristică a DSP.", "sigur": true, "figura": ""}, {"id": "c1-n85", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Partea operațională a procesoarelor PDS constă de regulă din:", "variante": ["unitate de comandă microprogramată", "unitate aritmetică și logică (UAL) rapidă cu acumulator", "multiplicator paralel", "circuit de deplasare binară cu unul sau mai multe ranguri într-un singur tact (barrel shifter)"], "corecte": [1, 2, 3], "explicatie": "Capitol 1 §1.1 b): „UAL rapidă cu acumulator, multiplicator paralel și circuite pentru deplasare binară cu unul sau mai multe ranguri într-un singur tact (barrel shifter)”. Unitatea de comandă nu ține de partea operațională și, la DSP, e cablată.", "sigur": true, "figura": ""}, {"id": "c1-n86", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Care afirmații despre aritmetica procesoarelor PDS (Capitol 1) sunt adevărate?", "variante": ["scăderea se execută prin adunarea operanzilor reprezentați în cod complement față de doi", "procesoarele funcționează fie în virgulă fixă (pe 16 biți), fie în virgulă mobilă (pe 32 de biți)", "o alternativă la virgula mobilă este aritmetica în virgulă mobilă pe bloc", "unele circuite PDS execută înmulțirea prin adunări și deplasări succesive (de exemplu I-2920)"], "corecte": [0, 1, 2, 3], "explicatie": "Toate patru sunt în Capitol 1 §1.1 b).", "sigur": true, "figura": ""}, {"id": "c1-n87", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Diferențe între arhitectura Harvard a procesoarelor PDS și memoriile cache ale procesoarelor de uz general (PUG):", "variante": ["la procesoarele PDS programatorul controlează explicit datele și instrucțiunile stocate în memoriile interne", "la PUG transferul cu memoriile cache este executat automat, transparent pentru programator", "procesoarele de semnal folosesc în general memorii cache pentru date", "unele procesoare de semnal au o arie de memorie cache pentru instrucțiuni, folosită la execuția buclelor"], "corecte": [0, 1, 3], "explicatie": "Capitol 1 §1.1 c): „În general procesoarele de semnal nu folosesc memorii cache pentru date”, deci c e falsă. Restul e copiat din text.", "sigur": true, "figura": ""}, {"id": "c1-n88", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Stiva la procesoarele PDS:", "variante": ["este implementată hardware, permițând salvarea/restaurarea rapidă a contextului la întreruperi sau subrutine", "este implementată exclusiv software, în memoria de program", "poate fi extinsă în memoria RAM pentru date, deoarece stiva hardware internă are dimensiune limitată", "are dimensiune nelimitată, deci nu necesită extensie"], "corecte": [0, 2], "explicatie": "Capitol 1 §1.1 f): implementarea hardware a stivei permite salvarea/restaurarea rapidă a contextului; „întrucât dimensiunea stivei hardware interne este limitată, există posibilitatea de extensie a stivei în memoria RAM pentru date”.", "sigur": true, "figura": ""}, {"id": "c1-n89", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Unitatea de comandă a procesoarelor PDS:", "variante": ["este realizată prin microprogramare, ca la procesoarele de uz general", "este realizată în logică cablată", "este mai flexibilă, dar mai lentă decât cea microprogramată", "permite obținerea unei viteze mai mari de lucru, deși este mai puțin flexibilă"], "corecte": [1, 3], "explicatie": "Capitol 1 §1.1 g): unitatea de comandă e realizată în logică cablată, iar procesoarele de uz general folosesc microprogramare. Metoda e „mai puțin flexibilă, dar permite obținerea unei viteze mai mari de lucru”.", "sigur": true, "figura": ""}, {"id": "c1-n90", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Despre lungimea cuvintelor și precizia de calcul la procesoarele PDS:", "variante": ["lungimea cuvintelor de calcul este de 8, 16, 25 și chiar 40 de biți", "anumite operații interne se execută în precizie dublă pentru a reduce consumul de energie", "precizia de calcul este impusă de performanțele dorite, de exemplu un raport semnal/zgomot convenabil", "lungimea cuvintelor este întotdeauna de 32 de biți"], "corecte": [0, 2], "explicatie": "Capitol 1 §1.1 i): precizia dublă se folosește „pentru mărirea gamei dinamice”, nu pentru consum (b falsă). Cuvintele au 8, 16, 25 sau 40 de biți, nu mereu 32.", "sigur": true, "figura": ""}, {"id": "c1-n91", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Dintre tendințele care se manifestă în evoluția procesoarelor PDS fac parte:", "variante": ["mărirea vitezei de operare prin adoptarea unor noi tehnologii", "interconectarea cu coprocesoare orientate pe calcule matematice complexe", "folosirea arhitecturilor bazate pe flux de date (data flow) sau a rețelelor dedicate în locul arhitecturilor tradiționale", "existența circuitelor PDS la cerere"], "corecte": [0, 1, 2, 3], "explicatie": "Curs 1 §1.2 (3/6) enumeră toate aceste tendințe, plus potrivirea algoritmilor cu arhitectura și sporirea eficienței (universalitate, întreruperi, virgulă mobilă, preț).", "sigur": true, "figura": ""}, {"id": "c1-n92", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Pentru dezvoltarea software-ului chiar de către utilizatorul sistemelor PDS sunt disponibile următoarele metode de programare:", "variante": ["programarea prin microcod a unității de comandă", "programarea la nivel de blocuri (Block-Level Programming)", "programarea exclusiv în cod mașină", "programarea bazată pe meniuri"], "corecte": [1, 3], "explicatie": "Curs 1 §1.2 (4/6): „sunt disponibile 2 tipuri de metode de programare: programarea la nivel de blocuri și programarea bazată pe meniuri”.", "sigur": true, "figura": ""}, {"id": "c1-n93", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Pentru evaluarea calităților diverselor familii de procesoare PDS se folosesc informații precum:", "variante": ["numărul de tranzistoare de pe cip", "timpul de realizare a operației de înmulțire și adunare", "timpul în care este realizată o sarcină precisă, de exemplu calculul TFR într-un număr specificat de puncte (de regulă 1024)", "numărul de pini ai capsulei"], "corecte": [1, 2], "explicatie": "Curs 1 §1.2 (5/6) dă doar aceste două criterii: timpul înmulțire-adunare (de ordinul ns) și timpul pentru o sarcină precisă (filtrare sau TFR, de regulă 1024 de puncte).", "sigur": true, "figura": ""}, {"id": "c1-n94", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Avantajele folosirii procesoarelor de semnal în realizarea sistemelor PDS sunt:", "variante": ["precizie mare de lucru, independentă de precizia de reprezentare internă a datelor", "stabilitate mare la variații de temperatură, ale tensiunii de alimentare sau ale parametrilor componentelor", "lipsa problemelor legate de zgomotul introdus de sursele de alimentare", "posibilitatea realizării unor sisteme PDS în timp real, universale și flexibile, cu programare rapidă"], "corecte": [1, 2, 3], "explicatie": "Curs 1 §1.2 (6/6): precizia mare „depinde de precizia de reprezentare internă a datelor”, deci varianta „independentă” e falsă. Restul e copiat din listă.", "sigur": true, "figura": ""}, {"id": "c1-n95", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Sistemele PDS au câteva caracteristici comune, care se referă la:", "variante": ["algoritmi", "rata de eșantionare", "tact", "reprezentarea numerelor"], "corecte": [0, 1, 2, 3], "explicatie": "Curs 1 §1.3 (1/5): a) algoritmii, b) rata de eșantionare, c) tactul, d) reprezentarea numerelor.", "sigur": true, "figura": ""}, {"id": "c1-n96", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Rata de eșantionare:", "variante": ["reprezintă viteza cu care eșantioanele sunt achiziționate, prelucrate și generate", "corespunde frecvenței cu care sistemul execută operațiile elementare", "împreună cu complexitatea algoritmilor determină cerințele de viteză ale tehnologiei de implementare", "specifică operațiile aritmetice care trebuie efectuate"], "corecte": [0, 2], "explicatie": "Curs 1 §1.3 (3/5). b este definiția tactului (§1.3 (4/5)), d este definiția algoritmului (§1.3 (2/5)).", "sigur": true, "figura": ""}, {"id": "c1-n97", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Algoritmul, ca o caracteristică a sistemelor PDS:", "variante": ["specifică operațiile aritmetice care trebuie efectuate", "arată și modul în care sunt implementate aceste operații", "poate fi implementat pe un microprocesor de uz general, pe un procesor de semnal sau pe un circuit integrat dedicat", "reprezintă viteza cu care eșantioanele sunt prelucrate"], "corecte": [0, 2], "explicatie": "Curs 1 §1.3 (2/5) / Capitol 1 §1.2: algoritmul „specifică operațiile aritmetice care trebuie efectuate dar nu arată și cum sunt implementate”. Același algoritm poate rula pe µP de uz general, DSP sau circuit dedicat.", "sigur": true, "figura": ""}, {"id": "c1-n98", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Referitor la ratele de eșantionare ale aplicațiilor PDS (Fig. 1.1):", "variante": ["ratele de eșantionare folosite acoperă 12 ordine de mărime", "aplicațiile care cer rate înalte sunt cele mai frecvente", "algoritmii folosiți la rate de eșantionare ridicate tind să fie mai simpli", "radarul folosește rate mici de eșantionare și algoritmi foarte complecși"], "corecte": [0, 2], "explicatie": "Capitol 1 §1.2: ratele acoperă 12 ordine de mărime, aplicațiile cu rate înalte sunt rare (costul crește cu rata), iar algoritmii la rate mari tind să fie mai simpli. În Fig. 1.1 radarul are rata cea mai mare (1–10 GHz) și algoritmi simpli.", "sigur": true, "figura": ""}, {"id": "c1-n99", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Despre tactul sistemelor PDS:", "variante": ["frecvența de tact corespunde uzual cu frecvența cu care sistemul execută operațiile elementare", "pentru produsele comerciale sunt comune frecvențe de tact de până la 100 MHz", "raportul dintre rata de eșantionare și cea a tactului este una dintre caracteristicile folosite pentru a stabili modul de implementare", "raportul dintre rata de eșantionare și tact determină cantitatea de hardware necesară pentru implementarea în timp real a unui algoritm dat"], "corecte": [0, 1, 2, 3], "explicatie": "Curs 1 §1.3 (4/5) / Capitol 1 §1.2 „Tactul”: toate sunt copiate din text. Pe măsură ce raportul crește, cresc și cantitatea și complexitatea hardware-ului.", "sigur": true, "figura": ""}, {"id": "c1-n100", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Aritmetica în virgulă fixă:", "variante": ["asigură reprezentarea numerelor într-o gamă fixă (de exemplu între −1,0 și +1,0)", "reprezintă fiecare număr prin mantisă și exponent", "folosește cuvinte cu un număr finit de biți, denumit lungimea cuvântului", "pe 8 biți asigură o rezoluție de 1/256 din valoarea maximă a numărului"], "corecte": [0, 2, 3], "explicatie": "Curs 1 §1.3 (5/5) / Capitol 1 §1.2 „Reprezentarea numerelor”. Mantisa și exponentul descriu virgula MOBILĂ (N = M × 2^E).", "sigur": true, "figura": ""}, {"id": "c1-n101", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "În virgulă fixă, dacă operațiile aritmetice produc un număr mai mare de biți decât lungimea cuvântului, se execută:", "variante": ["saturarea (mărimile sunt limitate la cea mai mică sau cea mai mare valoare reprezentabilă)", "creșterea exponentului", "eliminarea biților excedentari (wrap around)", "normalizarea mantisei"], "corecte": [0, 2], "explicatie": "Capitol 1 §1.2: „se execută fie saturarea ..., fie eliminarea biților excedentari (operație denumită wrap around)”. Exponentul și mantisa țin de virgula mobilă.", "sigur": true, "figura": ""}, {"id": "c1-n102", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Față de virgula fixă, reprezentarea în virgulă mobilă:", "variante": ["asigură o gamă dinamică mult mai mare", "este mai rapidă și mai ieftină", "simplifică considerabil proiectarea algoritmului și a software-ului", "necesită o structură hardware mai complicată"], "corecte": [0, 2, 3], "explicatie": "Capitol 1 §1.2: virgula mobilă reduce depășirile de scală și normările, deci simplifică proiectarea, dar „este mai lentă și mai scumpă decât cea în virgulă fixă, iar structura hardware a sistemului este mai complicată”.", "sigur": true, "figura": ""}, {"id": "c1-n103", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Gama dinamică a unei reprezentări numerice este:", "variante": ["numărul de biți al cuvântului", "diferența dintre exponentul maxim și cel minim", "rezoluția, adică cea mai mică valoare reprezentabilă", "raportul dintre valoarea cea mai mare și cea mai mică ce poate fi reprezentată"], "corecte": [3], "explicatie": "Capitol 1 §1.2: „gama dinamică este raportul dintre valoarea cea mai mare și cea mai mică care poate fi reprezentată”. Numărul de biți este lungimea cuvântului.", "sigur": true, "figura": ""}, {"id": "c1-n104", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Categoriile de aplicații în care sunt folosite procesoarele PDS, conform cursului, sunt:", "variante": ["sistemele dedicate ieftine", "aplicații de înaltă performanță", "aplicații de supercalcul pe calculatoare CRAY", "aplicații multimedia pe calculatoare PC"], "corecte": [0, 1, 3], "explicatie": "Curs 1 §1.4: sistemele dedicate ieftine, aplicațiile de înaltă performanță și aplicațiile multimedia pe PC. CRAY1 apare doar ca termen de comparație a costului pe operație.", "sigur": true, "figura": ""}, {"id": "c1-n105", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Aplicațiile PDS de înaltă performanță se caracterizează prin:", "variante": ["prelucrarea unui volum mare de date cu algoritmi complecși (de exemplu sonar, explorări seismice)", "producție în număr foarte mare (telefoane celulare, drivere de disc, modemuri)", "faptul că, predominant, contează costul și simplitatea integrării", "exploatarea la maximum a performanțelor procesorului și suport pentru configurații multiprocesor"], "corecte": [0, 3], "explicatie": "Capitol 1 §1.3 „Aplicații de înaltă performanță”: numărul de produse este mic, iar algoritmii sunt sofisticați. b și c descriu sistemele dedicate ieftine.", "sigur": true, "figura": ""}, {"id": "c1-n106", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Prima etapă în proiectarea sistemelor PDS în timp real este:", "variante": ["elaborarea mijloacelor de proiectare automată a sistemelor PDS în timp real", "analiza calității algoritmilor prin estimarea preciziei de execuție", "studierea și elaborarea metodelor de sinteză a operatorilor de prelucrare fizic realizabili", "stabilirea principiilor de realizare hardware și software a algoritmilor PDS"], "corecte": [2], "explicatie": "Curs 1 §1.5: I sinteza operatorilor fizic realizabili, II elaborarea și optimizarea algoritmilor, III analiza calității, IV principiile de realizare hardware/software, V proiectarea automată.", "sigur": true, "figura": ""}, {"id": "c1-n107", "curs": 1, "tip": "nou", "sursa": "nou", "intrebare": "Etapa de analiză a calității algoritmilor (etapa III a proiectării sistemelor PDS) cuprinde:", "variante": ["estimarea preciziei de execuție", "analiza influenței lungimii cuvintelor", "fixarea arhitecturii structurii și a blocurilor funcționale", "analiza stabilității și a diverselor efecte neliniare"], "corecte": [0, 1, 3], "explicatie": "Curs 1 §1.5, etapa III: „estimarea preciziei de execuție, a influenței lungimii cuvintelor, analiza stabilității, a diverselor efecte neliniare”. Fixarea arhitecturii și a blocurilor funcționale ține de etapa IV (Capitol 1 §1.4).", "sigur": true, "figura": ""}, {"id": "c2-n108", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Care sunt cele mai importante caracteristici comune ale procesoarelor PDS?", "variante": ["operația rapidă de multiplicare și acumulare", "arhitectura multiacces a memoriei", "controlul specializat al funcționării", "periferice și interfețe I/O"], "corecte": [0, 1, 2, 3], "explicatie": "Curs 2, §2.1 (2/7), Tabelul 2.2: cele cinci caracteristici sunt MAC rapidă, arhitectura multiacces a memoriei, moduri de adresare specializate, controlul specializat al funcționării, periferice și interfețe I/O. Toate cele patru variante sunt în listă.", "sigur": true, "figura": ""}, {"id": "c2-n109", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Referitor la operația de multiplicare-acumulare (MAC) a procesoarelor PDS, sunt adevărate afirmațiile:", "variante": ["se execută într-un singur ciclu instrucțiune", "se realizează cu un multiplicator și un acumulator integrate în unitatea de generare a adreselor", "este utilă în filtrarea digitală, corelație și calculul transformatei Fourier", "produce inevitabil depășire de scală la acumularea unui număr mare de produse"], "corecte": [0, 2], "explicatie": "Curs 2, §2.1 (3/7): MAC într-un singur ciclu instrucțiune, utilă la produsul a doi vectori (filtrare, corelație, transformata Fourier). Multiplicatorul și acumulatorul sunt integrate în calea de date, nu în unitatea de adresare, iar biții suplimentari din acumulatoare permit MAC fără overflow.", "sigur": true, "figura": ""}, {"id": "c2-n110", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Pentru a efectua operații de multiplicare și acumulare fără depășire de scală aritmetică (overflow), procesoarele PDS:", "variante": ["execută operația MAC în mai multe cicluri instrucțiune", "permit stocarea unor biți suplimentari în registrele de acumulare", "folosesc adresarea cu inversarea biților", "adaptează registrele de acumulare la dimensiunea rezultatului"], "corecte": [1, 3], "explicatie": "Curs 2, §2.1 (3/7): „Procesoarele PDS permit stocarea unui număr de biți suplimentari în registrii de acumulare pentru a le adapta la dimensiunea rezultatului.” Inversarea biților ține de adresare (TFR), iar MAC rămâne într-un singur ciclu.", "sigur": true, "figura": ""}, {"id": "c2-n111", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Arhitectura multiacces a memoriei permite procesorului PDS:", "variante": ["să extragă simultan o instrucțiune și operanzii pentru instrucțiune", "să efectueze o singură accesare la memorie la fiecare ciclu instrucțiune", "să stocheze rezultatul instrucțiunii anterioare în memorie în același ciclu", "să acceseze multiplu memoria externă cu orice instrucțiune"], "corecte": [0, 2], "explicatie": "Curs 2, §2.1 (4/7): multiaccesul permite „să extragă simultan o instrucțiune și operanzii pentru instrucțiune sau să stocheze rezultatul instrucțiunii anterioare în memorie”. Accesarea multiplă e restricționată la locații din cip și la anumite instrucțiuni, deci d e falsă.", "sigur": true, "figura": ""}, {"id": "c2-n112", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Pentru a putea accesa simultan mai multe locații de memorie, procesoarele PDS posedă:", "variante": ["magistrale interne multiple", "un singur set de magistrale comun pentru date și instrucțiuni", "memorii interne multicip", "în unele situații, mai multe bancuri de memorie independente"], "corecte": [0, 2, 3], "explicatie": "Curs 2, §2.1 (4/7): „procesoarele PDS posedă magistrale interne multiple, memorii interne multicip și, în unele situații, mai multe bancuri de memorie independente”. Un singur set de magistrale comun e tocmai ce limitează accesul multiplu.", "sigur": true, "figura": ""}, {"id": "c2-n113", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Unitățile dedicate pentru adresare ale procesoarelor PDS:", "variante": ["permit specificarea operanzilor multipli cu ajutorul unor cuvinte instrucțiune scurte", "calculează adresele în background, în paralel cu executarea operațiilor aritmetice", "lucrează după ce registrele pentru adresare au fost configurate", "conțin multiplicatorul folosit în operația MAC"], "corecte": [0, 1, 2], "explicatie": "Curs 2, §2.1 (5/7): unitățile dedicate există pentru viteza maximă și pentru specificarea operanzilor multipli cu cuvinte instrucțiune scurte; „odată ce registrii pentru adresare au fost configurați, unitatea de generare a adresei lucrează în background”. Multiplicatorul e în calea de date.", "sigur": true, "figura": ""}, {"id": "c2-n114", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Cel mai comun mod de adresare adaptat aplicațiilor PDS, folosit la operații repetitive pe șiruri de date stocate la adrese succesive, este:", "variante": ["adresarea circulară (modulo)", "adresarea cu inversarea biților", "adresarea indirectă cu post-incrementare", "adresarea imediată"], "corecte": [2], "explicatie": "Curs 2, §2.1 (5/7): „Cel mai comun dintre acestea este adresarea indirectă cu post-incrementare, care este folosită atunci când sunt executate operații repetitive pe șiruri de date stocate la adrese succesive în memorie.” Circulara și inversarea biților sunt moduri speciale.", "sigur": true, "figura": ""}, {"id": "c2-n115", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Care asocieri între modul de adresare și utilizarea lui sunt corecte?", "variante": ["adresarea circulară (modulo) – simplifică accesarea bufferelor de date", "adresarea cu inversarea biților – calculul Transformatei Fourier Rapide", "adresarea cu inversarea biților – accesarea bufferelor circulare FIFO", "adresarea indirectă cu post-incrementare – șiruri de date la adrese succesive"], "corecte": [0, 1, 3], "explicatie": "Curs 2, §2.1 (5/7): circulara (modulo) simplifică accesarea bufferelor de date, inversarea biților se folosește în TFR, post-incrementarea la șiruri de date stocate la adrese succesive. Bufferele circulare țin de adresarea modulo, nu de inversarea biților.", "sigur": true, "figura": ""}, {"id": "c2-n116", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Facilitățile de control specializat al funcționării oferite de unele procesoare PDS sunt:", "variante": ["instrucțiune de buclare sau instrucțiune „repeat” pentru cicluri for-next", "comutarea rapidă a contextului și latența redusă", "executarea întreruperilor cu încărcare minimă", "mărirea ciclului instrucțiune pentru actualizarea și testarea contorului de buclă"], "corecte": [0, 1, 2], "explicatie": "Curs 2, §2.1 (6/7): instrucțiunea de buclare/„repeat” implementează ciclurile for-next „fără mărirea ciclului instrucțiune” prin actualizarea și testarea contorului; alte facilități: comutarea rapidă a contextului și latența redusă, întreruperi cu încărcare minimă, operații I/O rapide. Varianta d e opusul.", "sigur": true, "figura": ""}, {"id": "c2-n117", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "În privința perifericelor și interfețelor I/O, multe procesoare PDS:", "variante": ["încorporează una sau mai multe interfețe I/O seriale și/sau paralele", "au mecanisme speciale pentru I/O, cum ar fi accesul direct la memorie (DMA)", "au interfețe proiectate pentru interfațarea directă cu convertoarele A/D și D/A", "nu includ niciodată periferice complete în cip, pentru a reduce costul"], "corecte": [0, 1, 2], "explicatie": "Curs 2, §2.1 (7/7): pentru cost redus și performanțe I/O înalte au interfețe seriale/paralele și DMA, iar interfețele sunt proiectate pentru A/D și D/A. Producătorii au început să includă și periferice complete (ex. circuitele pentru telefoane celulare au A/D și D/A în cip), deci d e falsă.", "sigur": true, "figura": ""}, {"id": "c2-n118", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Varianta cea mai comună de microprocesor PDS este:", "variante": ["modulul multicip (MCM)", "procesorul single-cip", "setul de circuite", "ASIC-ul cu nucleu PDS"], "corecte": [1], "explicatie": "Curs 2, §2.2 (1/7): „Varianta cea mai comună de microprocesor PDS este procesorul single-cip.”", "sigur": true, "figura": ""}, {"id": "c2-n119", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Faptul că procesoarele PDS sunt disponibile în prezent în multe variante constructive se datorează:", "variante": ["proliferării aplicațiilor PDS", "creșterii nivelului de integrare pentru toate produsele electronice", "dezvoltării unor noi tehnici de încapsulare", "scăderii performanțelor procesoarelor single-cip"], "corecte": [0, 1, 2], "explicatie": "Curs 2, §2.2 (1/7): „Odată cu proliferarea aplicațiilor PDS, creșterea nivelului de integrare pentru toate produsele electronice și dezvoltarea unor noi tehnici de încapsulare” procesoarele PDS au devenit disponibile în multe variante constructive.", "sigur": true, "figura": ""}, {"id": "c2-n120", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Care dintre următoarele sunt variante constructive de procesoare PDS?", "variante": ["cipurile multiprocesor", "microprocesoarele de uz general", "hardware-ul personalizat", "multiprocesoarele"], "corecte": [0, 3], "explicatie": "Curs 2, §2.2 (1/7): variantele constructive sunt module multicip, cipuri multiprocesor, seturi de circuite, nuclee PDS, procesoare PDS personalizate, multiprocesoarele. Microprocesoarele de uz general și hardware-ul personalizat sunt alternative pentru procesoarele PDS (§2.3).", "sigur": true, "figura": ""}, {"id": "c2-n121", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Modulele multicip (MCM):", "variante": ["sunt un fel de „supercipuri” care conțin mai multe cipuri încapsulate împreună", "încapsulează un singur circuit integrat într-o capsulă din plastic sau ceramică", "au o densitate mare de încapsulare (mai multe circuite pe unitatea de suprafață a plăcii)", "duc la creșterea vitezei de operare și la scăderea consumului"], "corecte": [0, 2, 3], "explicatie": "Curs 2, §2.2 (2/7): MCM sunt „supercipuri”; în loc de a încapsula un singur CI (ca procesoarele convenționale) conțin mai multe cipuri împreună; avantajul e densitatea mare de încapsulare, care duce la creșterea vitezei și scăderea consumului. Varianta b descrie procesoarele convenționale.", "sigur": true, "figura": ""}, {"id": "c2-n122", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Circuitul TriCore produs de Siemens conține:", "variante": ["un procesor de uz general", "un procesor PDS", "un microcontroler", "128 kcuvinte de memorie SRAM de 32 de biți"], "corecte": [0, 1, 2], "explicatie": "Curs 2, §2.2 (3/7), Cipuri multiprocesor: „Firma Siemens a produs circuitul Tricore care conține un procesor de uz general, un procesor PDS și un microcontroler.” Cele 128 kcuvinte SRAM sunt din exemplul de MCM Texas Instruments (două TMS320C40).", "sigur": true, "figura": ""}, {"id": "c2-n123", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Despre cipurile multiprocesor sunt adevărate afirmațiile:", "variante": ["încorporează mai multe procesoare într-un singur circuit integrat", "împart un procesor PDS în două sau mai multe capsule separate", "asigură creșterea performanțelor și reduc consumul față de sistemele cu componente separate", "oferta lor este foarte largă, cuprinzând sute de dispozitive"], "corecte": [0, 2], "explicatie": "Curs 2, §2.2 (3/7) și Capitol 2: proiectanții caută să încorporeze mai multe procesoare într-un singur CI; ca și MCM, cresc performanțele și reduc consumul; „totuși oferta de cipuri multiprocesor este limitată la câteva dispozitive”. Varianta b descrie seturile de circuite.", "sigur": true, "figura": ""}, {"id": "c2-n124", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Referitor la seturile de circuite, sunt adevărate afirmațiile:", "variante": ["un procesor PDS este „împărțit” în două sau mai multe capsule separate", "divizarea este justificată când procesorul e foarte complex și numărul de pini I/O nu poate fi asigurat de o singură capsulă", "se pot folosi capsule mai ieftine, deci se reduce prețul de cost", "crește flexibilitatea, proiectantul putând combina circuitele în configurația cea mai potrivită aplicației"], "corecte": [0, 1, 2, 3], "explicatie": "Curs 2, §2.2 (4/7): toate cele patru afirmații sunt preluate din curs (exemplu: setul Butterfly PDS cu generator de adrese și procesor).", "sigur": true, "figura": ""}, {"id": "c2-n125", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Abordarea cu nuclee PDS combină beneficiile procesoarelor PDS cu avantajele circuitelor realizate la cerere. Care sunt beneficiile care provin de la procesoarele PDS?", "variante": ["programabilitatea", "costurile reduse de producție", "existența unor instrumente pentru dezvoltare și a bibliotecilor de software", "gabaritul redus și puterea consumată redusă"], "corecte": [0, 2], "explicatie": "Curs 2, §2.2 (5/7): beneficiile procesoarelor PDS sunt „programabilitatea, existența unor instrumente pentru dezvoltare și a bibliotecilor de software”; costurile reduse de producție, gabaritul redus și puterea consumată redusă sunt avantajele circuitelor realizate la cerere.", "sigur": true, "figura": ""}, {"id": "c2-n126", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Un nucleu PDS:", "variante": ["este un procesor PDS destinat folosirii ca bloc de construcție la realizarea unui circuit mai complex", "este întotdeauna încapsulat de sine stătător într-un cip", "permite, într-un ASIC, integrarea unui PDS programabil, a logicii de interfață, a perifericelor și a memoriei într-un singur circuit integrat", "include, la toate firmele, procesorul, memoria și perifericele"], "corecte": [0, 2], "explicatie": "Curs 2, §2.2 (5/7, Nuclee PDS 2/2): nucleul e un bloc de construcție, „în loc de a fi încapsulat de sine stătător într-un cip”; ASIC-ul bazat pe nucleu integrează PDS programabil, logică de interfață, periferice, memorie. Capitol 2: firmele definesc diferit nucleul (TI: procesor + memorie + periferice; Clarkspur/PDS Group: fără periferice; SGS-Thomson: numai procesorul).", "sigur": true, "figura": ""}, {"id": "c2-n127", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Care sunt limitările nucleelor PDS?", "variante": ["la nucleele produse chiar de furnizor, cumpărătorul nu are acces la proiectul intern, iar modificările făcute de furnizor sunt deseori costisitoare", "la nucleele cu licență clientul nu primește proiectul intern al circuitului", "la nucleele cu licență este nevoie de experiență pentru a executa modificările", "modificarea arhitecturii nucleului impune și modificarea instrumentelor pentru dezvoltarea software-ului (asamblor, linker, simulator)"], "corecte": [0, 2, 3], "explicatie": "Curs 2, §2.2 (6/7), Procesoare PDS personalizate: cele trei limitări sunt a, c și d. La nucleele cu licență „proiectul intern al circuitului este disponibil la client”, deci b e falsă.", "sigur": true, "figura": ""}, {"id": "c2-n128", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Referitor la furnizorii de nuclee PDS, sunt adevărate afirmațiile:", "variante": ["furnizorii din prima categorie asigură și producerea circuitului ASIC care conține nucleul PDS", "furnizorii din a doua categorie dau licența pentru nucleu, iar clientul își alege singur fabricantul de cip", "Texas Instruments și SGS-Thomson oferă nuclee numai sub licență", "la nucleele sub licență clientul primește descrierea completă și poate modifica nucleul"], "corecte": [0, 1, 3], "explicatie": "Capitol 2, §2.2 – Nuclee PDS: cele două categorii de furnizori sunt a și b; „Firmele Texas Instruments și SGS-Thomson sunt furnizori din prima categorie” (produc ei ASIC-ul), deci c e falsă; la licență clientul primește descrierea completă și poate modifica nucleul (adesea în VHDL/Verilog).", "sigur": true, "figura": ""}, {"id": "c2-n129", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Procesoarele PDS personalizate („customizabile”):", "variante": ["presupun modificarea sau extinderea nucleului PDS însuși", "sunt o alternativă la adăugarea de circuite externe în jurul nucleului", "pot primi, de exemplu, o unitate pentru corecția erorilor de codare sau pentru manipularea biților la calea de date", "sunt procesoare de uz general cu programe stocate în ROM"], "corecte": [0, 1, 2], "explicatie": "Curs 2, §2.2 (6/7) și Capitol 2: „este nevoie ca însuși nucleul PDS să fie modificat sau extins (o alternativă la adăugarea în jurul nucleului de circuite externe)”, ex. o unitate pentru corecția erorilor de codare sau manipularea biților. Programele în ROM țin de hardware-ul la cerere (§2.3), pe procesoare PDS standard.", "sigur": true, "figura": ""}, {"id": "c2-n130", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Procesoarele create special pentru sisteme multiprocesor (ex. TMS320C4x, DSP96002) au facilități suplimentare precum:", "variante": ["magistrale externe multiple", "logică de arbitraj a magistralei", "porturi multiple dedicate pentru comunicații interprocesor", "un singur port serial partajat"], "corecte": [0, 1, 2], "explicatie": "Curs 2, §2.2 (7/7): „Aceste procesoare au facilități suplimentare (cum sunt magistrale externe multiple, logica de arbitraj a magistralei, porturi multiple dedicate pentru comunicații interprocesor) care simplifică proiectarea hardware și îmbunătățesc performanțele.”", "sigur": true, "figura": ""}, {"id": "c2-n131", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Despre multiprocesoare sunt adevărate afirmațiile:", "variante": ["nevoile unei clase largi de aplicații nu pot fi satisfăcute de un singur procesor PDS", "în configurații multiprocesor pot fi folosite doar procesoare concepute special pentru acest scop", "dacă programabilitatea este importantă, o soluție bună sunt sistemele multiprocesor cu procesoare comerciale", "aproape orice procesor comercial poate fi utilizat în configurații multiprocesor"], "corecte": [0, 2, 3], "explicatie": "Curs 2, §2.2 (7/7): „nevoile pentru o largă clasă de aplicații nu pot fi satisfăcute de un singur procesor”; dacă programabilitatea e importantă – multiprocesor cu procesoare comerciale; „aproape orice procesor comercial poate fi utilizat în configurații multiprocesor”. Procesoarele speciale există, dar nu sunt obligatorii.", "sigur": true, "figura": ""}, {"id": "c2-n132", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Alternativele pentru procesoarele PDS prezentate în curs sunt:", "variante": ["microprocesoarele de uz general", "modulele multicip", "calculatoarele personale și stațiile de lucru", "hardware-ul personalizat"], "corecte": [0, 2, 3], "explicatie": "Curs 2, §2.3 (1/3–3/3): alternativele sunt microprocesoarele de uz general, calculatoarele personale și stațiile de lucru, hardware-ul personalizat. Modulele multicip sunt o variantă constructivă (§2.2).", "sigur": true, "figura": ""}, {"id": "c2-n133", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Motivele pentru care microprocesoarele de uz general sunt folosite totuși în aplicații PDS sunt:", "variante": ["sunt mai rapide și mai eficiente decât procesoarele PDS pentru aplicații PDS", "multe produse conțin deja un microprocesor pentru control, interfața cu utilizatorul și comunicare, deci adăugarea aplicației PDS e avantajoasă ca și cost", "instrumentele software pentru dezvoltare sunt în general mai sofisticate și mai puternice decât cele pentru procesoarele PDS", "au periferice dedicate pentru interfațarea directă cu convertoarele A/D și D/A"], "corecte": [1, 2], "explicatie": "Curs 2, §2.3 (1/3): procesoarele de uz general sunt „mai lente și mai puțin eficiente decât procesoarele PDS”, dar există două motive: costul (microprocesorul există deja în produs) și instrumentele software mai sofisticate și mai puternice (pentru aplicații cu performanțe nu foarte stricte).", "sigur": true, "figura": ""}, {"id": "c2-n134", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Prelucrările PDS executate numai software pe calculatoare personale sau stații de lucru sunt viabile:", "variante": ["acolo unde cerințele pentru prelucrări nu sunt stricte", "acolo unde este deja disponibil un calculator personal sau o stație de lucru", "pentru aplicații științifice sau inginerești de analiză sau sinteză fără restricții de timp real", "pentru aplicații care cer o frecvență de eșantionare foarte mare"], "corecte": [0, 1, 2], "explicatie": "Curs 2, §2.3 (2/3): produsele cu prelucrări numai soft sunt viabile unde cerințele nu sunt stricte și unde există deja PC/stație; multe aplicații științifice sau inginerești fără restricții de timp real pot fi executate așa. La frecvențe de eșantionare mari unica opțiune e hardware-ul la cerere (Capitol 2).", "sigur": true, "figura": ""}, {"id": "c2-n135", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Rațiunile importante pentru care hardware-ul dezvoltat la cererea clientului este uneori o alegere mai bună decât un procesor PDS sunt:", "variante": ["performanțele", "costurile reduse de proiectare", "prețul de producție", "instrumentele software de dezvoltare mai sofisticate"], "corecte": [0, 2], "explicatie": "Curs 2, §2.3 (3/3): „Există două rațiuni importante ... performanțele și prețul de producție.” Costurile proiectării sunt tocmai dificultatea cea mai evidentă a hardware-ului la cerere; instrumentele sofisticate sunt avantajul microprocesoarelor de uz general.", "sigur": true, "figura": ""}, {"id": "c2-n136", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Pentru produse de masă, hardware-ul realizat la cerere este mai puțin costisitor decât un procesor PDS deoarece:", "variante": ["plasează în hardware numai acele funcțiuni care sunt necesare aplicației", "costurile de proiectare sunt neglijabile", "la un procesor PDS se plătește de fiecare dată pentru toate funcțiunile, chiar dacă unele sunt foarte puțin folosite", "folosește numai componente logice standard"], "corecte": [0, 2], "explicatie": "Curs 2, §2.3 (3/3): „o implementare la cererea clientului plasează în hardware numai acele funcțiuni care sunt necesare aplicației, în timp ce pentru un procesor PDS se plătește de fiecare dată pentru toate funcțiunile”. Costurile proiectării sunt principala dificultate, nu sunt neglijabile.", "sigur": true, "figura": ""}, {"id": "c2-n137", "curs": 2, "tip": "nou", "sursa": "nou", "intrebare": "Plăcile de circuit imprimat proiectate la cerere pentru aplicații PDS pot include:", "variante": ["dispozitive logice standard", "unități aritmetice cu funcții fixe sau configurabile", "arii de porți FPGA", "circuite integrate pentru funcții specifice (FASIC)"], "corecte": [0, 1, 2, 3], "explicatie": "Capitol 2, §2.3 – Hardware custom: plăcile „pot include dispozitive logice standard, unități aritmetice cu funcții fixe sau configurabile, arii de porți FPGA și circuite integrate pentru funcții sau specifice aplicațiilor (FASIC)”. Lista completă apare doar în Capitol 2.", "sigur": true, "figura": ""}, {"id": "c3-n138", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Conform Fig. 3.1, cele mai folosite reprezentări numerice ale procesoarelor DSP comerciale sunt:", "variante": ["virgulă mobilă pe 16 biți, în format IEEE 754;", "virgulă fixă pe 16, 20 sau 24 de biți;", "virgulă fixă pe 64 de biți;", "virgulă mobilă pe 32 de biți, în format IEEE 754 sau în alt format;"], "corecte": [1, 3], "explicatie": "Capitol 3, introducere, Fig. 3.1: Fixed-Point → 16/20/24 biți; Floating-Point → 32 biți → IEEE 754 / Other.", "sigur": true, "figura": ""}, {"id": "c3-n139", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Referitor la aritmetica întreagă și cea fracționară la procesoarele DSP cu virgulă fixă, sunt adevărate:", "variante": ["algoritmii și hardware-ul folosite pentru aritmetica fracționară sunt virtual identici cu cei pentru aritmetica cu întregi;", "aritmetica fracționară este mai folositoare pentru algoritmii de procesare a semnalului;", "folosind aritmetica cu întregi pe un DSP cu virgulă fixă, uneori calculele consumă mai mult timp sau sunt supuse unor constrângeri decât cu aritmetica fracționară;", "aritmetica cu întregi este folosită pentru operații de control și calculul adreselor;"], "corecte": [0, 1, 2, 3], "explicatie": "Capitol 3, §3.1: hardware virtual identic; „prima [fracționara] este mai folositoare pentru algoritmii de procesare a semnalului, în timp ce a doua este utilizată pentru operații de control, calculul adreselor…”; „folosind aritmetica cu întregi pe un DSP cu virgulă fixă uneori calculele consumă mai mult timp sau sunt supuse unor constrângeri”. Toate patru sunt adevărate.", "sigur": true, "figura": ""}, {"id": "c3-n140", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Valoarea zecimală a numărului 10101100, în virgulă fixă cu aritmetică întreagă pe 8 biți (complement față de 2), este:", "variante": ["172", "84", "-44", "-84"], "corecte": [3], "explicatie": "Curs 3, slide aritmetică întreagă, Exemplul 2: –2^7 + 2^5 + 2^3 + 2^2 = –128 + 32 + 8 + 4 = –84. 172 = citire fără semn.", "sigur": true, "figura": ""}, {"id": "c3-n141", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Numărul 11010000, în virgulă fixă cu aritmetică fracționară pe 8 biți, are valoarea:", "variante": ["-48", "-0,375", "0,8125", "-0,625"], "corecte": [1], "explicatie": "Curs 3, slide aritmetică fracționară (ponderi –2^0, 2^-1, 2^-2, …): –1 + 0,5 + 0,125 = –0,375. 0,8125 = fără semn, –48 = citire ca întreg.", "sigur": true, "figura": ""}, {"id": "c3-n142", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Pentru formatul fracționar în virgulă fixă pe 8 biți (complement față de 2), sunt adevărate:", "variante": ["cea mai mică valoare reprezentabilă este -1,0;", "valoarea +1,0 se poate reprezenta exact;", "cea mai mică valoare pozitivă nenulă este 2^-7 = 0,0078125;", "cea mai mare valoare reprezentabilă este 1 - 2^-7 = 0,9921875;"], "corecte": [0, 2, 3], "explicatie": "Ponderile din slide-ul de aritmetică fracționară: –2^0 pentru bitul de semn, apoi 2^-1 … 2^-7. Minim 1000 0000 = –1; maxim 0111 1111 = 1 – 2^-7; pasul 2^-7. Analog cu exemplul pe 32 de biți din §3.1 (min 2^-31, max 1,0 – 2^-31); +1 nu încape.", "sigur": true, "figura": ""}, {"id": "c3-n143", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "În aritmetica cu virgulă mobilă:", "variante": ["valoarea reprezentată este mantisa × 10^exponent;", "mantisa este de obicei valoarea fracționară a semnalului;", "exponentul este un întreg care reprezintă numărul de ranguri binare cu care virgula mantisei trebuie deplasată la stânga sau la dreapta;", "valoarea reprezentată este exponent × 2^mantisa;"], "corecte": [1, 2], "explicatie": "Curs 3 / Capitol 3, §3.1: definițiile mantisei și exponentului; relația este „valoare = mantisa × 2^exponent”.", "sigur": true, "figura": ""}, {"id": "c3-n144", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Pentru numărul în virgulă mobilă 0100000000111110 (mantisa pe 10 biți, exponentul pe 6 biți), sunt adevărate:", "variante": ["valoarea numărului este 2;", "mantisa are valoarea 0,5;", "valoarea numărului este 0,125;", "exponentul are valoarea -2;"], "corecte": [1, 2, 3], "explicatie": "Curs 3, slide 10: mantisa 0100000000 = 2^-1 = 0,5; exponent 111110 = –32+16+8+4+2 = –2; 0,5 × 2^-2 = 0,125. 2 ar rezulta cu exponent +2.", "sigur": true, "figura": ""}, {"id": "c3-n145", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Despre precizie (Curs 3), sunt adevărate:", "variante": ["eroarea de cuantizare apare atunci când un format de număr mai lung este convertit la unul mai scurt;", "definiția preciziei este bazată pe ideea erorii de cuantizare;", "cu cât eroarea de cuantizare posibilă este mai mare față de mărimea valorii reprezentate, cu atât precizia este mai mare;", "pentru un format cu virgulă fixă, precizia maximă posibilă este egală cu numărul de biți din format;"], "corecte": [0, 1, 3], "explicatie": "Curs 3 / Capitol 3, §3.1 Precizia: (c) este inversată – „cu atât precizia este mai mică”.", "sigur": true, "figura": ""}, {"id": "c3-n146", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Precizia maximă a unui format fracționar pe 16 biți, știind că la conversia prin rotunjire eroarea maximă de cuantizare este 2^-16, este:", "variante": ["15 biți", "8 biți", "32 de biți", "16 biți"], "corecte": [3], "explicatie": "Capitol 3, §3.1: Precizia maximă = log2(|valoarea maximă| / |eroarea maximă de cuantizare|) = log2(1 / 2^-16) = 16 biți, „aceeași cu lungimea totală a formatului”.", "sigur": true, "figura": ""}, {"id": "c3-n147", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Despre gama dinamică, sunt adevărate:", "variante": ["folosind același număr de biți, formatul cu virgulă mobilă asigură o gamă dinamică mult mai mare decât cel cu virgulă fixă;", "pentru formatul fracționar în virgulă fixă pe 32 de biți este aproximativ 2,15 × 10^9 (≈ 187 dB);", "este raportul dintre cel mai mare și cel mai mic număr reprezentabil într-un anumit format de date;", "pentru formatul în virgulă mobilă pe 32 de biți (mantisă 24 biți, exponent 8 biți) este aproximativ 5,79 × 10^76 (peste 1535 dB);"], "corecte": [0, 1, 2, 3], "explicatie": "Curs 3 / Capitol 3, §3.1 Gama dinamică: definiția (raport), valorile numerice (2,15·10^9 ≈ 187 dB; 5,79·10^76 > 1535 dB) și concluzia „folosind același număr de biți, formatul cu virgulă mobilă asigură o gamă dinamică mult mai mare”. Toate patru sunt adevărate (capcană: gama e raport, nu diferență).", "sigur": true, "figura": ""}, {"id": "c3-n148", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Gama dinamică a unui format fracționar în virgulă fixă pe 16 biți (min 2^-15, max 1 - 2^-15) este aproximativ:", "variante": ["90 dB", "187 dB", "50 dB", "1535 dB"], "corecte": [0], "explicatie": "Definiția din §3.1: raport max/min = (1 – 2^-15)/2^-15 = 32767; 20·log10(32767) ≈ 90,3 dB (≈ 6,02 dB/bit × 15). Același calcul pentru 32 de biți dă 187 dB, ca în capitol. Coincide cu cerința de ≈ 90 dB pentru audio de înaltă fidelitate.", "sigur": true, "figura": ""}, {"id": "c3-n149", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Referitor la gama dinamică necesară aplicațiilor, sunt adevărate:", "variante": ["pentru aplicații în telecomunicații o gamă dinamică de 50 dB este în general suficientă;", "toate aplicațiile au nevoie de aceeași gamă dinamică;", "pentru aplicații audio de fidelitate înaltă este nevoie de un domeniu de 90 dB;", "o gamă dinamică mai mare decât cerințele minime este adesea utilă, degrevând programatorul de o parte din problemele de scalare;"], "corecte": [0, 2, 3], "explicatie": "Capitol 3, §3.1 Gama dinamică: „Aplicații diferite au nevoie de game dinamice diferite” (deci (b) fals); telecom 50 dB, audio hi-fi 90 dB; gama mai mare „degrevând programatorul de o parte din problemele de scalare”.", "sigur": true, "figura": ""}, {"id": "c3-n150", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Procesoarele DSP cu virgulă mobilă sunt, în general, mai scumpe decât cele cu virgulă fixă deoarece:", "variante": ["lungimea mai mare a cuvintelor necesită memorii externe mai mari, mărind costul total al sistemului;", "necesită un circuit mai complex, care implică un cip mai mare;", "necesită emularea software a operațiilor aritmetice;", "lungimea mai mare a cuvintelor necesită creșterea dimensiunii magistralelor externe;"], "corecte": [0, 1, 3], "explicatie": "Capitol 3, §3.1: „Costul ridicat este datorat circuitului mai complex… cip mai mare. În plus, lungimea mai mare a cuvintelor… necesită creșterea dimensiunii magistralelor externe și a memoriilor externe”. Emularea software se folosește pe procesoarele cu virgulă fixă (§3.4).", "sigur": true, "figura": ""}, {"id": "c3-n151", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "La un procesor cu virgulă fixă, programatorul:", "variante": ["stabilește gama dinamică și precizia necesare analitic sau prin simulare, apoi adaugă operații de scalare în cod dacă este necesar;", "este degrevat de sarcina controlului gamei dinamice și a preciziei;", "nu poate folosi aritmetica fracționară;", "trebuie să fie atent adesea la scalarea datelor în diverse stadii ale programului;"], "corecte": [0, 3], "explicatie": "Curs 3 / Capitol 3, §3.1: scalarea la virgulă fixă; „programatorii… stabilesc gama dinamică și precizia necesară… fie analitic, fie prin simulare, și apoi adaugă operații de scalare”. Degrevarea de controlul gamei/preciziei este avantajul virgulei mobile.", "sigur": true, "figura": ""}, {"id": "c3-n152", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Procesoarele cu virgulă mobilă sunt mai potrivite pentru aplicații:", "variante": ["mai puțin sensibile la cost;", "unde programarea mai ușoară este mai importantă;", "dedicate, unde prioritatea o reprezintă costul scăzut;", "cu cerințe stricte pentru gama dinamică și precizie;"], "corecte": [0, 1, 3], "explicatie": "Curs 3 / Capitol 3, §3.1: „Cea mai mare parte a aplicațiilor dedicate folosesc procesoare cu virgulă fixă pentru că prioritatea o reprezintă costul scăzut. Pentru aplicații mai puțin sensibile la cost, sau cu cerințe stricte… sau unde programarea mai ușoară este mai importantă, sunt mai potrivite procesoarele cu virgulă mobilă.”", "sigur": true, "figura": ""}, {"id": "c3-n153", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Lungimea nativă a cuvintelor pentru reprezentarea datelor într-un procesor DSP este:", "variante": ["lungimea datelor pe care magistralele procesorului și calea datelor o pot manipula într-un singur ciclu instrucțiune;", "lungimea maximă a datelor obținută prin precizie extinsă;", "lungimea cuvintelor instrucțiune din memoria de program;", "lungimea registrului acumulator, inclusiv biții de gardă;"], "corecte": [0], "explicatie": "Curs 3 / Capitol 3, §3.2: definiția citată în (a). Cuvintele de instrucțiune pot avea altă lungime (§3.5/3.6), iar precizia extinsă depășește tocmai formatul nativ (§3.3).", "sigur": true, "figura": ""}, {"id": "c3-n154", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Conform cursului, privind lungimea nativă a cuvintelor de date, sunt corecte asocierile:", "variante": ["procesoare cu virgulă fixă – cea mai folosită lungime este 16 biți;", "DSP5600x și DSP563xx (Motorola) – 24 de biți;", "DSP-urile cu virgulă mobilă uzuale – 16 biți;", "ZR3800x (Zoran) – 20 de biți;"], "corecte": [0, 1, 3], "explicatie": "Capitol 3, §3.2: „Pentru procesoarele cu virgulă fixă cea mai folosită lungime este 16 biți. DSP5600x și DSP563xx (Motorola) folosesc cuvinte pe 24 biți, ZR3800x (Zoran) 20 biți”. DSP-urile cu virgulă mobilă uzuale: 32 de biți (slide: 32 sau 64).", "sigur": true, "figura": ""}, {"id": "c3-n155", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Mărimea cuvintelor are un impact major asupra costului procesorului deoarece influențează:", "variante": ["mărimea și numărul dispozitivelor de memorie externă conectate la procesor;", "mărimea cipului;", "modul de manipulare a rezultatelor multiplicărilor;", "numărul de pini ai capsulei (package pins);"], "corecte": [0, 1, 3], "explicatie": "Curs 3 / Capitol 3, §3.2: lista citată. (c) este diferența dintre aritmetica întreagă și cea fracționară (§3.1).", "sigur": true, "figura": ""}, {"id": "c3-n156", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Precizia extinsă:", "variante": ["se poate obține prin suport încorporat pentru un format cu precizie extinsă, pentru operații care au loc exclusiv în interiorul căii de date;", "înseamnă folosirea reprezentărilor care asigură o precizie mai mare decât cea oferită de formatul de date nativ al procesorului;", "este mai rapidă decât aritmetica în precizie simplă;", "se poate obține prin construirea unor cuvinte mai mari din secvențe de cuvinte de date native;"], "corecte": [0, 1, 3], "explicatie": "Curs 3 / Capitol 3, §3.3: definiția și cele două moduri; „aritmetica cu precizie extinsă este mult mai lentă decât precizia simplă” (fiecare operație = secvență de instrucțiuni simple).", "sigur": true, "figura": ""}, {"id": "c3-n157", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Suportul pentru aritmetica în precizie extinsă oferit de unele procesoare include:", "variante": ["posibilitatea de a considera operanzii multiplicării ca numere cu sau fără semn, sub controlul programului;", "posibilitatea de a păstra bitul de transport (carry) rezultat dintr-o adunare în precizie simplă, pentru a fi folosit într-o adunare ulterioară;", "conversia hardware în formatul IEEE-754;", "instrucțiunea de detecție a exponentului;"], "corecte": [0, 1], "explicatie": "Capitol 3, §3.3: cele două facilități (b), (a). Detecția exponentului ține de virgula mobilă pe bloc (§3.4), conversia IEEE de §3.5 (capitol).", "sigur": true, "figura": ""}, {"id": "c3-n158", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Despre emularea virgulei mobile pe un procesor cu virgulă fixă, sunt adevărate:", "variante": ["se folosesc rutine software care emulează comportamentul unui procesor cu virgulă mobilă;", "dacă o parte semnificativă a calculelor e în virgulă mobilă, emularea este mai potrivită decât un procesor cu virgulă mobilă;", "rutinele sunt foarte scumpe în număr de tacte, deci emularea e potrivită doar dacă o parte foarte mică a calculelor implică virgula mobilă;", "unii producători furnizează biblioteci de rutine de emulare; dacă nu există, rutinele trebuie scrise de utilizator;"], "corecte": [0, 2, 3], "explicatie": "Curs 3 / Capitol 3, §3.4: „Dacă o parte semnificativă de aritmetică în virgulă mobilă este necesară, atunci un procesor cu virgulă mobilă este alegerea mai potrivită” → (b) fals.", "sigur": true, "figura": ""}, {"id": "c3-n159", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "În reprezentarea cu virgulă mobilă pe bloc:", "variante": ["exponentul comun este înmagazinat într-un cuvânt de date separat;", "un grup de numere cu aceeași mantisă, dar exponenți diferiți, este tratat ca un bloc;", "un grup de numere cu mantise diferite, dar un singur exponent, este tratat ca un bloc de date;", "exponentul este stocat ca parte a fiecărui cuvânt de date, ca la virgula mobilă de uz general;"], "corecte": [0, 2], "explicatie": "Curs 3 / Capitol 3, §3.4: „În loc ca exponentul să fie stocat ca o parte a fiecărui cuvânt de date, așa cum se face în cazul virgulei mobile de uz general, exponentul comun este înmagazinat într-un cuvânt de dată separat.”", "sigur": true, "figura": ""}, {"id": "c3-n160", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Câte locații de memorie sunt necesare pentru stocarea unui bloc de opt valori de date în format virgulă mobilă pe bloc?", "variante": ["9", "8", "16", "2"], "corecte": [0], "explicatie": "Capitol 3, §3.4: „stocarea întregului bloc de opt valori… ar necesita nouă locații de memorie (opt pentru mantise și una pentru exponent)”. 16 = fiecare valoare cu exponentul ei.", "sigur": true, "figura": ""}, {"id": "c3-n161", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "La virgula mobilă pe bloc, referitor la exponentul blocului, sunt adevărate:", "variante": ["un bloc cu valori mari se deplasează la stânga doar câteva poziții sau deloc, rezultând un exponent negativ mic sau nul;", "dacă datele nu pot fi deplasate, precizia rezultată este aceeași ca la folosirea directă a formatului nativ în virgulă fixă;", "un bloc format numai din valori mici permite deplasarea lor la stânga cu mai multe poziții, rezultând un exponent negativ relativ mare;", "este determinat în general de elementul din bloc cu cea mai mare magnitudine;"], "corecte": [0, 1, 2, 3], "explicatie": "Capitol 3, §3.4: toate patru afirmațiile sunt (aproape) citate din text: exponentul e dat de elementul cu cea mai mare magnitudine; valori mici → deplasare (ex. 7 poziții) la stânga → exponent negativ relativ mare; valori mari → exponent negativ mic sau nul; fără deplasare → aceeași precizie ca formatul nativ.", "sigur": true, "figura": ""}, {"id": "c3-n162", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Referitor la conversia în formatul virgulă mobilă pe bloc, sunt adevărate:", "variante": ["unele procesoare au hardware specializat pentru conversia datelor în acest format;", "instrucțiunea de „detecție a exponentului” calculează deplasarea necesară pentru a converti un rezultat intermediar de precizie înaltă (de ex. din acumulator) în virgulă mobilă pe bloc;", "conversia între formatul nativ în virgulă fixă și formatul virgulă mobilă pe bloc este executată de programator prin software;", "instrucțiunea de „detecție a exponentului” convertește datele în format IEEE-754;"], "corecte": [0, 1, 2], "explicatie": "Curs 3 / Capitol 3, §3.4: (a), (b), (c) citate; IEEE-754 nu are legătură cu detecția exponentului.", "sigur": true, "figura": ""}, {"id": "c3-n163", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Procesoarele familiei TMS320C54 (TI) au, ca suport pentru virgula mobilă pe bloc:", "variante": ["instrucțiunea EXP, pentru calculul exponentului unei date;", "suport hardware complet pentru precizia simplă IEEE-754;", "instrucțiunea NORM, care separă mantisa de exponent după ce a fost executată instrucțiunea EXP;", "instrucțiunea NORM, care se execută înaintea instrucțiunii EXP;"], "corecte": [0, 2], "explicatie": "Capitol 3, §3.4: „instrucțiunea EXP pentru calculul exponentului unei date; instrucțiunea NORM separă mantisa de exponent după ce a fost executată instrucțiunea EXP”. Suport IEEE complet pentru precizia simplă are DSP96002 (Motorola).", "sigur": true, "figura": ""}, {"id": "c3-n164", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Despre standardul IEEE-754, conform cursului, sunt adevărate:", "variante": ["specifică algoritmii de rotunjire și modul de tratare a condițiilor de excepție aritmetică, precum împărțirea la zero sau depășirea;", "precizia simplă are 32 de biți, cu 24 de biți mantisa și 8 biți exponentul;", "mantisa și exponentul sunt reprezentate ca numere fără semn;", "a fost lansat în 1985 de Institutul de inginerie electrică și electronică;"], "corecte": [0, 1, 3], "explicatie": "Capitol 3, §3.5: (a), (b), (d) citate; „Atât mantisa cât și exponentul sunt reprezentate ca numere cu semn” → (c) fals.", "sigur": true, "figura": ""}, {"id": "c3-n165", "curs": 3, "tip": "nou", "sursa": "nou", "intrebare": "Referitor la relația dintre mărimea cuvintelor pentru date și a celor pentru instrucțiuni, sunt adevărate:", "variante": ["majoritatea procesoarelor DSP folosesc cuvinte pentru instrucțiuni de lungime egală cu cea a cuvintelor pentru date;", "ADSP-21xx
